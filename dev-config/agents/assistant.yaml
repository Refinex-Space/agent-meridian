# 开发用的智能体版本（FileAgentConfigProvider，T06）。T15b 起智能体配置由 control-plane 下发，本目录只留给开发与测试。
# 字段与 engine-spi 的 ResolvedAgentSpec 一致（snake_case，枚举取小写值）；会话的 agent_version_id 引用这里的 ID。
kind: agent_version
agent_id: agt_dev_assistant
agent_version_id: agv_dev_assistant_1
name: assistant
model:
  # 模型目录的模型 ID，见 dev-config/providers/dashscope.yaml（T09a 的 RoutedModel 经它解析供应商与凭据）
  model_id: mdl_dev_default
system_prompt: 你是企业内的通用助手，回答简洁、准确。
# 平台文件工具（T10a）：读类工具放行，写类工具默认需要确认（DEFAULT 模式下没有命中 allow 的调用都要确认）
# 联网工具（T10b）：web_fetch、web_search 默认需要确认；web_search 的后端见 tenant-dev.yaml
tools: [read_file, list_files, glob_files, grep_files, write_file, edit_file, web_fetch, web_search]
mcp_servers: []
# 技能内容在 dev-config/skills/<skill_id>/v<version>/（FileAgentConfigProvider）
skills:
  - skill_id: skl_dev_weekly_report
    version: 1
    name: weekly-report
subagents: []
permissions:
  mode: default
  rules:
    - {tool_name: read_file, behavior: allow, layer: agent_version}
    - {tool_name: list_files, behavior: allow, layer: agent_version}
    - {tool_name: glob_files, behavior: allow, layer: agent_version}
    - {tool_name: grep_files, behavior: allow, layer: agent_version}
compaction:
  reserved_tokens: 20000
plan_mode: false
knowledge:
  knowledge_base_ids: []
  prefetch: false
  prefetch_top_k: 5
max_iters: 50
expose_thinking: false

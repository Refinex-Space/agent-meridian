# 集成测试：数据源、Flyway 与 Redis 的连接由测试类的 @DynamicPropertySource 从 Testcontainers 注入（meridian-test-support）。
meridian:
  runtime:
    dispatch:
      node-id: test-node
    agent-config:
      # 测试默认读临时目录中的智能体配置与 rt.permission_rules（ADR-0047）；经 control-plane 读取的测试显式设为 control-plane
      source: file
    model-routing:
      # 测试默认读临时目录中的供应商配置（ADR-0045）；经 control-plane 解析的测试显式设为 control-plane
      catalog-source: file
      # 测试默认读临时目录中的预算限额（没有配置的级别不限）；经 control-plane 下发限额的测试显式设为 control-plane（ADR-0048）
      budget-source: file
      # 模拟供应商在回环地址上
      allow-loopback-endpoints: true
    webhook:
      # 测试不运行投递器的定期任务（多个 Spring 上下文共用一个库，任一上下文都会扇出别的测试写入的事件）；Webhook 的测试手动驱动
      # WebhookDispatcher.runOnce()（T17a）。接收方在回环地址上
      enabled: false
      allow-loopback: true
    retention:
      # 测试不运行会话清理、归档与保留清理的定期任务（跨租户扫描共用的库）；相关测试手动驱动（T17a）
      enabled: false
    stats:
      # 测试不运行失败率的小时汇总（共用的库、共用的水位）；相关测试手动驱动 TurnStatsRollup.rollUpTo（T19b）
      enabled: false

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    cn.refinex.meridian: DEBUG

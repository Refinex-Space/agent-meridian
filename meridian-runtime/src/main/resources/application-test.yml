# 集成测试：数据源、Flyway 与 Redis 的连接由测试类的 @DynamicPropertySource 从 Testcontainers 注入（meridian-test-support）。
meridian:
  runtime:
    dispatch:
      node-id: test-node
    agent-config:
      # 测试默认读临时目录中的智能体配置与 rt.permission_rules（ADR-0047）；经 control-plane 读取的测试显式设为 control-plane
      source: file
    model-routing:
      # 测试默认读临时目录中的供应商配置（ADR-0045）；经 control-plane 解析的测试显式设为 control-plane
      catalog-source: file
      # 模拟供应商在回环地址上
      allow-loopback-endpoints: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    cn.refinex.meridian: DEBUG

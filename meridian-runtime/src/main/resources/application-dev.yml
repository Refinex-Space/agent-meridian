# 本地开发：连接 scripts/dev/up.sh 启动的 compose（端口见 deploy/compose/.env.example）。
# 口令只从环境变量读取：MERIDIAN_APP_PASSWORD、MERIDIAN_MIGRATOR_PASSWORD。
spring:
  datasource:
    url: ${MERIDIAN_DB_URL:jdbc:postgresql://localhost:15432/meridian}
    username: meridian_app
    password: ${MERIDIAN_APP_PASSWORD}
  flyway:
    user: meridian_migrator
    password: ${MERIDIAN_MIGRATOR_PASSWORD}
  data:
    redis:
      host: ${MERIDIAN_REDIS_HOST:localhost}
      port: ${MERIDIAN_REDIS_PORT:16379}

meridian:
  security:
    service-client:
      # API Key 经 control-plane 校验、租户配额从 control-plane 读取（T14a，ADR-0042）：先启动 scripts/dev/run-control-plane.sh。
      # 出站的开发期服务凭据与入站相同，只在 dev、test profile 允许，T14b 起改为服务 JWT
      control-plane-url: ${MERIDIAN_CONTROL_PLANE_URL:http://localhost:18081}
      credential: ${MERIDIAN_DEV_SERVICE_CREDENTIAL}
    dev-service-credentials:
      # 内部接口的开发期服务凭据（T09b）：只在 dev、test profile 允许启用，T14b 起改为服务 JWT；明文从环境变量读取
      enabled: true
      credentials:
        - credential: ${MERIDIAN_DEV_SERVICE_CREDENTIAL}
          service: knowledge
  persistence:
    objectstore:
      # scripts/dev/up.sh 启动的 MinIO 与创建的桶；凭据只从环境变量读取（compose 的 env 文件）
      endpoint: http://localhost:${MERIDIAN_MINIO_PORT:19000}
      region: us-east-1
      bucket: ${MERIDIAN_S3_BUCKET:meridian}
      access-key: ${MINIO_ROOT_USER}
      secret-key: ${MINIO_ROOT_PASSWORD}
      path-style-access: true

management:
  endpoint:
    health:
      show-details: always

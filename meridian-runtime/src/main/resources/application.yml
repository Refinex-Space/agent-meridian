# runtime 的公共配置。环境相关的连接信息在 profile 中：dev 连接本地 compose，test 由 Testcontainers 注入。
spring:
  application:
    name: meridian-runtime
  jackson:
    deserialization:
      # 公开 API 的请求体：未声明的字段返回 400，不静默忽略（编码规范「通用能力复用」中 JsonMappers.strict 的约定）
      fail-on-unknown-properties: true
  http:
    codecs:
      # JSON 请求体的聚合上限（默认 256 KB）：对话补全的大上下文、长消息与工具结果回传会超过默认值（R2 审查 A-04）；
      # 上传文件与工作区写入另有 files.max-size
      max-in-memory-size: 10MB
  webflux:
    multipart:
      # 上传文件（ADR-0050）：表单解析阶段就截断超过上限的文件部分（默认无上限，会把任意大的上传落到本机磁盘）
      max-disk-usage-per-part: ${meridian.runtime.files.max-size:32MB}
      max-parts: 4
  flyway:
    # 迁移以 meridian_migrator 执行（spring.flyway.user/password），脚本位置与 schema 由 meridian-persistence 的迁移约定设置
    enabled: true

meridian:
  persistence:
    schema: rt
  security:
    service-jwt:
      # 本服务名：入站服务 JWT 的 aud，出站换取令牌的客户端 ID（ADR-0044）；客户端密钥部署时配置
      service: runtime
    oidc:
      # 控制台用户带 Meridian-Project 调用公开 API（ADR-0044）：部署时配置 issuer
      audience: meridian
  runtime:
    files:
      # 上传文件与工作区写入的大小上限（ADR-0050）
      max-size: 32MB
    dispatch:
      # 以下为架构设计「一轮执行的生命周期」规定的默认值，写在这里便于查看；节点 ID 留空时按主机名生成
      lease-ttl: 30s
      renew-interval: 10s
      renew-failure-timeout: 15s
      reap-interval: 5s
      poll-interval: 1s
      default-tenant-max-running: 20
    worker:
      # 关闭时不装配内核与 Worker，节点只提供 API（EngineAutoConfiguration）
      enabled: true
      # 默认值的来源见 WorkerProperties：并发上限、下线等待（架构设计「崩溃恢复」）、待处理动作截止时长（「待处理动作」）
      max-concurrent-turns: 300
      shutdown-timeout: 60s
      pending-action-timeout: 30m
      # 每批工具执行完成后保存状态（P3，ADR-0028）
      batch-checkpoint: true
    sse:
      # 架构设计「SSE 协议」：每 5 秒对账，每 15 秒 ping，单连接最长 60 分钟；Redis Stream 轮询间隔决定实时延迟上限
      reconcile-interval: 5s
      ping-interval: 15s
      max-connection-duration: 60m
      poll-interval: 100ms
    knowledge:
      # knowledge 服务的基础 URL（T19）：knowledge_search 与前置检索经它的内部接口检索；留空时检索以错误结果交给模型
      url:
    workspace:
      # 平台控制的本机工作区根目录（登记事项 D05）：harness 的本机回退读取落在这里，平台不在其中写入
      local-root: ${java.io.tmpdir}/meridian/agent-workspace
    sandbox:
      # 会话沙箱（T12a，ADR-0036、ADR-0037）：关闭时 sandbox 档的轮次以错误结束，none 档不受影响。
      # 本机 kind 集群：enabled: true、kube-context: kind-meridian、connection: port-forward；集群内部署用 direct 与 router-url
      enabled: false
      connection: port-forward
      namespace: meridian-sandbox
      warm-pool-prefix: sandbox-
      # 空闲回收（架构设计「会话沙箱」：10 分钟）；单个沙箱操作的等待上限，回收时它决定会话行锁最多持有多久
      idle-timeout: 10m
      reap-interval: 60s
      reap-batch-size: 20
      operation-timeout: 10m
      # bash 的超时（不超过执行服务的命令超时 exec-timeout，ADR-0036）与产物同步的单文件上限
      bash-default-timeout: 120s
      bash-max-timeout: 600s
      exec-timeout: 600s
      output-max-file-size: 64MB
    agent-config:
      # 智能体、环境、技能、租户设置与策略的来源（ADR-0047）：默认经 control-plane 的内部接口读取；file 读开发配置目录与
      # rt.permission_rules，只允许 dev、test profile。当前版本、当前修订、租户设置与策略缓存 60 秒，按 ID 的版本、修订与技能缓存
      # 10 分钟，都是 config.invalidate 丢失时的兜底
      source: control-plane
      cache-ttl: 60s
      immutable-cache-ttl: 10m
    dev-agent-config:
      # agent-config.source=file 时的开发配置目录（FileAgentConfigProvider），相对于工作目录
      directory: dev-config/agents
    model-routing:
      # 限流等待上限（架构设计「模型调用」）；预扣记录的保留时间远大于一次模型调用，过期未结算的由对账修正
      rate-limit-max-wait: 30s
      reservation-ttl: 1h
      # 供应商、模型目录与凭据（ADR-0045）：默认经 control-plane 的内部接口解析；file 只允许在 dev、test profile
      catalog-source: control-plane
      # 目录缓存 60 秒、凭据明文缓存 5 分钟，都是 config.invalidate 丢失时的兜底
      catalog-cache-ttl: 60s
      secret-cache-ttl: 5m
      # 供应商端点的地址策略：私有网段不配置时全部放行（private-networks），生产按私有化推理服务所在网段收窄
      allow-loopback-endpoints: false
      # 预算限额（ADR-0048）：默认读 control-plane 同步到 Redis 的限额，没有设置的级别为 0（新租户默认零预算）；file 只允许 test
      budget-source: control-plane
      # catalog-source=file 时的供应商目录；budget-source=file 时的预算限额（目录不存在时不限）。都相对于工作目录
      providers-directory: dev-config/providers
      budgets-directory: dev-config/budgets

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

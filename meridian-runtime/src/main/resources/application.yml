# runtime 的公共配置。环境相关的连接信息在 profile 中：dev 连接本地 compose，test 由 Testcontainers 注入。
spring:
  application:
    name: meridian-runtime
  jackson:
    deserialization:
      # 公开 API 的请求体：未声明的字段返回 400，不静默忽略（编码规范「通用能力复用」中 JsonMappers.strict 的约定）
      fail-on-unknown-properties: true
  flyway:
    # 迁移以 meridian_migrator 执行（spring.flyway.user/password），脚本位置与 schema 由 meridian-persistence 的迁移约定设置
    enabled: true

meridian:
  persistence:
    schema: rt
  runtime:
    dispatch:
      # 以下为架构设计「一轮执行的生命周期」规定的默认值，写在这里便于查看；节点 ID 留空时按主机名生成
      lease-ttl: 30s
      renew-interval: 10s
      renew-failure-timeout: 15s
      reap-interval: 5s
      poll-interval: 1s
      default-tenant-max-running: 20
    worker:
      # 默认值的来源见 WorkerProperties：并发上限、下线等待（架构设计「崩溃恢复」）、待处理动作截止时长（「待处理动作」）
      max-concurrent-turns: 300
      shutdown-timeout: 60s
      pending-action-timeout: 30m
      # 每批工具执行完成后保存状态（P3，ADR-0028）
      batch-checkpoint: true
    sse:
      # 架构设计「SSE 协议」：每 5 秒对账，每 15 秒 ping，单连接最长 60 分钟；Redis Stream 轮询间隔决定实时延迟上限
      reconcile-interval: 5s
      ping-interval: 15s
      max-connection-duration: 60m
      poll-interval: 100ms
    dev-agent-config:
      # 开发配置目录（FileAgentConfigProvider），相对于工作目录；T15b 起智能体配置改由 control-plane 下发
      directory: dev-config/agents
    model-routing:
      # 限流等待上限（架构设计「模型调用」）；预扣记录的保留时间远大于一次模型调用，过期未结算的由对账修正
      rate-limit-max-wait: 30s
      reservation-ttl: 1h
      # 开发期的供应商与模型目录（T15a 之前）、预算限额（T16 之前，目录不存在时不限），相对于工作目录
      providers-directory: dev-config/providers
      budgets-directory: dev-config/budgets

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

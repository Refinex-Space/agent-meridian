openapi: 3.1.0
info:
  title: AgentMeridian Internal API
  version: 1.0.0
  summary: 平台服务之间的内部接口：runtime 提供 Embedding、rerank 与沙箱出网授权，control-plane 提供服务令牌、API Key 校验、租户配额与设置、控制台用户的项目权限、凭据解析、模型目录、智能体配置与权限策略。
  description: |
    只供平台内部服务调用（knowledge 经 `meridian-model-client`，沙箱出网代理经 Envoy 的 Lua 过滤器，runtime 与 knowledge
    经 `meridian-security` 的服务间调用客户端访问 control-plane），不对业务系统开放，不随公开 API 发布。

    **提供方。** 标签 `InternalModels`、`InternalEgress` 由 runtime 提供；`InternalServiceTokens`、`InternalApiKeys`、
    `InternalTenants`、`InternalProjectAccess`、`InternalSecrets`、`InternalModelCatalog`、`InternalAgentConfig`、
    `InternalPermissionRules`、`InternalWebhooks` 由 control-plane 提供（ADR-0042、ADR-0044、ADR-0045、ADR-0047、ADR-0049）。各服务只生成并实现自己的标签。

    **认证。** `/internal/` 下的请求带 `Authorization: Bearer <服务 JWT>`：control-plane 签发，RS256，有效 5 分钟，`aud` 是被调用
    的服务名，`sub` 是调用方服务名。服务用自己的客户端密钥在 `POST /oauth2/token` 换取（OAuth2 客户端凭据模式），公钥在
    `GET /oauth2/jwks`（ADR-0044）。每个内部接口只接受列明的调用方服务，其他服务的有效令牌得到 403 `access.forbidden`。

    **租户。** 模型类的内部调用代表某个租户与项目发起，请求体带 `tenant_id` 与 `project_id`，用量与预算按它们计入
    （架构设计「计量与预算」）。出网授权不带租户：runtime 按源 Pod IP 找到会话，租户与项目随之确定。

    **约定。** 字段名 snake_case；错误为 RFC 9457 `application/problem+json`，扩展字段 `code` 与 `request_id`，与公开 API 相同。
servers:
  - url: http://localhost:8080
    description: 本地开发（scripts/dev/run-runtime.sh）
security:
  - ServiceAuth: []
tags:
  - name: InternalModels
    description: 知识库使用的 Embedding 与 rerank，与智能体共用平台的限流、预算与计量。
  - name: InternalEgress
    description: 沙箱出网代理的授权回调（架构设计「沙箱出网」，ADR-0038）。
  - name: InternalApiKeys
    description: control-plane 提供：按哈希校验 API Key（架构设计「认证」，ADR-0042）。
  - name: InternalTenants
    description: control-plane 提供：租户并发配额（架构设计「认领」中的租户并发计数行，ADR-0042）与租户设置（ADR-0047）。
  - name: InternalServiceTokens
    description: control-plane 提供：服务 JWT 的签发与公钥（架构设计「认证」中"服务之间"一行，ADR-0044）。
  - name: InternalProjectAccess
    description: control-plane 提供：控制台用户在某个项目上能使用的公开 API 作用域（ADR-0044）。
  - name: InternalSecrets
    description: control-plane 提供：凭据明文的解析，只给 runtime，每次解析写审计（架构设计「凭据」，ADR-0045）。
  - name: InternalModelCatalog
    description: control-plane 提供：模型目录与供应商账号的解析，不含凭据明文（ADR-0045）。
  - name: InternalAgentConfig
    description: control-plane 提供：已发布的智能体版本、环境修订与技能内容，runtime 据此装配引擎（ADR-0047）。
  - name: InternalPermissionRules
    description: control-plane 提供：租户与项目策略，以及“记住此决定”写入的项目级规则（ADR-0047）。
  - name: InternalWebhooks
    description: control-plane 提供：项目的 Webhook 订阅与签名密钥，runtime 据此投递（架构设计「Webhook」，ADR-0049）。

paths:
  /internal/v1/embeddings:
    post:
      operationId: createInternalEmbeddings
      tags: [InternalModels]
      summary: 文本向量
      description: |
        调用方：`knowledge`。知识库写入切片与检索查询时计算向量（架构设计「写入流程」「检索流程」），一次最多 64 条。超过供应商单次上限时拆成
        多次供应商请求，每次各自限流、预扣与计量（计量项为 Embedding token）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalEmbeddingRequest'
            example:
              tenant_id: ten_01JC8Z1K9W0V6Q3M2N5P7R4T8Y
              project_id: prj_01JC8Z2B5D3F7H9K1M4P6R8T0V
              model: mdl_01JC8Z4D7F5H9K1M3P6R8T0V2X
              input: [差旅住宿标准为每晚 500 元。]
      responses:
        '200':
          description: 向量，`data` 与输入一一对应。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalEmbeddingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/ProviderError'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/rerank:
    post:
      operationId: createInternalRerank
      tags: [InternalModels]
      summary: 重排
      description: |
        调用方：`knowledge`。按与查询的相关度给候选文本打分并排序（架构设计「检索流程」第 4 步）。DashScope 走兼容格式的
        `compatible-api/v1/reranks` 端点；计量项为 rerank token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalRerankRequest'
            example:
              tenant_id: ten_01JC8Z1K9W0V6Q3M2N5P7R4T8Y
              project_id: prj_01JC8Z2B5D3F7H9K1M4P6R8T0V
              model: mdl_01JC8Z5E8G6J0L2N4Q7S9U1W3Y
              query: 住宿标准
              documents: [差旅住宿标准为每晚 500 元。, 报销需要提供发票。]
              top_n: 8
      responses:
        '200':
          description: 按相关度从高到低排列的结果。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalRerankResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/ProviderError'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/egress:authorize:
    post:
      operationId: authorizeEgress
      tags: [InternalEgress]
      summary: 沙箱出网授权
      description: |
        调用方：`egress-proxy`。出网代理对沙箱的每个明文 HTTP 请求与 CONNECT 隧道调用一次（架构设计「沙箱出网」第 3 条，ADR-0038）。runtime 按源 IP
        在 `rt.sessions.sandbox_pod_ip` 中找到会话与环境，按环境的白名单判定目标主机：`*.` 开头的条目匹配任意层级的子域名，
        其余条目逐字匹配；不限定端口。按源 IP 解析出的授权缓存 30 秒，会话的 Pod IP 被清空或改变时立即失效。

        放行返回 200 与源 IP 所属的会话；拒绝返回 403，`code` 给出原因。代理只认 200，其他状态码、超时与错误一律拒绝本次出网。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EgressAuthorizeRequest'
            example:
              source_ip: 10.244.27.141
              target: pypi.org:443
      responses:
        '200':
          description: 放行。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EgressAuthorization'
              example:
                session_id: ses_01JC8Z6F9H7K1M3P5R7T9V1X3Z
        '403':
          $ref: '#/components/responses/EgressDenied'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/api-keys:verify:
    post:
      operationId: verifyApiKey
      tags: [InternalApiKeys]
      summary: 校验 API Key
      description: |
        调用方：`runtime`、`knowledge`。调用方计算 `Authorization: Bearer` 中明文的 SHA-256（小写十六进制），只传哈希。Key 有效时返回主体与限流参数；
        不存在、已吊销、已过期，或所属项目、租户已删除时 404 `api_key.not_found`。调用方把结果（含 404）缓存 60 秒，
        收到 Pub/Sub `key.revoked`（消息是 Key ID）时淘汰该 Key。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyVerifyRequest'
            example:
              key_hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
      responses:
        '200':
          description: Key 有效。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyVerification'
              example:
                api_key_id: key_01JC8Z7G0J8L2N4Q6S8U0W2Y4A
                tenant_id: ten_01JC8Z1K9W0V6Q3M2N5P7R4T8Y
                project_id: prj_01JC8Z2B5D3F7H9K1M4P6R8T0V
                scopes: ['sessions:read', 'sessions:write']
                rate_limit_per_minute: 600
                expires_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/ApiKeyNotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/tenants/{tenant_id}/quotas:
    get:
      operationId: getTenantQuotas
      tags: [InternalTenants]
      summary: 租户配额
      description: |
        调用方：`runtime`、`knowledge`。runtime 为租户创建并发计数行时读取 `max_concurrent_turns`；control-plane 修改配额后发布 Pub/Sub `config.invalidate`
        （`{"type":"tenant_quota","tenant_id":"ten_…"}`），runtime 收到后重新读取并更新计数行。runtime 的事件保留清理每次读取
        `event_retention_days`（ADR-0049）。已删除的租户 404 `tenant.not_found`。
      parameters:
        - name: tenant_id
          in: path
          required: true
          description: 租户 ID（ten_…）。
          schema:
            type: string
      responses:
        '200':
          description: 配额。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantQuota'
              example:
                tenant_id: ten_01JC8Z1K9W0V6Q3M2N5P7R4T8Y
                max_concurrent_turns: 20
                event_retention_days: 365
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/project-access:resolve:
    post:
      operationId: resolveProjectAccess
      tags: [InternalProjectAccess]
      summary: 控制台用户的项目权限
      description: |
        调用方：`runtime`、`knowledge`。控制台用户带 OIDC 令牌与 `Meridian-Project` 头调用公开 API 时，调用方按令牌中的用户标识
        与项目查询该用户在公开 API 上的作用域：由该用户在项目所属租户中的角色绑定，按角色矩阵换算（ADR-0044）。用户没有角色时
        `scopes` 为空；项目不存在或已删除时 404 `project.not_found`。调用方把结果缓存 60 秒。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectAccessRequest'
            example:
              subject: 7c1f0e52-6a1d-4c39-9f5b-2b8f4a1d9e60
              project_id: prj_01JC8Z2B5D3F7H9K1M4P6R8T0V
      responses:
        '200':
          description: 项目所属租户与该用户的作用域。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAccess'
              example:
                tenant_id: ten_01JC8Z1K9W0V6Q3M2N5P7R4T8Y
                project_id: prj_01JC8Z2B5D3F7H9K1M4P6R8T0V
                scopes: ['sessions:read', 'sessions:write', 'models:invoke']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/secrets:resolve:
    post:
      operationId: resolveSecret
      tags: [InternalSecrets]
      summary: 解析凭据明文
      description: |
        调用方：`runtime`。runtime 在模型调用、MCP 请求头、联网搜索后端等工具执行边界解析凭据，明文只在内存中缓存 5 分钟。凭据的
        租户必须等于 `tenant_id`；凭据属于某个项目时 `project_id` 也必须相同，否则与不存在相同（404 `secret.not_found`）。每次成功的
        解析在同一事务中写审计 `secret.resolved` 并更新最后使用时间。响应带 `Cache-Control: no-store`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretResolveRequest'
            example:
              tenant_id: ten_01JC8Z1K9W0V6Q3M2N5P7R4T8Y
              project_id: prj_01JC8Z2B5D3F7H9K1M4P6R8T0V
              secret_id: sec_01JC8Z3D6F8H0K2M4P6R8T0V2X
      responses:
        '200':
          description: 凭据明文。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              description: 固定为 `no-store`。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/SecretNotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/models/{model_id}:
    get:
      operationId: getCatalogModel
      tags: [InternalModelCatalog]
      summary: 模型目录中的一个模型
      description: |
        调用方：`runtime`。模型、所属供应商账号（只有凭据 ID）与当前价格表版本。不按租户过滤：装配时读上下文窗口不需要租户，
        runtime 在解析调用路由时自己校验模型的租户与调用方一致。runtime 缓存 60 秒，收到 `config.invalidate`（`provider_account`、
        `model`、`secret`、`price_book`）立即淘汰。
      parameters:
        - name: model_id
          in: path
          required: true
          description: 模型 ID（mdl_…）。
          schema:
            type: string
      responses:
        '200':
          description: 模型与供应商账号。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/CatalogModelNotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/agent-versions/{agent_version_id}:resolve:
    post:
      operationId: resolveAgentVersion
      tags: [InternalAgentConfig]
      summary: 解析一个已发布的智能体版本
      description: |
        调用方：`runtime`。返回发布时的规格快照（与 `ResolvedAgentSpec` 一一对应）与它引用的全部技能版本的内容（含子智能体的），
        runtime 不再需要其他查询就能装配引擎（凭据明文除外，凭据只以 ID 出现）。草稿与不存在的版本 404 `agent.version_not_found`。
        不按租户过滤：runtime 用响应中的 `tenant_id`、`project_id` 校验调用方项目。智能体已删除时 `agent_deleted` 为 true（运行中的
        会话继续使用，新会话拒绝）。版本不可变，runtime 可以长期缓存，收到 `config.invalidate` 的 `agent` 消息时淘汰该智能体的条目。
      parameters:
        - name: agent_version_id
          in: path
          required: true
          description: 智能体版本 ID（agv_…）。
          schema:
            type: string
      responses:
        '200':
          description: 已发布的版本与技能内容。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedAgentVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/AgentVersionNotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/agents/{agent_id}:resolve:
    post:
      operationId: resolveCurrentAgentVersion
      tags: [InternalAgentConfig]
      summary: 解析智能体当前发布的版本
      description: |
        调用方：`runtime`。按智能体 ID 创建会话时使用：版本号最大的已发布版本，响应与按版本 ID 解析相同。智能体不存在、已删除或没有
        发布过版本时 404 `agent.not_found`。runtime 缓存 60 秒，收到 `config.invalidate` 的 `agent` 消息（发布、删除）立即淘汰。
      parameters:
        - name: agent_id
          in: path
          required: true
          description: 智能体 ID（agt_…）。
          schema:
            type: string
      responses:
        '200':
          description: 当前发布的版本与技能内容。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedAgentVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/AgentNotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/environments/{environment_id}:
    get:
      operationId: getResolvedEnvironment
      tags: [InternalAgentConfig]
      summary: 环境的当前修订或指定修订
      description: |
        调用方：`runtime`。不给 `revision` 时返回当前修订（创建会话时固化），已删除的环境 404；给出 `revision` 时返回该修订，环境已删除
        也返回（运行中的会话继续使用）。runtime 用响应中的 `tenant_id`、`project_id` 校验调用方项目。当前修订缓存 60 秒，收到
        `config.invalidate` 的 `environment` 消息立即淘汰；指定修订不可变。
      parameters:
        - name: environment_id
          in: path
          required: true
          description: 环境 ID（env_…）。
          schema:
            type: string
        - name: revision
          in: query
          description: 修订号；不给出表示当前修订。
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: 环境的一个修订。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedEnvironment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/EnvironmentNotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/skills/{skill_id}/versions/{version}:
    get:
      operationId: getSkillContent
      tags: [InternalAgentConfig]
      summary: 一个技能版本的内容
      description: |
        调用方：`runtime`。技能版本不可变；解析智能体版本时已随响应给出，这里供缓存未命中时单独读取。runtime 用响应中的 `tenant_id`、
        `project_id` 校验调用方项目。
      parameters:
        - name: skill_id
          in: path
          required: true
          description: 技能 ID（skl_…）。
          schema:
            type: string
        - name: version
          in: path
          required: true
          description: 技能版本号。
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 技能版本的内容。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/SkillVersionNotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/projects/{project_id}/permission-rules:
    get:
      operationId: getProjectPermissionRules
      tags: [InternalPermissionRules]
      summary: 项目所属租户的租户策略与项目策略
      description: |
        调用方：`runtime`。每轮合成权限时的第 2、3 层（架构设计「权限判定」）：租户策略与项目策略（含“记住此决定”写入的项目级规则），
        各按创建顺序。项目不存在或已删除时 404 `project.not_found`。runtime 缓存 60 秒，收到 `config.invalidate` 的
        `permission_policy` 消息（`id` 为租户 ID 或项目 ID）立即淘汰。
      parameters:
        - name: project_id
          in: path
          required: true
          description: 项目 ID（prj_…）。
          schema:
            type: string
      responses:
        '200':
          description: 两层规则。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPermissionRules'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      operationId: rememberProjectPermissionRule
      tags: [InternalPermissionRules]
      summary: 记住此决定（项目级）
      description: |
        调用方：`runtime`。审批时选择项目级“记住此决定”，写入一条 `source` 为 `remembered` 的项目策略规则；相同的规则（工具、内容、
        结果）已存在时不重复写入，返回已有的规则。写入后发布 `config.invalidate` 的 `permission_policy`。
      parameters:
        - name: project_id
          in: path
          required: true
          description: 项目 ID（prj_…）。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RememberRuleRequest'
            example:
              tool_name: bash
              rule_content: git status
              behavior: allow
              source_action_id: act_01JC8Z7A7Q9X3M2N6P0R5T8W1Y
              decided_by: key_01JC8Z2C9E1G3J5L7N9Q1S3U5W
      responses:
        '200':
          description: 写入的或已有的规则。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalPermissionRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/projects/{project_id}/webhooks:
    get:
      operationId: listInternalProjectWebhooks
      tags: [InternalWebhooks]
      summary: 项目的 Webhook 与签名密钥
      description: |
        调用方：`runtime`。投递器按项目读取订阅（含停用的，投递时停用即失败），按创建顺序，不分页。响应带签名密钥明文与
        `Cache-Control: no-store`。runtime 缓存 60 秒，收到 `config.invalidate` 的 `webhook` 消息淘汰该租户的缓存。项目不存在或已删除时
        404 `project.not_found`。
      parameters:
        - name: project_id
          in: path
          required: true
          description: 项目 ID（prj_…）。
          schema:
            type: string
      responses:
        '200':
          description: 项目的全部 Webhook。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              description: 固定为 `no-store`。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalWebhookList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /internal/v1/tenants/{tenant_id}/settings:
    get:
      operationId: getInternalTenantSettings
      tags: [InternalTenants]
      summary: 租户设置
      description: |
        调用方：`runtime`。租户层系统提示词与联网搜索后端（ADR-0035）。租户没有设置时两项都为空。runtime 缓存 60 秒，收到
        `config.invalidate` 的 `tenant_settings` 消息立即淘汰，并淘汰该租户已装配的智能体实例（租户提示词随实例缓存）。
        已删除的租户 404 `tenant.not_found`。
      parameters:
        - name: tenant_id
          in: path
          required: true
          description: 租户 ID（ten_…）。
          schema:
            type: string
      responses:
        '200':
          description: 租户设置。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalTenantSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        '404':
          $ref: '#/components/responses/TenantNotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /oauth2/token:
    post:
      operationId: issueServiceToken
      tags: [InternalServiceTokens]
      summary: 签发服务 JWT
      description: |
        OAuth2 客户端凭据模式（RFC 6749 4.4）：客户端以 HTTP Basic（`服务名:客户端密钥`）认证，`audience` 是要调用的服务名，
        必须在该客户端登记的允许列表中。令牌 RS256，有效 5 分钟；客户端缓存它，剩余不足 60 秒时重新换取。错误仍是
        problem+json：客户端认证失败 401 `auth.invalid_service_client`，目标服务不允许 403 `access.forbidden`。
      security:
        - ServiceClientAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServiceTokenRequest'
            example:
              grant_type: client_credentials
              audience: control-plane
      responses:
        '200':
          description: 服务 JWT。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceToken'
              example:
                access_token: eyJraWQiOiJrXzAxIiwiYWxnIjoiUlMyNTYifQ.eyJzdWIiOiJydW50aW1lIn0.c2lnbmF0dXJl
                token_type: Bearer
                expires_in: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidServiceClient'
        '403':
          $ref: '#/components/responses/CallerForbidden'
        default:
          $ref: '#/components/responses/InternalError'

  /oauth2/jwks:
    get:
      operationId: getServiceJwks
      tags: [InternalServiceTokens]
      summary: 服务 JWT 的公钥
      description: |
        JWK Set（RFC 7517）：当前签名的密钥与上一把密钥。校验端缓存它，遇到未知的 `kid` 时立即刷新一次。不需要认证。
      security: []
      responses:
        '200':
          description: 公钥集合。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwkSet'
        default:
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    ServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: control-plane 签发的服务 JWT（ADR-0044）。
    ServiceClientAuth:
      type: http
      scheme: basic
      description: 服务的客户端凭据，只用于 `POST /oauth2/token`：用户名是服务名，口令是客户端密钥。

  headers:
    XRequestId:
      description: 本次请求的 ID：沿用合法的传入值，否则由服务端生成。
      required: true
      schema:
        type: string

  responses:
    SecretNotFound:
      description: '`secret.not_found`：凭据不存在，或不属于请求中的租户与项目。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CatalogModelNotFound:
      description: '`catalog.model_not_found`：模型不存在。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AgentVersionNotFound:
      description: '`agent.version_not_found`：版本不存在或还是草稿。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AgentNotFound:
      description: '`agent.not_found`：智能体不存在、已删除或没有发布过版本。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EnvironmentNotFound:
      description: '`environment.not_found`：环境不存在（或已删除且没有给出修订号）；`environment.revision_not_found`：修订不存在。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SkillVersionNotFound:
      description: '`skill.version_not_found`：技能版本不存在。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ApiKeyNotFound:
      description: '`api_key.not_found`：Key 不存在、已吊销、已过期，或所属项目、租户已删除。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CallerForbidden:
      description: '`access.forbidden`：调用方服务不能调用本接口，或不能换取该目标服务的令牌。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidServiceClient:
      description: '`auth.invalid_service_client`：缺少 HTTP Basic 认证，或服务名与客户端密钥不匹配。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProjectNotFound:
      description: '`project.not_found`：项目不存在或已删除。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TenantNotFound:
      description: '`tenant.not_found`：租户不存在或已删除。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: |
        请求不合法：`request.invalid`、`request.validation_failed`（见 `errors`）；`model.unsupported_operation`：模型的种类
        与接口不符。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: '`auth.unauthenticated`：缺少服务凭据；`auth.invalid_service_credential`：服务 JWT 无效、已过期或 `aud` 不是本服务。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ModelNotFound:
      description: '`model.not_found`：模型不存在。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: '`model.budget_exceeded`：租户或项目的预算不足；`model.rate_limit_timeout`：供应商账号的限流等待超过 30 秒。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProviderError:
      description: '`model.provider_error`：供应商拒绝了请求。供应商暂时不可用为 503 `model.provider_unavailable`。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EgressDenied:
      description: |
        拒绝出网：`egress.not_allowlisted` 目标不在会话环境的白名单内；`egress.unknown_source` 源 IP 不属于任何持有沙箱的会话
        （沙箱已删除、预热池中尚未认领，或多个会话记录了同一 IP）；`egress.invalid_target` 目标不是合法的主机与端口；
        `access.forbidden` 调用方不是 `egress-proxy`。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: '`internal.error`：服务内部错误；`service.unavailable`、`model.provider_unavailable`（503）：依赖暂时不可用。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    SecretResolveRequest:
      description: 解析一个凭据。
      type: object
      required: [tenant_id, secret_id]
      additionalProperties: false
      properties:
        tenant_id:
          description: 调用方租户 ID（PlatformContext）。
          type: string
          minLength: 1
          maxLength: 64
        project_id:
          description: 调用方项目 ID；没有项目上下文时为 null，此时只能解析租户级凭据。
          type: [string, 'null']
          maxLength: 64
        secret_id:
          description: 凭据 ID（sec_…）。
          type: string
          minLength: 1
          maxLength: 64
    ResolvedSecret:
      description: 凭据明文。调用方只放在内存中，不记日志、不写事件。
      type: object
      required: [secret_id, version, value]
      properties:
        secret_id:
          description: 凭据 ID。
          type: string
        version:
          description: 凭据版本，轮换后加一。
          type: integer
        value:
          description: 凭据明文。
          type: string
    CatalogRateLimit:
      description: 每分钟的请求与 token 上限；为 null 表示不限（模型上为 null 表示用账号的）。
      type: object
      required: [rpm, tpm]
      properties:
        rpm:
          description: 每分钟请求上限。
          type: [integer, 'null']
        tpm:
          description: 每分钟 token 上限。
          type: [integer, 'null']
    CatalogProviderAccount:
      description: 模型所属的供应商账号，不含凭据明文。
      type: object
      required: [provider_account_id, provider, base_url, secret_id, rate_limit]
      properties:
        provider_account_id:
          description: 供应商账号 ID（prv_…）。
          type: string
        provider:
          description: 供应商类型：`openai_compatible`、`anthropic`、`gemini`。
          type: string
        base_url:
          description: 端点；为 null 表示该类型的官方端点。
          type: [string, 'null']
        secret_id:
          description: 凭据 ID，经 `secrets:resolve` 解析；为 null 表示不需要凭据。
          type: [string, 'null']
        rate_limit:
          $ref: '#/components/schemas/CatalogRateLimit'
    CatalogModel:
      description: 模型目录中的一个模型与它的供应商账号。
      type: object
      required:
        [model_id, tenant_id, kind, upstream_model, context_window, max_output_tokens, fallback_model_id, base_url,
         max_batch_size, rate_limit, price_book_id, price_book_version, provider_account]
      properties:
        model_id:
          description: 模型 ID（mdl_…）。
          type: string
        tenant_id:
          description: 所属租户 ID：只有该租户的调用可以使用。
          type: string
        kind:
          description: 种类：`chat`、`embedding`、`rerank`。
          type: string
        upstream_model:
          description: 供应商侧的模型名。
          type: string
        context_window:
          description: 上下文窗口，单位 token。
          type: integer
        max_output_tokens:
          description: 请求没有指定时的最大输出 token。
          type: integer
        fallback_model_id:
          description: 目录中的备用模型；为 null 表示没有。
          type: [string, 'null']
        base_url:
          description: 本模型的端点，覆盖账号的；为 null 表示用账号的。
          type: [string, 'null']
        max_batch_size:
          description: Embedding 一次请求的输入条数上限；为 null 表示默认值。
          type: [integer, 'null']
        rate_limit:
          $ref: '#/components/schemas/CatalogRateLimit'
        price_book_id:
          description: 价格表 ID；为 null 表示没有定价。
          type: [string, 'null']
        price_book_version:
          description: 价格表当前生效的版本号，写进用量记录；没有价格表时为 null。
          type: [integer, 'null']
        provider_account:
          $ref: '#/components/schemas/CatalogProviderAccount'
    ApiKeyVerifyRequest:
      description: 校验 API Key 的请求。
      type: object
      required: [key_hash]
      additionalProperties: false
      properties:
        key_hash:
          description: API Key 明文的 SHA-256，64 位小写十六进制。
          type: string
          pattern: '^[0-9a-f]{64}$'
    ApiKeyVerification:
      description: 有效 API Key 的主体与限流参数。
      type: object
      required: [api_key_id, tenant_id, project_id, scopes, rate_limit_per_minute, expires_at]
      properties:
        api_key_id:
          description: API Key ID（key_…）。
          type: string
        tenant_id:
          description: 所属租户 ID。
          type: string
        project_id:
          description: 所属项目 ID。
          type: string
        scopes:
          description: 作用域取值，例如 `sessions:read`。
          type: array
          items:
            type: string
        rate_limit_per_minute:
          description: 每分钟请求上限（令牌桶的容量与每分钟补充量）。
          type: integer
        expires_at:
          description: 过期时间；为 null 表示不过期。调用方缓存的结果在过期后不再使用。
          type: [string, 'null']
          format: date-time
    ProjectAccessRequest:
      description: 查询控制台用户在项目上的作用域。
      type: object
      required: [subject, project_id]
      additionalProperties: false
      properties:
        subject:
          description: 用户标识：OIDC 令牌中按配置取出的声明（默认 `sub`），与成员的主体标识相同。
          type: string
          minLength: 1
          maxLength: 255
        project_id:
          description: 项目 ID（prj_…），来自请求头 `Meridian-Project`。
          type: string
          minLength: 1
          maxLength: 64
    ProjectAccess:
      description: 项目所属租户与该用户在公开 API 上的作用域。
      type: object
      required: [tenant_id, project_id, scopes]
      properties:
        tenant_id:
          description: 项目所属租户 ID。
          type: string
        project_id:
          description: 项目 ID。
          type: string
        scopes:
          description: 作用域取值，与 API Key 的作用域相同，例如 `sessions:read`；用户在该项目没有角色时为空数组。
          type: array
          items:
            type: string
    ServiceTokenRequest:
      description: 换取服务 JWT 的表单。
      type: object
      required: [grant_type, audience]
      properties:
        grant_type:
          description: 固定为 `client_credentials`。
          type: string
        audience:
          description: 要调用的服务名，例如 `control-plane`、`runtime`。
          type: string
    ServiceToken:
      description: 服务 JWT。
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          description: JWT（RS256）。
          type: string
        token_type:
          description: 固定为 `Bearer`。
          type: string
        expires_in:
          description: 有效期秒数。
          type: integer
    JwkSet:
      description: JWK Set（RFC 7517），只含 RSA 公钥。
      type: object
      required: [keys]
      properties:
        keys:
          description: 公钥，第一把是当前签名的密钥。
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
    Jwk:
      description: 一把 RSA 公钥（RFC 7518 6.3.1）。
      type: object
      required: [kty, kid, use, alg, n, e]
      properties:
        kty:
          description: 固定为 `RSA`。
          type: string
        kid:
          description: 密钥 ID，与 JWT 头的 `kid` 对应。
          type: string
        use:
          description: 固定为 `sig`。
          type: string
        alg:
          description: 固定为 `RS256`。
          type: string
        n:
          description: 模数，base64url。
          type: string
        e:
          description: 公钥指数，base64url。
          type: string
    ResolvedAgentVersion:
      description: 已发布的智能体版本与它引用的技能内容。
      type: object
      required: [tenant_id, project_id, agent_id, agent_version_id, version, agent_deleted, spec, skills]
      properties:
        tenant_id:
          description: 所属租户 ID。
          type: string
        project_id:
          description: 所属项目 ID。
          type: string
        agent_id:
          description: 智能体 ID。
          type: string
        agent_version_id:
          description: 智能体版本 ID。
          type: string
        version:
          description: 版本号。
          type: integer
        agent_deleted:
          description: 智能体是否已删除：已删除时不能用它创建新会话，运行中的会话继续使用。
          type: boolean
        spec:
          description: 发布时的规格快照，结构见 `schema/agent-spec.schema.json`，所有字段齐全。
          type: object
          additionalProperties: true
        skills:
          description: 规格（含子智能体）引用的全部技能版本的内容，按技能 ID 与版本排序。
          type: array
          items:
            $ref: '#/components/schemas/SkillContent'
    SkillContent:
      description: 一个技能版本的内容，对应 engine-spi 的 `SkillDefinition`。
      type: object
      required: [tenant_id, project_id, skill_id, version, name, files]
      properties:
        tenant_id:
          description: 所属租户 ID。
          type: string
        project_id:
          description: 所属项目 ID。
          type: string
        skill_id:
          description: 技能 ID。
          type: string
        version:
          description: 版本号。
          type: integer
        name:
          description: 技能名（frontmatter 的 `name`）。
          type: string
        files:
          description: 文件：相对路径 → UTF-8 文本，含 `SKILL.md`。
          type: object
          additionalProperties:
            type: string
    ResolvedEnvironment:
      description: 环境的一个修订，对应 engine-spi 的 `EnvironmentSpec`。
      type: object
      required: [tenant_id, project_id, environment_id, revision, tier, size, egress_allowlist]
      properties:
        tenant_id:
          description: 所属租户 ID。
          type: string
        project_id:
          description: 所属项目 ID。
          type: string
        environment_id:
          description: 环境 ID。
          type: string
        revision:
          description: 修订号。
          type: integer
          format: int64
        tier:
          description: 执行档位。
          type: string
          enum: [none, sandbox]
        size:
          description: 沙箱规格：`small`、`medium`、`large`；`none` 档为 null。
          type: [string, 'null']
        egress_allowlist:
          description: 出网白名单。
          type: array
          items:
            type: string
    ProjectPermissionRules:
      description: 一个项目在权限合成中的租户层与项目层规则。
      type: object
      required: [tenant_id, project_id, tenant_rules, project_rules]
      properties:
        tenant_id:
          description: 项目所属租户 ID。
          type: string
        project_id:
          description: 项目 ID。
          type: string
        tenant_rules:
          description: 租户策略规则，按创建顺序。
          type: array
          items:
            $ref: '#/components/schemas/InternalPermissionRule'
        project_rules:
          description: 项目策略规则（含记住的决定），按创建顺序。
          type: array
          items:
            $ref: '#/components/schemas/InternalPermissionRule'
    InternalPermissionRule:
      description: 一条权限规则。
      type: object
      required: [id, tool_name, rule_content, behavior, source]
      properties:
        id:
          description: 规则 ID（prl_…）。
          type: string
        tool_name:
          description: 工具名。
          type: string
        rule_content:
          description: 规则内容；为 null 表示整工具规则。
          type: [string, 'null']
        behavior:
          description: 命中后的结果。
          type: string
          enum: [allow, deny, ask]
        source:
          description: '`policy`：管理员添加；`remembered`：记住的决定。'
          type: string
          enum: [policy, remembered]
    RememberRuleRequest:
      description: 记住的一条项目级决定。
      type: object
      required: [tool_name, behavior, source_action_id]
      additionalProperties: false
      properties:
        tool_name:
          description: 工具名。
          type: string
          minLength: 1
          maxLength: 200
        rule_content:
          description: 规则内容；为 null 表示整工具规则。
          type: [string, 'null']
          maxLength: 1000
        behavior:
          description: 批准为 `allow`，拒绝为 `deny`。
          type: string
          enum: [allow, deny]
        source_action_id:
          description: 来源的待处理动作 ID（act_…）。
          type: string
          minLength: 1
          maxLength: 64
        decided_by:
          description: 做出决定的主体（API Key ID 或控制台用户）；没有时为 null。
          type: [string, 'null']
          maxLength: 255
    InternalTenantSettings:
      description: runtime 使用的租户设置。
      type: object
      required: [tenant_id, system_prompt, web_search]
      properties:
        tenant_id:
          description: 租户 ID。
          type: string
        system_prompt:
          description: 租户层系统提示词；没有时为空字符串。
          type: string
        web_search:
          description: 联网搜索后端；没有配置时为 null。
          oneOf:
            - $ref: '#/components/schemas/InternalWebSearchSettings'
            - type: 'null'
    InternalWebSearchSettings:
      description: 联网搜索后端。
      type: object
      required: [backend, base_url, secret_id]
      properties:
        backend:
          description: 后端类型。
          type: string
          enum: [searxng, bocha]
        base_url:
          description: 后端的基础 URL；runtime 使用前按地址策略再校验一次（ADR-0045）。
          type: string
        secret_id:
          description: 租户级凭据 ID；不需要凭据时为 null。
          type: [string, 'null']
    TenantQuota:
      description: 租户配额。
      type: object
      required: [tenant_id, max_concurrent_turns, event_retention_days]
      properties:
        tenant_id:
          description: 租户 ID。
          type: string
        max_concurrent_turns:
          description: 并发配额：该租户同时执行的轮次上限。
          type: integer
        event_retention_days:
          description: 会话事件的保留天数，至少 1（架构设计「数据保留」）。
          type: integer
          minimum: 1
    InternalWebhookList:
      description: 项目的 Webhook。
      type: object
      required: [data]
      properties:
        data:
          description: Webhook，按创建顺序。
          type: array
          items:
            $ref: '#/components/schemas/InternalWebhook'
    InternalWebhook:
      description: 一个 Webhook 的投递配置。
      type: object
      required: [id, tenant_id, project_id, url, events, enabled, signing_secret]
      properties:
        id:
          description: Webhook ID（whk_…）。
          type: string
        tenant_id:
          description: 租户 ID。
          type: string
        project_id:
          description: 项目 ID。
          type: string
        url:
          description: 接收方地址（http 或 https）。
          type: string
        events:
          description: 订阅的事件类型。
          type: array
          items:
            type: string
            enum: [session.status_idle, session.status_requires_action, session.error, session.status_terminated]
        enabled:
          description: 是否启用；停用的 Webhook 不扇出新的投递，已有的投递以失败结束。
          type: boolean
        signing_secret:
          description: 签名密钥明文（whsec_…），用于计算 `Meridian-Signature`。
          type: string
    Problem:
      description: RFC 9457 错误响应，扩展字段 `code` 与 `request_id`，与公开 API 相同。
      type: object
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type:
          description: 错误类型 URI，`urn:meridian:error:<code>`。
          type: string
        title:
          description: 错误码的简短标题。
          type: string
        status:
          description: HTTP 状态码。
          type: integer
        detail:
          description: 本次错误的说明，不含凭据与内部信息。
          type: [string, 'null']
        instance:
          description: 请求路径。
          type: string
        code:
          description: 错误码，格式 `<领域>.<原因>`。
          type: string
        request_id:
          description: 请求 ID，与响应头 `X-Request-Id` 相同。
          type: string
        errors:
          description: 字段校验失败的明细，只在 `request.validation_failed` 时出现。
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
    FieldViolation:
      description: 一个字段的校验失败。
      type: object
      required: [field, message]
      properties:
        field:
          description: 字段路径。
          type: string
        message:
          description: 失败原因。
          type: string
    InternalEmbeddingRequest:
      description: 文本向量请求。
      type: object
      additionalProperties: false
      required: [tenant_id, model, input]
      properties:
        tenant_id:
          description: 调用代表的租户 ID（ten_…），用量与预算计入它。
          type: string
          minLength: 1
        project_id:
          description: 调用代表的项目 ID（prj_…）；租户级的调用不传。
          type: string
          minLength: 1
        model:
          description: 平台模型目录中的 Embedding 模型 ID（mdl_…）。
          type: string
          minLength: 1
        input:
          description: 文本，1 至 64 条，每条不能为空。
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            minLength: 1
        dimensions:
          description: 输出维度，模型支持时生效；不传时为模型的默认维度。
          type: integer
          minimum: 1
    InternalEmbeddingResponse:
      description: 文本向量结果。
      type: object
      required: [data, model, usage]
      properties:
        data:
          description: 向量，与输入一一对应，按 `index` 升序。
          type: array
          items:
            $ref: '#/components/schemas/InternalEmbedding'
        model:
          description: 请求中的模型 ID。
          type: string
        usage:
          $ref: '#/components/schemas/InternalUsage'
    InternalEmbedding:
      description: 一条输入的向量。
      type: object
      required: [index, embedding]
      properties:
        index:
          description: 对应输入的序号，从 0 开始。
          type: integer
        embedding:
          description: 向量。
          type: array
          items:
            type: number
            format: float
    InternalRerankRequest:
      description: 重排请求。
      type: object
      additionalProperties: false
      required: [tenant_id, model, query, documents]
      properties:
        tenant_id:
          description: 调用代表的租户 ID（ten_…），用量与预算计入它。
          type: string
          minLength: 1
        project_id:
          description: 调用代表的项目 ID（prj_…）；租户级的调用不传。
          type: string
          minLength: 1
        model:
          description: 平台模型目录中的 rerank 模型 ID（mdl_…）。
          type: string
          minLength: 1
        query:
          description: 查询文本。
          type: string
          minLength: 1
        documents:
          description: 候选文本，1 至 100 条。
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
        top_n:
          description: 只返回得分最高的前 n 条；不传时返回全部。
          type: integer
          minimum: 1
    InternalRerankResponse:
      description: 重排结果。
      type: object
      required: [results, model, usage]
      properties:
        results:
          description: 结果，按 `relevance_score` 从高到低。
          type: array
          items:
            $ref: '#/components/schemas/InternalRerankResult'
        model:
          description: 请求中的模型 ID。
          type: string
        usage:
          $ref: '#/components/schemas/InternalUsage'
    InternalRerankResult:
      description: 一条候选文本的得分。
      type: object
      required: [index, relevance_score]
      properties:
        index:
          description: 候选文本在请求 `documents` 中的序号，从 0 开始。
          type: integer
        relevance_score:
          description: 相关度，越大越相关，取供应商的值。
          type: number
          format: double
    EgressAuthorizeRequest:
      description: 一次出网请求的授权询问。
      type: object
      additionalProperties: false
      required: [source_ip, target]
      properties:
        source_ip:
          description: 请求的源 IP（代理看到的 TCP 对端地址，即沙箱 Pod 的 IP）。
          type: string
          minLength: 1
          maxLength: 45
        target:
          description: 目标：明文 HTTP 请求的 `:authority`（`host` 或 `host:port`），CONNECT 的 `host:port`；IPv6 带方括号。
          type: string
          minLength: 1
          maxLength: 300
    EgressAuthorization:
      description: 放行的结论。
      type: object
      required: [session_id]
      properties:
        session_id:
          description: 源 IP 所属的会话，供代理的访问日志关联。
          type: string
    InternalUsage:
      description: 用量，所有供应商请求之和。
      type: object
      required: [prompt_tokens, total_tokens]
      properties:
        prompt_tokens:
          description: 输入 token。
          type: integer
        total_tokens:
          description: 与 `prompt_tokens` 相同（Embedding 与 rerank 没有输出 token）。
          type: integer

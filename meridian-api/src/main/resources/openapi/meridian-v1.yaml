    CreateChatCompletionRequest:
      description: 对话补全请求，字段与 OpenAI Chat Completions 一致的子集；未列出的字段返回 400。
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model:
          description: 平台模型目录中的对话模型 ID（mdl_…）。
          type: string
          minLength: 1
        messages:
          description: 对话消息，按时间顺序，至少一条。
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatCompletionMessage'
        tools:
          description: 模型可以调用的函数工具。
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionTool'
        max_tokens:
          description: 最大输出 token 数；不传时使用模型目录的默认值。预算按"估算输入加它"预扣。
          type: integer
          minimum: 1
        max_completion_tokens:
          description: 与 `max_tokens` 相同（OpenAI 的新字段名）；两者都给出时以它为准。
          type: integer
          minimum: 1
        temperature:
          description: 采样温度。
          type: number
          minimum: 0
          maximum: 2
        stream:
          description: 为 `true` 时以 SSE 流式返回。
          type: boolean
          default: false
        stream_options:
          $ref: '#/components/schemas/ChatCompletionStreamOptions'
    ChatCompletionStreamOptions:
      description: 流式选项，只在 `stream` 为 `true` 时有效。
      type: object
      additionalProperties: false
      properties:
        include_usage:
          description: 为 `true` 时，`[DONE]` 之前多一条 `choices` 为空、带 `usage` 的块。
          type: boolean
          default: false
    ChatCompletionMessage:
      description: 一条对话消息。`tool` 消息必须带 `tool_call_id`；`assistant` 消息可以只有 `tool_calls`。
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          description: 角色。
          type: string
          enum: [system, user, assistant, tool]
        content:
          description: 文本内容；只有工具调用的助手消息可以为空。
          type: [string, 'null']
        tool_calls:
          description: 助手消息发起的工具调用。
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionMessageToolCall'
        tool_call_id:
          description: 工具消息回应的工具调用 ID。
          type: string
    ChatCompletionMessageToolCall:
      description: 一个完整的函数工具调用。
      type: object
      additionalProperties: false
      required: [id, type, function]
      properties:
        id:
          description: 工具调用 ID。
          type: string
        type:
          description: 固定为 `function`。
          type: string
          enum: [function]
        function:
          $ref: '#/components/schemas/ChatCompletionFunctionCall'
    ChatCompletionFunctionCall:
      description: 函数调用的名字与入参。
      type: object
      additionalProperties: false
      required: [name, arguments]
      properties:
        name:
          description: 函数名。
          type: string
        arguments:
          description: 入参 JSON 文本，可能不是合法 JSON（由模型生成）。
          type: string
    ChatCompletionTool:
      description: 一个函数工具。
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type:
          description: 固定为 `function`。
          type: string
          enum: [function]
        function:
          $ref: '#/components/schemas/ChatCompletionFunction'
    ChatCompletionFunction:
      description: 函数工具的定义。
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: 函数名。
          type: string
          minLength: 1
        description:
          description: 函数说明，供模型决定何时调用。
          type: string
        parameters:
          description: 入参的 JSON Schema；不传时为无参数的对象。
          type: object
          additionalProperties: true
    ChatCompletion:
      description: 非流式的对话补全结果。
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id:
          description: 本次补全的 ID（chatcmpl-…）。
          type: string
        object:
          description: 固定为 `chat.completion`。
          type: string
          enum: [chat.completion]
        created:
          description: 创建时间，Unix 秒。
          type: integer
          format: int64
        model:
          description: 请求中的模型 ID。
          type: string
        choices:
          description: 补全结果，只有一项。
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChoice'
        usage:
          description: 用量；供应商没有报告用量时为空（平台按估算计量）。
          oneOf:
            - $ref: '#/components/schemas/CompletionUsage'
            - type: 'null'
    ChatCompletionChoice:
      description: 一个补全结果。
      type: object
      required: [index, message, finish_reason]
      properties:
        index:
          description: 序号，固定为 0。
          type: integer
        message:
          $ref: '#/components/schemas/ChatCompletionResponseMessage'
        finish_reason:
          description: 结束原因：`stop`、`length`、`tool_calls` 等，取供应商的值。
          type: [string, 'null']
    ChatCompletionResponseMessage:
      description: 模型生成的助手消息。
      type: object
      required: [role, content, reasoning_content, tool_calls]
      properties:
        role:
          description: 固定为 `assistant`。
          type: string
          enum: [assistant]
        content:
          description: 文本内容；只有工具调用时为空。
          type: [string, 'null']
        reasoning_content:
          description: 思考内容；模型不输出思考时为空。
          type: [string, 'null']
        tool_calls:
          description: 模型发起的工具调用；没有时为空。
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ChatCompletionMessageToolCall'
    ChatCompletionChunk:
      description: 流式对话补全的一个增量块。没有值的可选字段不出现（与 OpenAI 相同）。
      type: object
      required: [id, object, created, model, choices]
      properties:
        id:
          description: 本次补全的 ID，同一次补全的所有块相同。
          type: string
        object:
          description: 固定为 `chat.completion.chunk`。
          type: string
          enum: [chat.completion.chunk]
        created:
          description: 创建时间，Unix 秒，同一次补全的所有块相同。
          type: integer
          format: int64
        model:
          description: 请求中的模型 ID。
          type: string
        choices:
          description: 增量，只有一项；带用量的最后一块为空列表，只有这一块出现 `usage`。
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChunkChoice'
        usage:
          $ref: '#/components/schemas/CompletionUsage'
    ChatCompletionChunkChoice:
      description: 一个增量。
      type: object
      required: [index, delta, finish_reason]
      properties:
        index:
          description: 序号，固定为 0。
          type: integer
        delta:
          $ref: '#/components/schemas/ChatCompletionChunkDelta'
        finish_reason:
          description: 结束原因，只在最后一个增量给出，其余为空。
          type: [string, 'null']
    ChatCompletionChunkDelta:
      description: 增量内容，只出现本块有的字段。
      type: object
      properties:
        role:
          description: 第一个增量为 `assistant`。
          type: string
          enum: [assistant]
        content:
          description: 追加的文本。
          type: string
        reasoning_content:
          description: 追加的思考内容。
          type: string
        tool_calls:
          description: 工具调用的增量，按 `index` 归并。
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChunkToolCall'
    ChatCompletionChunkToolCall:
      description: 工具调用的增量：首个增量带 `id`、`type` 与函数名，之后只带入参片段。
      type: object
      required: [index]
      properties:
        index:
          description: 工具调用在本条消息中的序号，从 0 开始。
          type: integer
        id:
          description: 工具调用 ID，只在首个增量出现。
          type: string
        type:
          description: 固定为 `function`，只在首个增量出现。
          type: string
          enum: [function]
        function:
          $ref: '#/components/schemas/ChatCompletionChunkFunction'
    ChatCompletionChunkFunction:
      description: 函数调用的增量。
      type: object
      properties:
        name:
          description: 函数名，只在首个增量出现。
          type: string
        arguments:
          description: 追加的入参 JSON 片段。
          type: string
    CompletionUsage:
      description: 本次补全的用量，与计量记录一致。
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens, prompt_tokens_details, completion_tokens_details]
      properties:
        prompt_tokens:
          description: 输入 token。
          type: integer
        completion_tokens:
          description: 输出 token。
          type: integer
        total_tokens:
          description: 输入与输出之和。
          type: integer
        prompt_tokens_details:
          $ref: '#/components/schemas/PromptTokensDetails'
        completion_tokens_details:
          $ref: '#/components/schemas/CompletionTokensDetails'
    PromptTokensDetails:
      description: 输入 token 的明细。
      type: object
      required: [cached_tokens]
      properties:
        cached_tokens:
          description: 命中提示词缓存的输入 token。
          type: integer
    CompletionTokensDetails:
      description: 输出 token 的明细。
      type: object
      required: [reasoning_tokens]
      properties:
        reasoning_tokens:
          description: 用于思考的输出 token。
          type: integer
    CreateResponseRequest:
      description: |
        生成响应的请求，OpenAI Responses API 的子集。列在这里但标为"不支持"的参数给出时返回 400
        `model.unsupported_parameter`；未列出的字段返回 400 `request.invalid`。
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        model:
          description: 平台模型目录中的对话模型 ID（mdl_…）。
          type: string
          minLength: 1
        input:
          $ref: '#/components/schemas/ResponseInput'
        instructions:
          description: 系统指令，作为第一条系统消息。
          type: [string, 'null']
        max_output_tokens:
          description: 最大输出 token 数；不传时使用模型目录的默认值。预算按"估算输入加它"预扣。
          type: [integer, 'null']
          minimum: 1
        temperature:
          description: 采样温度。
          type: [number, 'null']
          minimum: 0
          maximum: 2
        stream:
          description: 为 `true` 时以 SSE 流式返回。
          type: [boolean, 'null']
        store:
          description: 平台不保存响应，只接受 `false`（或不传）；`true` 返回 400 `model.unsupported_parameter`。
          type: [boolean, 'null']
        tools:
          description: 不支持。
        tool_choice:
          description: 不支持。
        parallel_tool_calls:
          description: 不支持。
        previous_response_id:
          description: 不支持（平台不保存响应，多轮对话由调用方在 `input` 中带上历史消息）。
        conversation:
          description: 不支持。
        reasoning:
          description: 不支持。
        text:
          description: 不支持（只输出纯文本）。
        top_p:
          description: 不支持。
        truncation:
          description: 不支持。
        include:
          description: 不支持。
        metadata:
          description: 不支持。
        background:
          description: 不支持。
        prompt:
          description: 不支持。
        user:
          description: 不支持。
        service_tier:
          description: 不支持。
        max_tool_calls:
          description: 不支持。
        top_logprobs:
          description: 不支持。
        stream_options:
          description: 不支持（流式事件总是以带 `usage` 的 `response.completed` 结束）。
    ResponseInput:
      description: |
        一段文本（视为一条 `user` 消息），或 `ResponseInputMessage` 的数组（至少一条）。生成的 DTO 中是 `Object`
        （ADR-0029 的多类型限制）。
      oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ResponseInputMessage'
    ResponseInputMessage:
      description: 一条输入消息。`type` 可以省略；`content` 为文本，或 `ResponseInputText` 的数组。
      type: object
      required: [role, content]
      properties:
        type:
          description: 固定为 `message`。
          type: string
          enum: [message]
        role:
          description: 角色；`developer` 与 `system` 相同。
          type: string
          enum: [user, assistant, system, developer]
        content:
          $ref: '#/components/schemas/ResponseInputContent'
    ResponseInputContent:
      description: 文本，或 `ResponseInputText` 的数组（至少一块）。生成的 DTO 中是 `Object`。
      oneOf:
        - type: string
        - type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ResponseInputText'
    ResponseInputText:
      description: 文本块；`assistant` 消息中的历史输出用 `output_text`。
      type: object
      required: [type, text]
      properties:
        type:
          description: 块类型。
          type: string
          enum: [input_text, output_text]
        text:
          description: 文本。
          type: string
    ModelResponse:
      description: 非流式的响应，也是流式事件中 `response` 字段的内容。
      type: object
      required: [id, object, created_at, status, model, output, usage, incomplete_details, error]
      properties:
        id:
          description: 响应 ID（resp_…）。
          type: string
        object:
          description: 固定为 `response`。
          type: string
          enum: [response]
        created_at:
          description: 创建时间，Unix 秒。
          type: integer
          format: int64
        status:
          description: '`completed` 正常结束；`incomplete` 达到输出长度上限；`failed` 首包之后出错（只在流式出现）；`in_progress` 只在流式的开始事件中出现。'
          type: string
          enum: [completed, incomplete, failed, in_progress]
        model:
          description: 请求中的模型 ID。
          type: string
        output:
          description: 输出项；完成时是一条助手消息，流式的开始事件中为空数组。
          type: array
          items:
            $ref: '#/components/schemas/ResponseOutputMessage'
        usage:
          description: 用量；流式的开始事件、或供应商没有报告用量时为空（平台按估算计量）。
          oneOf:
            - $ref: '#/components/schemas/ResponseUsage'
            - type: 'null'
        incomplete_details:
          description: '`status` 为 `incomplete` 时给出原因，其余为空。'
          oneOf:
            - $ref: '#/components/schemas/ResponseIncompleteDetails'
            - type: 'null'
        error:
          description: '`status` 为 `failed` 时给出错误，其余为空。'
          oneOf:
            - $ref: '#/components/schemas/ResponseError'
            - type: 'null'
    ResponseOutputMessage:
      description: 助手消息输出项。
      type: object
      required: [type, id, status, role, content]
      properties:
        type:
          description: 固定为 `message`。
          type: string
          enum: [message]
        id:
          description: 输出项 ID（msg_…）。
          type: string
        status:
          description: '`in_progress` 只在流式的增量过程中出现。'
          type: string
          enum: [in_progress, completed, incomplete]
        role:
          description: 固定为 `assistant`。
          type: string
          enum: [assistant]
        content:
          description: 内容块；流式的 `response.output_item.added` 中为空数组。
          type: array
          items:
            $ref: '#/components/schemas/ResponseOutputText'
    ResponseOutputText:
      description: 输出文本块。
      type: object
      required: [type, text, annotations]
      properties:
        type:
          description: 固定为 `output_text`。
          type: string
          enum: [output_text]
        text:
          description: 文本；流式的 `response.content_part.added` 中为空字符串。
          type: string
        annotations:
          description: 标注，平台总是给出空数组。
          type: array
          items:
            type: object
    ResponseUsage:
      description: 本次响应的用量，与计量记录一致。
      type: object
      required: [input_tokens, input_tokens_details, output_tokens, output_tokens_details, total_tokens]
      properties:
        input_tokens:
          description: 输入 token。
          type: integer
        input_tokens_details:
          $ref: '#/components/schemas/ResponseInputTokensDetails'
        output_tokens:
          description: 输出 token。
          type: integer
        output_tokens_details:
          $ref: '#/components/schemas/ResponseOutputTokensDetails'
        total_tokens:
          description: 输入与输出之和。
          type: integer
    ResponseInputTokensDetails:
      description: 输入 token 的明细。
      type: object
      required: [cached_tokens]
      properties:
        cached_tokens:
          description: 命中提示词缓存的输入 token。
          type: integer
    ResponseOutputTokensDetails:
      description: 输出 token 的明细。
      type: object
      required: [reasoning_tokens]
      properties:
        reasoning_tokens:
          description: 用于推理的输出 token。
          type: integer
    ResponseIncompleteDetails:
      description: 响应不完整的原因。
      type: object
      required: [reason]
      properties:
        reason:
          description: 固定为 `max_output_tokens`。
          type: string
          enum: [max_output_tokens]
    ResponseError:
      description: 流式响应首包之后的错误。
      type: object
      required: [code, message]
      properties:
        code:
          description: 平台错误码，例如 `model.provider_unavailable`。
          type: string
        message:
          description: 错误说明，不含内部信息。
          type: string
    ResponseStreamEvent:
      description: |
        流式响应的一个事件，字段随 `type` 出现（没有值的字段不出现）：`response.created`、`response.in_progress`、
        `response.completed`、`response.incomplete`、`response.failed` 带 `response`；`response.output_item.added`、
        `response.output_item.done` 带 `output_index` 与 `item`；`response.content_part.added`、`response.content_part.done`
        带 `item_id`、`output_index`、`content_index` 与 `part`；`response.output_text.delta` 带这三个序号与 `delta`；
        `response.output_text.done` 带这三个序号与 `text`。
      type: object
      required: [type, sequence_number]
      properties:
        type:
          description: 事件类型，与 SSE 的 `event:` 相同。
          type: string
          enum:
            - response.created
            - response.in_progress
            - response.output_item.added
            - response.content_part.added
            - response.output_text.delta
            - response.output_text.done
            - response.content_part.done
            - response.output_item.done
            - response.completed
            - response.incomplete
            - response.failed
        sequence_number:
          description: 本次响应内的事件序号，从 0 开始递增。
          type: integer
          minimum: 0
        response:
          $ref: '#/components/schemas/ModelResponse'
        output_index:
          description: 输出项的序号，固定为 0。
          type: integer
        item_id:
          description: 输出项 ID（msg_…）。
          type: string
        content_index:
          description: 内容块的序号，固定为 0。
          type: integer
        item:
          $ref: '#/components/schemas/ResponseOutputMessage'
        part:
          $ref: '#/components/schemas/ResponseOutputText'
        delta:
          description: 追加的文本。
          type: string
        text:
          description: 本块的完整文本。
          type: string
    CreateEmbeddingRequest:
      description: 文本向量请求，字段与 OpenAI Embeddings 一致的子集；未列出的字段返回 400。
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        model:
          description: 平台模型目录中的 Embedding 模型 ID（mdl_…）。
          type: string
          minLength: 1
        input:
          $ref: '#/components/schemas/EmbeddingInput'
        encoding_format:
          description: 向量的编码：`float`（默认）为数字数组，`base64` 为小端 float32 数组的 Base64。
          type: string
          enum: [float, base64]
          default: float
        dimensions:
          description: 输出维度，模型支持时生效；不传时为模型的默认维度。
          type: integer
          minimum: 1
    EmbeddingList:
      description: 文本向量结果。
      type: object
      required: [object, data, model, usage]
      properties:
        object:
          description: 固定为 `list`。
          type: string
          enum: [list]
        data:
          description: 向量，与输入一一对应，按 `index` 升序。
          type: array
          items:
            $ref: '#/components/schemas/Embedding'
        model:
          description: 请求中的模型 ID。
          type: string
        usage:
          $ref: '#/components/schemas/EmbeddingUsage'
    Embedding:
      description: 一条输入的向量。
      type: object
      required: [object, index, embedding]
      properties:
        object:
          description: 固定为 `embedding`。
          type: string
          enum: [embedding]
        index:
          description: 对应输入的序号，从 0 开始。
          type: integer
        embedding:
          $ref: '#/components/schemas/EmbeddingVector'
    EmbeddingUsage:
      description: 用量，所有供应商请求之和。
      type: object
      required: [prompt_tokens, total_tokens]
      properties:
        prompt_tokens:
          description: 输入 token。
          type: integer
        total_tokens:
          description: 与 `prompt_tokens` 相同。
          type: integer
    EmbeddingInput:
      description: 一段文本，或文本数组（1 至 256 条），每段不能为空。生成的 DTO 中是 `Object`（ADR-0029 的多类型限制）。
      oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          maxItems: 256
          items:
            type: string
            minLength: 1
    EmbeddingVector:
      description: 向量：`float` 编码为数字数组，`base64` 编码为小端 float32 数组的 Base64 字符串。生成的 DTO 中是 `Object`。
      oneOf:
        - type: array
          items:
            type: number
        - type: string
    UsageKind:
      description: 计量种类：模型 token、Embedding token、rerank token、沙箱 vCPU 秒、搜索次数、知识库存储 GB 天（ADR-0051）、知识检索次数（T19）。
      type: string
      enum: [model_tokens, embedding_tokens, rerank_tokens, sandbox_vcpu_seconds, search_calls, knowledge_storage_gb_days,
             knowledge_search_calls]
    UsageReport:
      description: 按账本明细聚合的用量。
      type: object
      required: [from, to, group_by, rows]
      properties:
        from:
          description: 起始时间（含）。
          type: string
          format: date-time
        to:
          description: 结束时间（不含）。
          type: string
          format: date-time
        group_by:
          description: 实际使用的聚合维度。
          type: array
          items:
            type: string
        rows:
          description: 聚合结果，按维度与种类排序。
          type: array
          items:
            $ref: '#/components/schemas/UsageReportRow'
    UsageReportRow:
      description: 一组用量的合计。没有按某个维度聚合时，该维度的字段为 null。
      type: object
      required:
        [day, project_id, model_id, agent_id, api_key_id, kind, currency, records, quantity, input_tokens, output_tokens,
         cache_read_tokens, cache_write_tokens, reasoning_tokens, cost]
      properties:
        day:
          description: UTC 日期。
          type: [string, 'null']
          format: date
        project_id:
          description: 项目 ID。
          type: [string, 'null']
        model_id:
          description: 模型 ID；沙箱与搜索没有模型。
          type: [string, 'null']
        agent_id:
          description: 智能体 ID；直通接口与 Embedding 没有智能体。
          type: [string, 'null']
        api_key_id:
          description: API Key ID；控制台用户与平台内部发起的调用没有 API Key。
          type: [string, 'null']
        kind:
          $ref: '#/components/schemas/UsageKind'
        currency:
          description: 成本的币种；没有定价的用量为 null。
          type: [string, 'null']
        records:
          description: 账本记录数。
          type: integer
          format: int64
        quantity:
          description: 计量数量的合计（十进制字符串）：token 种类为输入加输出，沙箱为 vCPU 秒，搜索为次数。
          type: string
        input_tokens:
          description: 输入 token。
          type: integer
          format: int64
        output_tokens:
          description: 输出 token。
          type: integer
          format: int64
        cache_read_tokens:
          description: 命中提示词缓存的输入 token。
          type: integer
          format: int64
        cache_write_tokens:
          description: 写入提示词缓存的输入 token。
          type: integer
          format: int64
        reasoning_tokens:
          description: 推理用的输出 token。
          type: integer
          format: int64
        cost:
          description: 成本的合计（十进制字符串，12 位小数，不舍入）；没有定价时为 null。
          type: [string, 'null']

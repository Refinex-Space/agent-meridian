  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [Models]
      summary: 对话补全（OpenAI 兼容）
      description: |
        OpenAI 兼容的对话补全。`model` 填平台模型目录中的模型 ID（mdl_…），平台按项目的供应商账号路由，与智能体的模型调用
        共用限流（等待最长 30 秒）、预算预扣与计量；预扣按"估算输入 token 加 `max_tokens`"，结束时按实际用量结算。

        `stream` 为 `true` 时以 SSE 返回：每条 `data:` 是一个 `ChatCompletionChunk`，最后一条是 `data: [DONE]`；
        `stream_options.include_usage` 为 `true` 时，`[DONE]` 之前多一条 `choices` 为空、带 `usage` 的块。首包之前的错误
        （预算不足、限流超时、供应商不可用）以对应状态码的 problem+json 返回；首包之后的错误以一条
        `data: {"error": {...}}` 结束流。流式请求不支持 `Idempotency-Key`（返回 400）。

        只支持文本消息与函数工具；请求中未列出的字段返回 400。
      security:
        - ApiKeyAuth: [models:invoke]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatCompletionRequest'
            example:
              model: mdl_01JC8Z3C6E4G8J0L2N5Q7S9U1W
              messages:
                - role: user
                  content: 用一句话介绍差旅报销流程。
              max_tokens: 256
      responses:
        '200':
          description: |
            非流式为 `ChatCompletion`；流式为 SSE（`text/event-stream`），每条 `data:` 是一行 `ChatCompletionChunk` JSON，
            以 `data: [DONE]` 结束。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
            text/event-stream:
              schema:
                type: array
                format: event-stream
                items:
                  $ref: '#/components/schemas/ChatCompletionChunk'
        '400':
          $ref: '#/components/responses/ModelBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/ModelTooManyRequests'
        '502':
          $ref: '#/components/responses/ModelProviderError'
        default:
          $ref: '#/components/responses/InternalError'

  /v1/embeddings:
    post:
      operationId: createEmbeddings
      tags: [Models]
      summary: 文本向量（OpenAI 兼容）
      description: |
        OpenAI 兼容的文本向量。`model` 填平台模型目录中的 Embedding 模型 ID（mdl_…）。输入超过供应商单次上限时，平台拆成
        多次供应商请求，结果按输入顺序合并；每次供应商请求各自限流、预扣与计量（计量项为 Embedding token）。

        `encoding_format` 为 `base64` 时，`embedding` 是小端 float32 数组的 Base64 编码（OpenAI SDK 的默认取法）。
      security:
        - ApiKeyAuth: [models:invoke]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmbeddingRequest'
            example:
              model: mdl_01JC8Z4D7F5H9K1M3P6R8T0V2X
              input: [差旅住宿标准, 报销需要哪些票据]
      responses:
        '200':
          description: 向量，`data` 与输入一一对应。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingList'
        '400':
          $ref: '#/components/responses/ModelBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/ModelTooManyRequests'
        '502':
          $ref: '#/components/responses/ModelProviderError'
        default:
          $ref: '#/components/responses/InternalError'

  /v1/responses:
    post:
      operationId: createResponse
      tags: [Models]
      summary: 生成响应（OpenAI Responses 兼容的子集）
      description: |
        OpenAI Responses API 的子集，与 `/v1/chat/completions` 共用模型路由、限流、预算预扣与计量。平台不保存响应，每次请求
        都是无状态的。

        **支持的子集：**
        - 输入：`input` 为一段文本（视为一条 `user` 消息），或消息数组；消息的 `role` 为 `user`、`assistant`、`system`、
          `developer`（与 `system` 相同），`content` 为文本或 `input_text`、`output_text` 块的数组。`instructions` 作为
          第一条系统消息。
        - 参数：`model`、`max_output_tokens`、`temperature`、`stream`，`store` 只接受 `false`。
        - 输出：一条 `message` 输出项，内容是一个 `output_text` 块；模型的思考内容不输出。`usage` 与计量记录一致。
          结束原因为输出长度上限时 `status` 为 `incomplete`，`incomplete_details.reason` 为 `max_output_tokens`。

        **不支持的参数**（`tools`、`tool_choice`、`parallel_tool_calls`、`previous_response_id`、`conversation`、
        `reasoning`、`text`、`top_p`、`truncation`、`include`、`metadata`、`background`、`prompt`、`user`、
        `service_tier`、`max_tool_calls`、`top_logprobs`、`stream_options`）返回 400 `model.unsupported_parameter`，
        `errors` 中逐项列出；未列出的字段返回 400 `request.invalid`。不支持的输入项（图片、文件、函数调用及其结果、
        推理项等）返回 400 `model.unsupported_parameter`。

        **流式：** `stream` 为 `true` 时以 SSE 返回，每条消息的 `event:` 与 `data:` 中的 `type` 相同，`sequence_number` 从 0
        递增：`response.created`、`response.in_progress`、`response.output_item.added`、`response.content_part.added`、
        若干 `response.output_text.delta`、`response.output_text.done`、`response.content_part.done`、
        `response.output_item.done`，最后是 `response.completed`（或 `response.incomplete`）。首包之前的错误（预算不足、
        限流超时、供应商不可用）以对应状态码的 problem+json 返回；首包之后的错误以一条 `response.failed` 结束流，
        `response.error` 给出错误码与说明。流式请求不支持 `Idempotency-Key`（返回 400）。
      security:
        - ApiKeyAuth: [models:invoke]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResponseRequest'
            example:
              model: mdl_01JC8Z3C6E4G8J0L2N5Q7S9U1W

          schema:
            $ref: '#/components/schemas/StatsWindow'
        - name: agent_id
          in: query
          description: 只统计绑定该智能体的会话。
          schema:
            type: string
            pattern: '^agt_[A-Za-z0-9_]{1,64}$'
      responses:
        '200':
          description: 会话运行概况。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /v1/sessions/{session_id}/workspace/files/{path}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/WorkspacePath'
    get:
      operationId: getWorkspaceFile
      tags: [Workspace]
      summary: 读取工作区文件
      description: |
        读取会话工作区中的一个文件，响应体是文件内容，`Content-Type` 为服务端按内容检测的类型。

        `none` 档读平台存储中的工作区（智能体用文件工具写的文件、轮次开始时放进来的上传文件）。`sandbox` 档只能读产物目录
        `outputs/` 的副本：每轮结束时平台把沙箱中的 `outputs/` 同步到对象存储，读到的是最近一次同步的内容；其他路径返回 404。
        受保护路径（`AGENTS.md`、`skills/`、`subagents/`、`tools.json`、`MEMORY.md`）由平台按智能体配置生成，不在工作区存储中。
      security:
        - ApiKeyAuth: [sessions:read]
      responses:
        '200':
          description: 文件内容。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/WorkspaceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkspaceFileNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
    put:
      operationId: putWorkspaceFile
      tags: [Workspace]
      summary: 写入工作区文件
      description: |
        把请求体原样写成工作区中的一个文件，已存在时覆盖。只支持 `none` 档；`sandbox` 档的工作区在沙箱中，经 API 只读
        `outputs/` 的副本，写入返回 409 `workspace.read_only`。大小上限与上传文件相同（默认 32 MB），超过返回 413。

        受保护路径对智能体与调用方都只读，写入返回 403 `workspace.protected_path`。会话已归档或删除时返回 409
        `session.terminated`。轮次执行中写入的文件，智能体在下一次读取时看到。
      security:
        - ApiKeyAuth: [sessions:write]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 写入后的文件信息。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFile'
        '400':
          $ref: '#/components/responses/WorkspaceBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'


openapi: 3.1.0
info:
  title: AgentMeridian API
  version: 1.0.0
  summary: 业务系统接入 AgentMeridian 的公开 API：会话、事件、线程、待处理动作、SSE 事件流、文件与工作区、OpenAI 兼容的模型直通、已发布的智能体、用量与知识库。
  description: |
    业务系统通过本 API 使用平台上的智能体：创建会话、发送事件、订阅事件流、回应待处理动作。

    **认证。** 每个请求带 `Authorization: Bearer <API Key>`。API Key 属于一个项目，数据按"项目 + `end_user_id`"隔离：
    同一项目内按 `end_user_id` 区分终端用户，跨项目不可见，即使 `end_user_id` 相同。API Key 的作用域决定能调用哪些接口：
    读接口需要 `sessions:read`，写接口需要 `sessions:write`（回应待处理动作也可以用 `actions:respond`），上传文件需要 `files:write`，模型直通需要 `models:invoke`，知识库的读写
    分别需要 `knowledge:read`、`knowledge:write`，每个操作的 `security` 列出所需作用域。

    控制台（例如 Playground）以登录用户的 OIDC access token 代替 API Key 调用，同时用请求头 `Meridian-Project: <项目 ID>`
    指定项目；缺少该头返回 400 `auth.project_required`。用户的作用域由他在该项目中的角色决定（项目开发者与租户所有者有上面
    全部作用域，租户管理员与项目观察者有 `sessions:read` 与 `knowledge:read`，审批人只有 `sessions:read` 与 `actions:respond`）；项目不存在或用户在其中没有角色时返回 403 `access.forbidden`。

    **约定。**
    - 字段名 snake_case；时间为 RFC 3339 UTC，例如 `2026-11-07T08:30:12.345Z`。
    - 列表接口用游标分页：`?limit=&after=`，返回 `{data, has_more, next_cursor}`；`next_cursor` 原样传给下一次请求的 `after`。
    - 所有 POST 支持 `Idempotency-Key` 请求头：24 小时内同键同请求体返回首次的结果（响应带 `Idempotent-Replayed: true`），
      同键不同请求体返回 409 `idempotency.key_reused`，首次请求仍在处理时返回 409 `idempotency.in_progress`。
    - 错误一律为 RFC 9457 `application/problem+json`，扩展字段 `code`（`<领域>.<原因>`）与 `request_id`。
    - 限流按 API Key 计（令牌桶，容量与每分钟补充量是该 Key 的每分钟上限；控制台用户按用户计）：每个响应带 `RateLimit-Limit`（上限）、
      `RateLimit-Remaining`（剩余请求数）、`RateLimit-Reset`（多少秒后补满）；超限返回 429 `rate_limit.exceeded` 与
      `Retry-After`（秒）。
    - 每个响应带 `X-Request-Id`；请求可传入 `X-Request-Id`（不超过 128 个字符的字母、数字与 `._:-`）与 W3C `traceparent`，
      合法的 `traceparent` 在响应中原样返回，用于把平台日志关联到调用方的追踪。

    **事件流。** `GET /v1/sessions/{session_id}/stream` 与线程流按 SSE 推送事件：`event:` 为事件类型，`id:` 为 `seq`，
    `data:` 为事件信封 JSON。断线后带 `Last-Event-ID` 重连，服务端只补发其后的事件；会话流的 `seq` 连续，客户端可据此去重。
servers:
  - url: http://localhost:8080
    description: 本地开发（scripts/dev/run-runtime.sh）
security:
  - ApiKeyAuth: []
tags:
  - name: Sessions
    description: 会话：绑定一个智能体版本与一个环境修订的有状态实例。
  - name: Events
    description: 事件：发送用户事件、列出事件、订阅会话与线程的事件流。
  - name: Threads
    description: 线程：会话中的执行线，主智能体是主线程，每次拉起子智能体产生一条子线程。
  - name: PendingActions
    description: 待处理动作：需要调用方回应的事项。
  - name: Models
    description: 模型直通：OpenAI 兼容的对话补全与文本向量，与智能体共用平台的限流、预算与计量。
  - name: Agents
    description: 智能体（只读）：本项目已发布的智能体与它们当前的版本，创建会话时引用。由 control-plane 提供（ADR-0047）。
  - name: Usage
    description: 用量：本项目的用量按天、模型、智能体、API Key 聚合，与账本一致。由 control-plane 提供（ADR-0048）。
  - name: Webhooks
    description: Webhook 投递记录：查询与手动重投。Webhook 的配置在管理 API（ADR-0049）。
  - name: Files
    description: 文件：上传到项目的文件，在消息中按 `file_id` 引用，轮次开始时放进会话工作区（ADR-0050）。
  - name: Workspace
    description: 工作区：读写会话工作区中的文件；`sandbox` 档只读产物目录 `outputs/` 的副本（ADR-0050）。
  - name: KnowledgeBases
    description: 知识库：创建知识库，上传、查看、重新处理与删除文档。由 knowledge 服务提供（ADR-0051）。

paths:
  /v1/sessions:
    post:
      operationId: createSession
      tags: [Sessions]
      summary: 创建会话
      description: |
        创建一个空闲会话及其主线程。平台按 `agent` 与 `environment` 解析并固化智能体版本与环境修订号，之后修改智能体或环境
        不影响这个会话。
      security:
        - ApiKeyAuth: [sessions:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
            example:
              agent: agt_01JC8Z1K9W0V6Q3M2N5P7R4T8Y
              environment: env_01JC8Z2B5D3F7H9K1M4P6R8T0V
              end_user_id: u_1024
              end_user_attributes:
                acl_tags: ['dept:finance']
              metadata:
                ticket: 'INC-2041'
      responses:
        '201':
          description: 已创建。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`agent.not_found`：智能体或智能体版本不存在；`environment.not_found`：环境不存在。'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: 列出会话
      description: |
        列出当前项目的会话，新创建的在前；已删除的会话不出现在列表中。筛选条件之间是"且"，创建时间的范围是左闭右开。
      security:
        - ApiKeyAuth: [sessions:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: end_user_id
          in: query
          description: 只列出该终端用户的会话。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: agent_id
          in: query
          description: 只列出绑定该智能体（任一版本）的会话。T19b 之前创建的会话没有记录智能体，不会被这个条件选中。
          schema:
            type: string
            pattern: '^agt_[A-Za-z0-9_]{1,64}$'
        - name: status
          in: query
          description: 只列出该状态的会话。
          schema:
            $ref: '#/components/schemas/SessionStatus'
        - $ref: '#/components/parameters/CreatedAfter'
        - $ref: '#/components/parameters/CreatedBefore'
      responses:
        '200':
          description: 会话列表。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /v1/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      tags: [Sessions]
      summary: 查询会话
      description: 已删除的会话在数据清理完成之前仍可查询，`deleted_at` 不为空。
      security:
        - ApiKeyAuth: [sessions:read]
      responses:
        '200':
          description: 会话。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateSession
      tags: [Sessions]
      summary: 更新会话
      description: 更新会话的元数据。未给出的字段保持不变；`metadata` 整体替换。已终止的会话只读。
      security:
        - ApiKeyAuth: [sessions:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: 更新后的会话。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/SessionConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteSession
      tags: [Sessions]
      summary: 删除会话
      description: |
        删除会话：取消正在执行或排队的轮次，未回应的待处理动作作废，写入 `session.status_terminated`（`reason=deleted`）。
        **删除不可撤销**：会话的事件、线程、状态、工作区与产物在 24 小时内被清理，清理完成前查询返回 `deleted_at` 不为空的会话，
        之后返回 404。重复删除返回同样的结果。
      security:
        - ApiKeyAuth: [sessions:write]
      responses:
        '202':
          description: 已删除，数据清理在后台进行。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /v1/sessions/{session_id}:archive:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: archiveSession
      tags: [Sessions]
      summary: 归档会话
      description: |
        归档会话：会话进入 `terminated`（`reason=archived`），之后只读，事件仍可查询与订阅。只有 `idle` 或 `requires_action`
        的会话可以归档，未回应的待处理动作随之作废；正在执行的会话返回 409 `session.busy`。归档已归档的会话返回当前会话。
      security:
        - ApiKeyAuth: [sessions:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已归档的会话。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            `session.busy`：会话正在执行（`running` 或 `rescheduled`），不能归档；`session.terminated`：会话已删除；
            `idempotency.key_reused`、`idempotency.in_progress`：见"约定"。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /v1/sessions/{session_id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: sendEvents
      tags: [Events]
      summary: 发送事件
      description: |
        发送一批用户事件，按顺序在一个事务里校验并持久化，任一事件不合法时整批拒绝。

        | 事件 | 何时可以发送 | 效果 |
        |---|---|---|
        | `user.message` | 会话未终止 | 主线程空闲时立即开始一轮；正在执行时进入收件箱，`queue` 在本轮结束后成为下一轮，`steer` 在下一次推理前注入当前轮（来不及注入时按 `queue`）；等待回应时进入收件箱，一律按 `queue`，恢复轮结束后成为下一轮 |
        | `user.interrupt` | 会话未终止 | 执行中：在下一个检查点停止（`stop_reason=interrupted`）；排队中：取消该轮（执行到一半被置回队列的轮次改为带着中断请求执行，处理完中断前的结论后停止）；等待回应：全部待处理动作视为拒绝，运行一个恢复轮后停止；空闲时无效果 |
        | `user.tool_confirmation` | 存在类型为 `tool_confirmation` 或 `plan_exit` 的未回应动作 | 回应该动作；一轮的全部动作都有回应后开始恢复轮 |
        | `user.custom_tool_result` | 存在类型为 `custom_tool_result` 的未回应动作 | 回传自定义工具结果；同上 |
        | `user.recovery_confirmation` | 存在类型为 `recovery_confirmation` 的未回应动作 | 决定重试或跳过；同上 |

        同一批里不能既有 `user.interrupt` 又有回应事件（400 `request.validation_failed`）：中断会把全部待处理动作视为拒绝。

        作用域：`sessions:write` 可以发送全部事件；只有 `actions:respond`（审批人）时只能发送回应事件（`user.tool_confirmation`、
        `user.custom_tool_result`、`user.recovery_confirmation`），批中有其他事件时 403 `auth.insufficient_scope`（ADR-0053）。
      security:
        - ApiKeyAuth: [sessions:write]
        - ApiKeyAuth: [actions:respond]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEventsRequest'
            example:
              events:
                - type: user.message
                  content:
                    - type: text
                      text: 差旅住宿标准是多少？
      responses:
        '202':
          description: 已接收，返回持久化后的事件（带 `id` 与 `seq`）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            事件与会话当前状态的组合不合法：
            - `session.terminated`：会话已归档或删除，不再接受事件。
            - `event.action_not_found`：会话中没有 `action_id` 指定的待处理动作。
            - `event.action_type_mismatch`：事件类型与动作类型不对应，例如用 `user.custom_tool_result` 回应 `tool_confirmation`。
            - `event.action_not_pending`：动作已被回应或已超时。

            另有 `idempotency.key_reused`、`idempotency.in_progress`，见"约定"。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listEvents
      tags: [Events]
      summary: 列出事件
      description: 按 `seq` 升序列出会话的持久化事件；只在流上出现的事件（`event_start`、`event_delta`、`ping`）不在其中。
      security:
        - ApiKeyAuth: [sessions:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: 事件列表。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /v1/sessions/{session_id}/stream:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: streamSessionEvents
      tags: [Events]
      summary: 订阅会话事件流
      description: |
        以 SSE 推送会话的事件，包含全部线程，`seq` 连续。服务端先补发 `Last-Event-ID` 之后的历史事件，再转为实时推送；
        每 15 秒发送一次 `ping`。单个连接最长 60 分钟，到期由服务端关闭，客户端带 `Last-Event-ID` 重连。
        推送 `session.status_terminated` 之后服务端关闭连接。

        `?threads=main` 只推送主线程、会话级事件与子线程的状态事件（`session.thread_created`、`session.thread_status_*`），
        此时 `seq` 不连续，客户端只按 `seq` 去重。
      security:
        - ApiKeyAuth: [sessions:read]
      parameters:
        - $ref: '#/components/parameters/LastEventId'
        - $ref: '#/components/parameters/EventDeltas'
        - name: threads
          in: query
          description: 线程过滤；`main` 表示只订阅主线程与线程状态事件。不传时订阅全部线程。
          schema:
            type: string
            enum: [main]
      responses:
        '200':
          $ref: '#/components/responses/EventStream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /v1/sessions/{session_id}/threads:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: listThreads
      tags: [Threads]
      summary: 列出线程
      description: 按创建顺序列出会话的线程，主线程在最前。
      security:
        - ApiKeyAuth: [sessions:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: 线程列表。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /v1/sessions/{session_id}/threads/{thread_id}/stream:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: thread_id
        in: path
        required: true
        description: 线程 ID（thr_…）。
        schema:
          type: string
    get:
      operationId: streamThreadEvents
      tags: [Events]
      summary: 订阅线程事件流
      description: |
        以 SSE 推送一条线程的事件，规则同会话事件流。线程流只包含本线程的事件，`seq` 不连续：其他线程占用的序号不算缺失，
        客户端只按 `seq` 去重，不做跳号判断。会话终止后服务端关闭连接。
      security:
        - ApiKeyAuth: [sessions:read]
      parameters:
        - $ref: '#/components/parameters/LastEventId'
        - $ref: '#/components/parameters/EventDeltas'
      responses:
        '200':
          $ref: '#/components/responses/EventStream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`session.not_found`：会话不存在；`thread.not_found`：会话中没有该线程。'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /v1/sessions/{session_id}/pending-actions:

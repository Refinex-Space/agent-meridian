      properties:
        block_id:
          description: 块 ID。
          type: string
        kind:
          $ref: '#/components/schemas/BlockKind'
        delta:
          description: 增量：文本与思考为追加的文本，工具调用为入参 JSON 片段，工具结果为结果片段。
          type: string


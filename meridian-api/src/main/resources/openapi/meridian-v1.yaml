      description: |
        列出当前项目全部会话的待处理动作，新创建的在前；不给 `status` 时列出全部状态（等待回应的与历史）。筛选条件之间是"且"。
        已删除的会话的动作不出现。控制台的待处理页用它；回应仍经 `POST /v1/sessions/{session_id}/events`。
      security:
        - ApiKeyAuth: [sessions:read]
      parameters:

  /v1/usage:
    get:
      operationId: getUsage
      tags: [Usage]
      summary: 查询用量
      description: |
        按账本明细聚合本项目的用量：模型 token（对话、压缩）、Embedding 与 rerank token、沙箱 vCPU 秒、搜索次数。每行总是按
        计量种类与币种分组（不同种类的数量、不同币种的金额不能相加），成本按每条记录中的价格表版本计算。账本由用量消息异步入账，
        通常落后几秒。
      security:
        - ApiKeyAuth: [sessions:read]
      parameters:
        - name: from
          in: query
          description: 起始时间（含）；默认当前 UTC 月份的第一天。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 结束时间（不含）；默认当前时间。与 `from` 相距不超过 366 天。
          schema:
            type: string
            format: date-time
        - name: group_by
          in: query
          description: |
            聚合维度，逗号分隔，可以组合，例如 `day,model`：`day`（UTC 日期）、`model`、`agent`、`api_key`。不传时只按计量种类与
            币种汇总；未知的维度返回 400 `usage.invalid_query`。
          schema:
            type: string
            pattern: '^[a-z_]+(,[a-z_]+)*$'
            maxLength: 64
      responses:
        '200':
          description: 用量报表。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'


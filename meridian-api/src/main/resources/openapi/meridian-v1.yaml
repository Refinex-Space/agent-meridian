  /v1/session-stats:
    get:
      operationId: getSessionStats
      tags: [Sessions]
      summary: 会话运行概况
      description: |
        当前项目的会话运行概况，供控制台的概览与智能体页使用：运行中与等待回应的会话数、待处理动作数、每个智能体使用中的会话数与
        时间窗内的失败率、最近的失败轮次。计数在请求时读取；失败率来自每分钟汇总一次的小时表，`stats_updated_at` 是汇总到的时间，
        时间窗按整点对齐（例如 `24h` 从 23 个整点之前开始，含当前小时）。失败率 = 失败轮次 ÷（完成 + 中断 + 失败的轮次），排队时被
        取消的轮次不计。
      security:
        - ApiKeyAuth: [sessions:read]
      parameters:
        - name: window
          in: query

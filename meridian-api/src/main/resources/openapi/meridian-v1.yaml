    post:
      operationId: searchKnowledgeBase
      tags: [KnowledgeBases]
      summary: 检索知识库
      description: |
        混合检索（架构设计「检索流程」）：向量检索与全文检索各取前 50，按 RRF 融合；知识库设置了 `rerank_model` 时再经 rerank 取前
        `top_k`。只返回不限标签的切片与带有 `acl_tags` 中任一标签的切片，过滤在数据库查询中完成。没有命中时 `data` 为空数组。
        Embedding 或 rerank 模型不存在、种类不符时返回 409 `knowledge_base.model_unavailable`；模型调用暂时失败（限流、预算、供应商
        不可用）时返回 503 `service.unavailable`。
      security:
        - ApiKeyAuth: [knowledge:read]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSearchRequest'
            example:
              query: 去上海出差住宿每晚的标准是多少？
              top_k: 5
              acl_tags: ['dept:finance']
      responses:
        '200':
          description: 命中的切片，按相关度从高到低。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/KnowledgeBaseNotFound'
        '409':
          $ref: '#/components/responses/KnowledgeSearchConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 项目下的 API Key，带作用域（`sessions:read`、`sessions:write`、`actions:respond` 等）；控制台用户以 OIDC access token 加 `Meridian-Project` 头代替。

  headers:
    XRequestId:
      description: 本次请求的 ID：沿用合法的传入值，否则由服务端生成；排查问题时提供它。
      required: true
      schema:
        type: string
    IdempotentReplayed:
      description: 值为 `true` 表示这是同一 `Idempotency-Key` 首次请求结果的重放。
      schema:
        type: string
        enum: ['true']
    RetryAfter:
      description: 多少秒后可以重试，至少 1。
      schema:
        type: integer
        minimum: 1

  parameters:
    KnowledgeBaseId:
      name: knowledge_base_id
      in: path
      required: true
      description: 知识库 ID（kb_…）。
      schema:
        type: string
    DocumentId:
      name: document_id
      in: path
      required: true
      description: 文档 ID（doc_…）。
      schema:
        type: string
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      description: 投递记录 ID（whd_…）。
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      description: 会话 ID（ses_…）。
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 幂等键，24 小时内同键同请求体返回首次结果。
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Limit:
      name: limit
      in: query
      description: 每页条数。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    After:
      name: after
      in: query
      description: 游标：上一页响应的 `next_cursor`。不传时从第一页开始。
      schema:
        type: string
        minLength: 1
    CreatedAfter:
      name: created_after
      in: query
      description: 只列出创建时间不早于它的记录（含）。
      schema:
        type: string
        format: date-time
    CreatedBefore:
      name: created_before
      in: query
      description: 只列出创建时间早于它的记录（不含）。
      schema:
        type: string
        format: date-time
    FileId:
      name: file_id
      in: path
      required: true
      description: 文件 ID（fil_…）。
      schema:
        type: string
    WorkspacePath:
      name: path
      in: path
      required: true
      description: |
        相对工作区根的文件路径，整体 URL 编码，`/` 编码为 `%2F`（例如 `reports%2Fq3.md`）。不能为空，不能以 `/` 开头，
        不能含 `..`、`.` 段、空段或反斜杠。
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    LastEventId:
      name: Last-Event-ID
      in: header
      description: 上次收到的最后一个事件的 `seq`；服务端只推送其后的事件。不传时从会话的第一个事件开始。
      schema:
        type: string
        pattern: '^[0-9]{1,18}$'
    EventDeltas:
      name: event_deltas
      in: query
      description: 为 `true` 时同时推送内容块的增量（`event_start`、`event_delta`）。
      schema:
        type: boolean
        default: false

  responses:
    KnowledgeBaseNotFound:
      description: '`knowledge_base.not_found`：知识库不存在，或不属于当前项目。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DocumentNotFound:
      description: '`knowledge_base.not_found`：知识库不存在或不属于当前项目；`document.not_found`：文档不存在或不在该知识库中。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DocumentBadRequest:
      description: |
        请求不合法：`request.invalid`、`request.validation_failed`（见 `errors`，例如缺少文件、空文件、标签不合法）；
        `document.unsupported_type`：不支持的文档类型，`detail` 给出检测到的媒体类型。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DocumentTooLarge:
      description: '`document.too_large`：文档超过大小上限（默认 64 MB），`detail` 给出上限。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    KnowledgeSearchConflict:
      description: '`knowledge_base.model_unavailable`：知识库的 Embedding 或 rerank 模型不存在、种类不符；`idempotency.key_reused`、`idempotency.in_progress`：见幂等约定。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: '`service.unavailable`：依赖的服务或模型暂时不可用（限流、预算、供应商故障），稍后重试。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DocumentConflict:
      description: '`document.processing`：文档的写入正在排队或进行，不能重新处理；`idempotency.key_reused`、`idempotency.in_progress`：见幂等约定。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EventStream:
      description: |
        SSE 事件流（`text/event-stream`）。每条消息的 `event:` 为事件类型，`id:` 为 `seq`（只在流上的事件没有 `id:`），
        `data:` 为一行事件信封 JSON（持久化事件为 `SessionEvent`，只在流上的事件为 `StreamOnlyEvent`）。
        连接建立后服务端先发送一行注释 `:open`，使响应头立即到达客户端；SSE 客户端按规范忽略注释行。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        text/event-stream:
          schema:
            type: array
            format: event-stream
            items:
              $ref: '#/components/schemas/SseFrame'
    BadRequest:
      description: |
        请求不合法：`request.invalid`（格式错误）、`request.validation_failed`（字段校验失败，见 `errors`）、
        `request.invalid_cursor`（游标无效）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: '`auth.unauthenticated`：缺少 `Authorization: Bearer`；`auth.invalid_api_key`：API Key 无效或已吊销。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: '`auth.insufficient_scope`：API Key 缺少该操作所需的作用域。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WebhookDeliveryNotFound:
      description: '`webhook_delivery.not_found`：投递记录不存在、已过保留期，或不属于当前项目。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SessionNotFound:
      description: '`session.not_found`：会话不存在，或不属于 API Key 所在的项目。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AgentNotFound:
      description: '`agent.not_found`：智能体不存在、没有发布过版本、已删除或不属于当前项目。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SessionConflict:
      description: '`session.terminated`：会话已归档或删除，只读。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyConflict:
      description: '`idempotency.key_reused`：同一幂等键已用于不同的请求；`idempotency.in_progress`：相同幂等键的请求正在处理。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: '`rate_limit.exceeded`：API Key 的请求速率超限，`Retry-After` 秒后重试。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: '`internal.error`：服务内部错误，`detail` 不含内部信息，排查以 `request_id` 关联日志；`service.unavailable`（503）：依赖暂时不可用。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    FileNotFound:
      description: '`file.not_found`：文件不存在，或不属于 API Key 所在的项目。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ContentTooLarge:
      description: '`file.too_large`：内容超过大小上限（默认 32 MB），`detail` 给出上限。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceBadRequest:
      description: '`workspace.invalid_path`：路径为空、以 `/` 开头、含 `..` 或 `.` 段、空段或反斜杠；`request.invalid`：请求格式错误。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceFileNotFound:
      description: '`session.not_found`：会话不存在或不属于当前项目；`workspace.file_not_found`：文件不存在（`sandbox` 档还包括 `outputs/` 之外的路径）。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceForbidden:
      description: '`auth.insufficient_scope`：API Key 缺少该操作所需的作用域；`workspace.protected_path`：受保护路径只读。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceConflict:
      description: '`workspace.read_only`：`sandbox` 档的工作区经 API 只读；`session.terminated`：会话已归档或删除。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ModelBadRequest:
      description: |
        请求不合法：`request.invalid`、`request.validation_failed`（见 `errors`）；`model.unsupported_operation`：模型的种类
        与接口不符（例如用 Embedding 模型调用对话补全）；`model.unsupported_parameter`：`/v1/responses` 不支持的参数或输入项
        （见 `errors`）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ModelNotFound:
      description: '`model.not_found`：模型不存在，或未授权给 API Key 所在的项目。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ModelTooManyRequests:
      description: |
        `model.budget_exceeded`：租户、项目或 API Key 的预算不足；`model.rate_limit_timeout`：供应商账号的限流等待超过 30 秒；
        `rate_limit.exceeded`：API Key 的请求速率超限，`Retry-After` 给出秒数。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ModelProviderError:
      description: '`model.provider_error`：供应商拒绝了请求（认证失败、参数错误等）。供应商暂时不可用为 503 `model.provider_unavailable`。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    UpdateKnowledgeBaseRequest:
      description: 修改知识库的请求，只改给出的字段。
      type: object
      additionalProperties: false
      properties:
        name:
          description: 名称，1 至 128 个字符。
          type: string
          minLength: 1
          maxLength: 128
        description:
          description: 说明，至多 1000 个字符；空字符串表示清除。
          type: string
          maxLength: 1000
        rerank_model:
          description: 本租户模型目录中的 rerank 模型 ID；空字符串表示不再重排。
          type: string
          maxLength: 64
    CreateKnowledgeBaseRequest:
      description: 创建知识库的请求。
      type: object
      additionalProperties: false
      required: [name, embedding_model]
      properties:
        name:
          description: 名称，1 至 128 个字符。
          type: string
          minLength: 1
          maxLength: 128
        description:
          description: 说明，至多 1000 个字符。
          type: string
          maxLength: 1000
        embedding_model:
          description: 本租户模型目录中的 Embedding 模型 ID（mdl_…），创建后不能修改。
          type: string
          minLength: 1
          maxLength: 64
        rerank_model:
          description: 本租户模型目录中的 rerank 模型 ID（mdl_…），检索时用它重排；不传时不重排。
          type: string
          minLength: 1
          maxLength: 64
    KnowledgeBase:
      description: 知识库，属于一个项目。
      type: object
      required: [id, name, description, embedding_model, rerank_model, embedding_dimensions, document_count, created_at,
                 updated_at]
      properties:
        id:
          description: 知识库 ID（kb_…）。
          type: string
        name:
          description: 名称。
          type: string
        description:
          description: 说明；没有时为 null。
          type: [string, 'null']
        embedding_model:
          description: Embedding 模型 ID（mdl_…）。
          type: string
        rerank_model:
          description: rerank 模型 ID（mdl_…）；不重排时为 null。
          type: [string, 'null']
        embedding_dimensions:
          description: 向量维度，由平台配置决定。
          type: integer
        document_count:
          description: 文档数（含写入中与失败的）。
          type: integer
          format: int64
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        updated_at:
          description: 最后修改时间。
          type: string
          format: date-time
    KnowledgeBasePage:
      description: 一页知识库。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的知识库。
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeBase'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    KnowledgeSearchRequest:
      description: 检索请求。
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          description: 查询文本，1 至 2000 个字符。
          type: string
          minLength: 1
          maxLength: 2000
        top_k:
          description: 返回的切片数，1 至 50，默认 8。
          type: integer
          minimum: 1
          maximum: 50
        acl_tags:
          description: |
            调用方（终端用户）的访问标签，与会话的 `end_user_attributes.acl_tags` 含义相同：只返回不限标签的切片与带有其中任一标签的
            切片。不传时只返回不限标签的切片。至多 64 个。
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 128
    KnowledgeSearchResult:
      description: 检索结果。
      type: object
      required: [data]
      properties:
        data:
          description: 命中的切片，按 `score` 从高到低；没有命中时为空数组。
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSearchHit'
    KnowledgeSearchHit:
      description: 一个命中的切片。
      type: object
      required: [chunk_id, knowledge_base_id, document_id, filename, kind, content, score, source]
      properties:
        chunk_id:
          description: 切片 ID（chk_…）。
          type: string
        knowledge_base_id:
          description: 知识库 ID（kb_…）。
          type: string
        document_id:
          description: 文档 ID（doc_…）。
          type: string
        filename:
          description: 文档的文件名，用于引用标注。
          type: string
        kind:
          description: '`text` 正文，`table` 表格（Markdown）。'
          type: string
          enum: [text, table]
        content:
          description: 切片正文，不含标题路径。
          type: string
        score:
          description: 相关度，越大越相关：重排时是 rerank 模型的得分，否则是 RRF 融合分。只在同一次检索的结果之间可比。
          type: number
          format: double
        source:
          $ref: '#/components/schemas/KnowledgeSource'
    KnowledgeSource:
      description: 切片在原文中的位置。
      type: object
      required: [page_start, page_end, heading_path]
      properties:
        page_start:
          description: 起始页；没有分页的格式（Markdown、Word 等）为 null。
          type: [integer, 'null']
        page_end:
          description: 结束页；没有分页的格式为 null。
          type: [integer, 'null']
        heading_path:
          description: 标题路径，从文档标题到最近的一级。
          type: array
          items:
            type: string
    UploadDocumentRequest:
      description: 上传文档的表单。
      type: object
      required: [file]
      properties:
        file:
          description: 文档内容；表单中的文件名经规范化后成为 `filename`。
          type: string
          format: binary
        acl_tags:
          description: |
            访问标签，逗号分隔，例如 `dept:finance,level:internal`；至多 32 个，每个 1 至 128 个字符（字母、数字与 `._:-@/`），
            写到文档的每个切片上。不传时没有标签。
          type: string
          maxLength: 4200
          pattern: '^[A-Za-z0-9._:@/-]+(,[A-Za-z0-9._:@/-]+)*$'
    DocumentStatus:
      description: |
        文档状态：`queued` 等待写入（含等待重试），`processing` 正在写入，`ready` 切片已可检索，`failed` 写入失败（见
        `ingestion.error`；之前成功写入过的切片仍可检索）。
      type: string
      enum: [queued, processing, ready, failed]
    IngestionStage:
      description: 写入阶段：`parsing` 解析，`chunking` 切分，`embedding` 计算向量，`storing` 入库。
      type: string
      enum: [parsing, chunking, embedding, storing]
    IngestionError:
      description: 写入失败的原因。
      type: object
      required: [code, message, retryable]
      properties:
        code:
          description: 错误码，例如 `document.parse_failed`、`document.parser_unavailable`、`model.not_found`。
          type: string
        message:
          description: 说明。
          type: string
        retryable:
          description: 是否为可重试的错误（依赖暂时不可用等）；重试用尽后仍可重新处理。
          type: boolean
    DocumentIngestion:
      description: 最近一次写入的进度。
      type: object
      required: [attempts, max_attempts, stage, chunks_total, chunks_embedded, next_attempt_at, error, started_at, finished_at]
      properties:
        attempts:
          description: 已开始的尝试次数。
          type: integer
        max_attempts:
          description: 最多尝试次数（首次加 3 次重试）。
          type: integer
        stage:
          description: 正在进行的阶段；未开始或已结束时为 null。
          oneOf:
            - $ref: '#/components/schemas/IngestionStage'
            - type: 'null'
        chunks_total:
          description: 本次切分得到的切片数；切分之前为 null。
          type: [integer, 'null']
        chunks_embedded:
          description: 已计算向量的切片数；切分之前为 null。
          type: [integer, 'null']
        next_attempt_at:
          description: 等待重试时下一次尝试的最早时间；否则为 null。
          type: [string, 'null']
          format: date-time
        error:
          description: 最近一次失败的原因；没有失败时为 null。
          oneOf:
            - $ref: '#/components/schemas/IngestionError'
            - type: 'null'
        started_at:
          description: 最近一次尝试开始的时间；还没有开始时为 null。
          type: [string, 'null']
          format: date-time
        finished_at:
          description: 写入结束（成功或最终失败）的时间；未结束时为 null。
          type: [string, 'null']
          format: date-time
    KnowledgeDocument:
      description: 知识库中的一份文档。
      type: object
      required: [id, knowledge_base_id, filename, media_type, size_bytes, sha256, acl_tags, status, parser, chunk_count, ingestion, created_at, updated_at]
      properties:
        id:
          description: 文档 ID（doc_…）。
          type: string
        knowledge_base_id:
          description: 所属知识库（kb_…）。
          type: string
        filename:
          description: 规范化后的文件名。
          type: string
        media_type:
          description: 服务端按内容检测的媒体类型。
          type: string
        size_bytes:
          description: 原文件的字节数。
          type: integer
          format: int64
        sha256:
          description: 原文件的 SHA-256（小写十六进制）。
          type: string
        acl_tags:
          description: 访问标签。
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
        parser:
          description: 最近一次成功解析所用的解析器（`markdown`、`text`、`tika`、`pdfbox`、`doc-parser`）；还没有成功解析过时为 null。
          type: [string, 'null']
        chunk_count:
          description: 当前可检索的切片数。
          type: integer
        ingestion:
          $ref: '#/components/schemas/DocumentIngestion'
        created_at:
          description: 上传时间。
          type: string
          format: date-time
        updated_at:
          description: 最后更新时间。
          type: string
          format: date-time
    KnowledgeDocumentPage:
      description: 一页文档。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的文档。
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeDocument'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    WebhookDeliveryStatus:
      description: 投递状态：`pending` 等待投递或重试，`succeeded` 接收方返回了 2xx，`failed` 重试用尽、过了截止时间或 Webhook 已删除、停用。
      type: string
      enum: [pending, succeeded, failed]
    WebhookDelivery:
      description: 一个 Webhook 对一个事件的投递记录。
      type: object
      required: [id, webhook_id, session_id, event_id, event_type, status, attempts, next_attempt_at, last_attempt_at,
                 last_response_status, last_error, redelivery_of, created_at, completed_at]
      properties:
        id:
          description: 投递记录 ID（whd_…）。
          type: string
        webhook_id:
          description: Webhook ID（whk_…）。
          type: string
        session_id:
          description: 事件所属的会话。
          type: string
        event_id:
          description: 事件 ID（evt_…），接收方据此去重。
          type: string
        event_type:
          description: 事件类型。
          type: string
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        attempts:
          description: 已尝试的次数，至多 8。
          type: integer
        next_attempt_at:
          description: 下一次尝试的时间；不再尝试时为 null。
          type: [string, 'null']
          format: date-time
        last_attempt_at:
          description: 最近一次尝试的时间；还没有尝试时为 null。
          type: [string, 'null']
          format: date-time
        last_response_status:
          description: 最近一次尝试收到的 HTTP 状态码；没有收到响应（连接失败、超时、地址被拒绝）时为 null。
          type: [integer, 'null']
        last_error:
          description: 最近一次失败的原因；成功或还没有尝试时为 null。
          type: [string, 'null']
        redelivery_of:
          description: 手动重投时为原记录 ID；否则为 null。
          type: [string, 'null']
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        completed_at:
          description: 成功或最终失败的时间；仍在投递时为 null。
          type: [string, 'null']
          format: date-time
    WebhookDeliveryPage:
      description: 一页投递记录。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的条目。
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    Problem:
      description: RFC 9457 错误响应，扩展字段 `code` 与 `request_id`。
      type: object
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type:
          description: 错误类型 URI，`urn:meridian:error:<code>`。
          type: string
          examples: ['urn:meridian:error:session.not_found']
        title:
          description: 错误码的简短标题。
          type: string
        status:
          description: HTTP 状态码。
          type: integer
        detail:
          description: 本次错误的说明，不含凭据与内部信息。
          type: [string, 'null']
        instance:
          description: 请求路径。
          type: string
        code:
          description: 错误码，格式 `<领域>.<原因>`，只增不改。
          type: string
          examples: ['session.not_found']
        request_id:
          description: 本次请求的 ID，与响应头 `X-Request-Id` 相同。
          type: string
        errors:
          description: 字段校验失败的明细，只在 `request.validation_failed` 时出现。
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
    FieldViolation:
      description: 一个字段的校验失败。
      type: object
      required: [field, message]
      properties:
        field:
          description: 字段名（snake_case），嵌套字段用点号连接。
          type: string
        message:
          description: 失败原因。
          type: string

    Agent:
      description: 一个已发布的智能体。
      type: object
      required: [id, name, description, current_version, created_at, updated_at]
      properties:
        id:
          description: 智能体 ID（agt_…），创建会话时的 `agent` 取它表示使用当前版本。
          type: string
        name:
          description: 名字，项目内唯一。
          type: string
        description:
          description: 说明；没有时为空字符串。
          type: string
        current_version:
          $ref: '#/components/schemas/AgentVersionRef'
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        updated_at:
          description: 最近一次修改时间。
          type: string
          format: date-time
    AgentVersionRef:
      description: 智能体当前发布的版本。
      type: object
      required: [id, version, published_at]
      properties:
        id:
          description: 智能体版本 ID（agv_…），创建会话时的 `agent` 取它表示固定这个版本。
          type: string
        version:
          description: 版本号，从 1 开始。
          type: integer
        published_at:
          description: 发布时间。
          type: string
          format: date-time
    AgentPage:
      description: 一页智能体。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的智能体。
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    SessionStatus:
      description: |
        会话状态（架构设计「状态机」）：`idle` 空闲，`running` 执行中，`requires_action` 等待调用方回应待处理动作，
        `rescheduled` 轮次被置回队列、等待重新执行，`terminated` 已归档或删除。
      type: string
      enum: [idle, running, requires_action, rescheduled, terminated]
    Interaction:
      description: 值守方式：`attended` 有人值守（默认），`unattended` 无人值守，需要人工确认的工具调用一律拒绝。
      type: string
      enum: [attended, unattended]
    Metadata:
      description: 调用方附加的元数据，平台不解释。最多 16 个键；键不超过 64 个字符，值不超过 512 个字符。
      type: object
      maxProperties: 16
      propertyNames:
        minLength: 1
        maxLength: 64
      additionalProperties:
        type: string
        maxLength: 512
    EndUserAttributes:
      description: 终端用户属性，由业务系统提供，平台据此做数据权限过滤。
      type: object
      properties:
        acl_tags:
          description: 知识库检索的访问标签，例如 `dept:finance`；检索只返回带有其中任一标签或不限标签的切片。最多 64 个。
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 128
    SideEffect:
      description: 副作用等级：`none`、`idempotent` 可以重放，`non_idempotent` 不能重放。
      type: string
      enum: [none, idempotent, non_idempotent]
    CustomToolDeclaration:
      description: |
        会话声明的自定义工具：智能体调用它时本轮暂停，产生 `custom_tool_result` 待处理动作，由业务系统执行并回传结果。
      type: object
      required: [name, description, input_schema]
      properties:
        name:
          description: 工具名，小写字母开头，只含小写字母、数字与下划线，不超过 64 个字符；不能与平台工具重名。
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        description:
          description: 给模型看的工具说明。
          type: string
          minLength: 1
          maxLength: 2048
        input_schema:
          description: 入参的 JSON Schema（对象）。
          type: object
          additionalProperties: true
        side_effect:
          $ref: '#/components/schemas/SideEffect'

    CreateSessionRequest:
      description: 创建会话的请求。
      type: object
      required: [agent, environment]
      properties:
        agent:
          description: 智能体 ID（agt_…，使用该智能体当前发布的版本）或智能体版本 ID（agv_…，固定版本）。
          type: string
          pattern: '^(agt|agv)_[A-Za-z0-9_]{1,64}$'
        environment:
          description: 环境 ID（env_…），使用该环境当前的修订号。
          type: string
          pattern: '^env_[A-Za-z0-9_]{1,64}$'
        end_user_id:
          description: 终端用户标识，由业务系统定义；与项目一起构成数据隔离的边界。不传表示没有终端用户。
          type: string
          minLength: 1
          maxLength: 128
        end_user_attributes:
          $ref: '#/components/schemas/EndUserAttributes'
        interaction:
          $ref: '#/components/schemas/Interaction'
        metadata:
          $ref: '#/components/schemas/Metadata'
        custom_tools:
          description: 自定义工具声明，最多 64 个，名称不能重复。
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/CustomToolDeclaration'
    UpdateSessionRequest:
      description: 更新会话的请求，未给出的字段保持不变。
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
    Session:
      description: 会话。
      type: object
      required: [id, agent_id, agent_version_id, environment_id, environment_revision, end_user_id, end_user_attributes,
                 interaction, status, metadata, custom_tools, last_seq, created_at, updated_at, terminated_at,
                 deleted_at]
      properties:
        id:
          description: 会话 ID（ses_…）。
          type: string
          examples: ['ses_01JC8Z4V7Q9X3M2N6P0R5T8W1Y']
        agent_id:
          description: 绑定的智能体 ID（agt_…）；T19b 之前创建的会话没有记录，为 null。
          type: [string, 'null']
        agent_version_id:
          description: 绑定的智能体版本 ID（agv_…），创建后不变。
          type: string
        environment_id:
          description: 绑定的环境 ID（env_…）。
          type: string
        environment_revision:
          description: 创建会话时固化的环境修订号，从 1 开始。
          type: integer
          format: int64
          minimum: 1
        end_user_id:
          description: 终端用户标识；为 null 表示没有终端用户。
          type: [string, 'null']
        end_user_attributes:
          $ref: '#/components/schemas/EndUserAttributes'
        interaction:
          $ref: '#/components/schemas/Interaction'
        status:
          $ref: '#/components/schemas/SessionStatus'
        metadata:
          $ref: '#/components/schemas/Metadata'
        custom_tools:
          description: 创建会话时声明的自定义工具。
          type: array
          items:
            $ref: '#/components/schemas/CustomToolDeclaration'
        last_seq:
          description: 最新事件的 `seq`；没有事件时为 0。
          type: integer
          format: int64
          minimum: 0
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        updated_at:
          description: 最近一次修改时间。
          type: string
          format: date-time
        terminated_at:
          description: 归档或删除的时间；为 null 表示未终止。
          type: [string, 'null']
          format: date-time
        deleted_at:
          description: 删除的时间；为 null 表示未删除。终止但未删除即已归档。
          type: [string, 'null']
          format: date-time
    SessionPage:
      description: 会话列表的一页。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']

    SessionThread:
      description: 线程（命名避开 Java 的 Thread）。
      type: object
      required: [id, session_id, parent_thread_id, parent_tool_use_id, agent_name, status, created_at]
      properties:
        id:
          description: 线程 ID（thr_…）。
          type: string
        session_id:
          description: 所属会话。
          type: string
        parent_thread_id:
          description: 父线程 ID；主线程为 null。
          type: [string, 'null']
        parent_tool_use_id:
          description: 拉起本子线程的 spawn_subagent 工具调用 ID；主线程为 null。
          type: [string, 'null']
        agent_name:
          description: 执行本线程的智能体名：主线程为智能体名，子线程为子智能体名。
          type: string
        status:
          $ref: '#/components/schemas/SessionStatus'
        created_at:
          description: 创建时间。
          type: string
          format: date-time
    ThreadPage:
      description: 线程列表的一页。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionThread'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']

    PendingActionType:
      description: |
        待处理动作的类型：`tool_confirmation` 工具确认、`plan_exit` 退出计划模式确认（都用 `user.tool_confirmation` 回应），
        `custom_tool_result` 自定义工具结果（`user.custom_tool_result`），`recovery_confirmation` 崩溃恢复时是否重试状态未知的
        调用（`user.recovery_confirmation`）。
      type: string
      enum: [tool_confirmation, plan_exit, custom_tool_result, recovery_confirmation]
    PendingActionStatus:
      description: 待处理动作的状态：`pending` 等待回应，`resolved` 已回应，`expired` 已超时或随会话终止作废。
      type: string
      enum: [pending, resolved, expired]
    PendingAction:
      description: 一个待处理动作。
      type: object
      required: [id, session_id, agent_id, thread_id, turn_id, type, status, tool_use_id, tool_name, input, expires_at,
                 created_at, resolved_at, decided_by, conclusion]
      properties:
        id:
          description: 动作 ID（act_…），回应事件的 `action_id`。
          type: string
        session_id:
          description: 所属会话。
          type: string
        agent_id:
          description: 会话绑定的智能体 ID（agt_…）；T19b 之前创建的会话没有记录，为 null。
          type: [string, 'null']
        thread_id:
          description: 产生动作的线程。
          type: string
        turn_id:
          description: 产生动作的轮次。
          type: string
        type:
          $ref: '#/components/schemas/PendingActionType'
        status:
          $ref: '#/components/schemas/PendingActionStatus'
        tool_use_id:
          description: 相关的工具调用 ID。
          type: string
        tool_name:
          description: 相关的工具名。
          type: string
        input:
          description: 相关工具调用的入参。
          type: object
          additionalProperties: true
        expires_at:
          description: 截止时间，超时按动作类型处理（工具确认视为拒绝、自定义工具以 timeout 错误回传、恢复确认视为 skip）。
          type: string
          format: date-time
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        resolved_at:
          description: 回应或超时的时间；为 null 表示仍在等待。
          type: [string, 'null']
          format: date-time
        decided_by:
          description: |
            回应者：API Key 回应时为 Key ID（key_…），控制台用户回应时为用户标识；平台给出的结论（超时、中断、无人值守）与仍在等待时
            为 null。
          type: [string, 'null']
        conclusion:
          description: 结论；仍在等待、或随会话终止作废时为 null。
          oneOf:
            - $ref: '#/components/schemas/PendingActionConclusion'
            - type: 'null'
    PendingActionConclusion:
      description: 待处理动作的结论（自定义工具的结果内容不在这里，见会话事件）。按动作类型只有对应的字段有值，其余为 null。
      type: object
      required: [origin, approved, deny_reason, remember_scope, decision, error]
      properties:
        origin:
          description: |
            结论的来源：`caller` 调用方的回应，`timeout` 超时，`interrupt` 等待回应时被中断，`unattended` 无人值守的会话自动拒绝。
          type: string
          enum: [caller, timeout, interrupt, unattended]
        approved:
          description: 工具确认与退出计划模式：是否批准。
          type: [boolean, 'null']
        deny_reason:
          description: 拒绝理由；没有时为 null。
          type: [string, 'null']
        remember_scope:
          description: 工具确认与退出计划模式："记住此决定"的作用域。
          oneOf:
            - $ref: '#/components/schemas/RememberScope'
            - type: 'null'
        decision:
          description: 恢复确认：重试或跳过。
          oneOf:
            - $ref: '#/components/schemas/RecoveryDecision'
            - type: 'null'
        error:
          description: 自定义工具：回传的是否为错误结果。
          type: [boolean, 'null']
    StatsWindow:
      description: 统计时间窗：最近 1 小时、24 小时、7 天，按整点对齐。
      type: string
      enum: [1h, 24h, 7d]
    SessionStats:
      description: 当前项目（或某个智能体）的会话运行概况。
      type: object
      required: [window, window_start, generated_at, stats_updated_at, running_sessions, requires_action_sessions,
                 pending_actions, agents, recent_errors]
      properties:
        window:
          $ref: '#/components/schemas/StatsWindow'
        window_start:
          description: 时间窗的起点（整点）。
          type: string
          format: date-time
        generated_at:
          description: 生成本响应的时间。
          type: string
          format: date-time
        stats_updated_at:
          description: 失败率汇总到的时间，之后结束的轮次还没有计入；还没有汇总过时为 null。
          type: [string, 'null']
          format: date-time
        running_sessions:
          description: 执行中（含被置回队列、等待重新执行）的会话数。
          type: integer
          format: int64
          minimum: 0
        requires_action_sessions:
          description: 等待调用方回应的会话数。
          type: integer
          format: int64
          minimum: 0
        pending_actions:
          description: 等待回应的待处理动作数。
          type: integer
          format: int64
          minimum: 0
        agents:
          description: 每个智能体的统计，按智能体 ID 排序；时间窗内没有轮次、也没有使用中会话的智能体不出现。
          type: array
          items:
            $ref: '#/components/schemas/AgentSessionStats'
        recent_errors:
          description: 时间窗内最近的失败轮次，新的在前，至多 10 个。
          type: array
          items:
            $ref: '#/components/schemas/RecentTurnError'
    AgentSessionStats:
      description: 一个智能体的会话统计。
      type: object
      required: [agent_id, active_sessions, running_sessions, turns, failed_turns, failure_rate]
      properties:
        agent_id:
          description: 智能体 ID（agt_…）。
          type: string
        active_sessions:
          description: 使用中（未归档、未删除）的会话数：删除智能体后这些会话无法继续。
          type: integer
          format: int64
          minimum: 0
        running_sessions:
          description: 其中执行中的会话数。
          type: integer
          format: int64
          minimum: 0
        turns:
          description: 时间窗内结束的轮次数（完成、中断、失败）。
          type: integer
          format: int64
          minimum: 0
        failed_turns:
          description: 其中失败的轮次数。
          type: integer
          format: int64
          minimum: 0
        failure_rate:
          description: 失败率，0 到 1；时间窗内没有轮次时为 null。
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 1
    RecentTurnError:
      description: 一个失败的轮次。
      type: object
      required: [session_id, thread_id, turn_id, agent_id, code, message, occurred_at]
      properties:
        session_id:
          description: 会话 ID。
          type: string
        thread_id:
          description: 线程 ID。
          type: string
        turn_id:
          description: 轮次 ID。
          type: string
        agent_id:
          description: 智能体 ID；T19b 之前创建的会话为 null。
          type: [string, 'null']
        code:
          description: 错误码（该轮 `session.error` 事件的 `code`）；找不到该事件时为 null。
          type: [string, 'null']
        message:
          description: 错误信息；找不到该事件时为 null。
          type: [string, 'null']
        occurred_at:
          description: 轮次结束的时间。
          type: string
          format: date-time
    PendingActionPage:
      description: 待处理动作列表的一页。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PendingAction'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']

    ContentBlock:
      description: |
        消息中的一个内容块。二进制内容不内联：图片与文件以 URL 或平台文件 ID（fil_…，经 `POST /v1/files` 上传）引用。
        发送事件时按文件 ID 引用的文件必须属于当前项目，平台补全 `filename`、把 `media_type` 改为服务端检测的类型后保存；
        轮次开始时文件被放进工作区的 `uploads/{file_id}/{filename}`，智能体收到的是工作区路径（按文件 ID 引用的图片同样
        作为文件放进工作区）。
      oneOf:
        - $ref: '#/components/schemas/TextBlock'
        - $ref: '#/components/schemas/ImageBlock'
        - $ref: '#/components/schemas/FileBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextBlock'
          image: '#/components/schemas/ImageBlock'
          file: '#/components/schemas/FileBlock'
    TextBlock:
      description: 文本块。
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          const: text
        text:
          description: 文本内容。
          type: string
          maxLength: 100000
    ImageBlock:
      description: 图片块，`url` 与 `file_id` 恰好给出一个。
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: image
        url:
          description: 图片的 http 或 https 地址；为 null 表示用 `file_id`。
          type: [string, 'null']
          maxLength: 2048
        file_id:
          description: 平台文件 ID（fil_…），文件的检测类型必须是图片；为 null 表示用 `url`。
          type: [string, 'null']
        media_type:
          description: 媒体类型，例如 `image/png`；为 null 表示由来源推断。按 `file_id` 引用时为服务端检测的类型。
          type: [string, 'null']
    FileBlock:
      description: 文件引用块。
      type: object
      required: [type, file_id]
      properties:
        type:
          type: string
          const: file
        file_id:
          description: 平台文件 ID（fil_…）。
          type: string
        filename:
          description: 文件名，决定文件在工作区中的名字（经规范化）；为 null 表示用文件元数据中的名字。事件中保存的是规范化后的名字。
          type: [string, 'null']
        media_type:
          description: 媒体类型。事件中保存的总是服务端检测的类型，请求中给出的值被忽略。
          type: [string, 'null']

    UploadFileRequest:
      description: 上传文件的表单。
      type: object
      required: [file]
      properties:
        file:
          description: 文件内容；表单中的文件名经规范化后成为 `filename`。
          type: string
          format: binary
    UploadedFile:
      description: 上传到平台的文件，属于一个项目。
      type: object
      required: [id, filename, media_type, size_bytes, sha256, created_at]
      properties:
        id:
          description: 文件 ID（fil_…）。
          type: string
        filename:
          description: 规范化后的文件名，不含目录部分。
          type: string
        media_type:
          description: 服务端按内容检测的媒体类型，例如 `application/pdf`、`text/plain`。
          type: string
        size_bytes:
          description: 字节数。
          type: integer
          format: int64
          minimum: 1
        sha256:
          description: 内容的 SHA-256（小写十六进制）。
          type: string
        created_at:
          description: 上传时间。
          type: string
          format: date-time
    WorkspaceFile:
      description: 工作区中的一个文件。
      type: object
      required: [path, size_bytes, updated_at]
      properties:
        path:
          description: 相对工作区根的路径，分隔符为 `/`。
          type: string
        size_bytes:
          description: 字节数；为 null 表示平台没有记录大小（T17b 之前由智能体写入的文件）。
          type: [integer, 'null']
          format: int64
        updated_at:
          description: 最近一次写入（`sandbox` 档为最近一次同步）的时间。
          type: string
          format: date-time
    WorkspaceFilePage:
      description: 工作区文件列表的一页。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFile'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    SendEventsRequest:
      description: 发送事件的请求。
      type: object
      required: [events]
      properties:
        events:
          description: 要发送的事件，按顺序处理，最多 20 个。
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/UserEventInput'
    UserEventInput:
      description: 调用方发送的一个用户事件，字段与事件信封中 `data` 的字段相同。
      oneOf:
        - $ref: '#/components/schemas/UserMessageInput'
        - $ref: '#/components/schemas/UserInterruptInput'
        - $ref: '#/components/schemas/UserToolConfirmationInput'
        - $ref: '#/components/schemas/UserCustomToolResultInput'
        - $ref: '#/components/schemas/UserRecoveryConfirmationInput'
      discriminator:
        propertyName: type
        mapping:
          user.message: '#/components/schemas/UserMessageInput'
          user.interrupt: '#/components/schemas/UserInterruptInput'
          user.tool_confirmation: '#/components/schemas/UserToolConfirmationInput'
          user.custom_tool_result: '#/components/schemas/UserCustomToolResultInput'
          user.recovery_confirmation: '#/components/schemas/UserRecoveryConfirmationInput'
    Delivery:
      description: |
        投递方式（架构设计「消息投递」）：`queue`（默认）在线程运行中时排队，本轮结束后与其他排队消息合并成下一轮；
        `steer` 在线程运行中时注入当前轮的下一次推理，来不及注入时降级为 `queue`。引用了平台文件（`file_id`）的消息总按
        `queue` 投递：文件在轮次开始时才放进工作区。
      type: string
      enum: [queue, steer]
    RememberScope:
      description: '"记住此决定"的作用域：`none` 不记住（默认），`session` 记为会话级规则，`project` 记为项目级规则。'
      type: string
      enum: [none, session, project]
    RecoveryDecision:
      description: 恢复确认的决定：`retry` 用原幂等键重新执行该调用，`skip` 跳过。
      type: string
      enum: [retry, skip]
    UserMessageInput:
      description: 一条用户消息。
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          const: user.message
        content:
          description: 内容块，1 至 32 个。
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/ContentBlock'
        delivery:
          $ref: '#/components/schemas/Delivery'
    UserInterruptInput:
      description: 请求中断当前轮。随中断一起发送的消息按 `queue` 处理。
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: user.interrupt
    UserToolConfirmationInput:
      description: 回应 `tool_confirmation` 或 `plan_exit` 动作。
      type: object
      required: [type, action_id, approved]
      properties:
        type:
          type: string
          const: user.tool_confirmation
        action_id:
          description: 被回应的动作 ID（act_…）。
          type: string
        approved:
          description: 是否批准。
          type: boolean
        updated_input:
          description: 审批人修改后的入参；不传表示按原入参执行。
          type: object
          additionalProperties: true
        deny_reason:
          description: 拒绝理由，会告诉模型。
          type: string
          maxLength: 2000
        remember_scope:
          $ref: '#/components/schemas/RememberScope'
    UserCustomToolResultInput:
      description: 回传自定义工具的执行结果。
      type: object
      required: [type, action_id]
      properties:
        type:
          type: string
          const: user.custom_tool_result
        action_id:
          description: 被回应的动作 ID（act_…）。
          type: string
        content:
          description: 结果内容块，最多 32 个。
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ContentBlock'
        error:
          description: 是否为错误结果。
          type: boolean
          default: false
    UserRecoveryConfirmationInput:
      description: 决定是否重试一个状态未知的 non_idempotent 调用。
      type: object
      required: [type, action_id, decision]
      properties:
        type:
          type: string
          const: user.recovery_confirmation
        action_id:
          description: 被回应的动作 ID（act_…）。
          type: string
        decision:
          $ref: '#/components/schemas/RecoveryDecision'
    SendEventsResponse:
      description: 发送事件的结果。
      type: object
      required: [data]
      properties:
        data:
          description: 持久化后的事件，顺序与请求相同。
          type: array
          items:
            $ref: '#/components/schemas/SessionEvent'
    EventPage:
      description: 事件列表的一页。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionEvent'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    SseFrame:
      description: |
        SSE 事件流中的一条消息。它不是 JSON 对象，而是三行文本：`event:` 为 `event`，`id:` 为 `id`（只在流上的事件没有这一行），
        `data:` 为事件信封 JSON。
      type: object
      required: [event, data]
      properties:
        event:
          description: 事件类型，与信封的 `type` 相同。
          type: string
        id:
          description: 事件的 `seq`（十进制字符串）；只在流上的事件为 null。
          type: [string, 'null']
        data:
          description: |
            事件信封 JSON：持久化事件的结构见 `SessionEvent`，只在流上的事件见 `StreamOnlyEvent`。这里不写成二者的 `oneOf`：
            嵌套的判别器联合会让生成的 DTO 无法编译（见 meridian-api 的 CLAUDE.md「写作约束」）。
          type: object
          additionalProperties: true

    EnvelopeSessionId:
      description: 所属会话 ID（ses_…）。
      type: string
    EnvelopeThreadId:
      description: 事件所属线程（子线程的事件为子线程）；为 null 表示会话级事件。
      type: [string, 'null']
    EnvelopeTurnId:
      description: 产生事件的轮次；为 null 表示不属于某一轮，例如调用方发送的 `user.*` 事件。
      type: [string, 'null']
    EnvelopeCreatedAt:
      description: 写入时间。
      type: string
      format: date-time

    EmptyData:
      description: 没有字段。
      type: object
    UserMessageData:
      type: object
      required: [content, delivery]
      properties:
        content:
          description: 内容块。
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
        delivery:
          $ref: '#/components/schemas/Delivery'
    UserToolConfirmationData:
      type: object
      required: [action_id, approved, updated_input, deny_reason, remember_scope]
      properties:
        action_id:
          description: 被回应的动作 ID。
          type: string
        approved:
          description: 是否批准。
          type: boolean
        updated_input:
          description: 修改后的入参；为 null 表示按原入参执行。
          type: [object, 'null']
          additionalProperties: true
        deny_reason:
          description: 拒绝理由；可为 null。
          type: [string, 'null']
        remember_scope:
          $ref: '#/components/schemas/RememberScope'
    UserCustomToolResultData:
      type: object
      required: [action_id, content, error]
      properties:
        action_id:
          description: 被回应的动作 ID。
          type: string
        content:
          description: 结果内容块。
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
        error:
          description: 是否为错误结果。
          type: boolean
    UserRecoveryConfirmationData:
      type: object
      required: [action_id, decision]
      properties:
        action_id:
          description: 被回应的动作 ID。
          type: string
        decision:
          $ref: '#/components/schemas/RecoveryDecision'
    AgentMessageData:
      type: object
      required: [block_id, content]
      properties:
        block_id:
          description: 块 ID，与流上的 `event_start`、`event_delta` 对应。
          type: string
        content:
          description: 拼装后的完整内容块。
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
    AgentThinkingData:
      type: object
      required: [block_id, text]
      properties:
        block_id:
          description: 块 ID。
          type: string
        text:
          description: 思考内容；为 null 表示智能体配置不暴露思考内容。
          type: [string, 'null']
    ToolInput:
      description: 工具调用的入参（JSON 对象）。
      type: object
      additionalProperties: true
    ToolResultState:
      description: 工具结果状态：`success` 成功，`error` 执行出错，`interrupted` 被中断，`denied` 被权限或审批拒绝，`running` 已转入后台执行。
      type: string
      enum: [success, error, interrupted, denied, running]
    PermissionOutcome:
      description: 权限结果：`allowed` 规则放行，`approved` 经人工批准，`denied` 被拒绝。
      type: string
      enum: [allowed, approved, denied]
    BlobRef:
      description: 存在对象存储中的大对象引用，例如超过 16 KB 的工具结果。
      type: object
      required: [key, content_type, size]
      properties:
        key:
          description: 对象键，调用方不解析其结构。
          type: string
        content_type:
          description: 媒体类型。
          type: string
        size:
          description: 内容长度，单位字节。
          type: integer
          format: int64
          minimum: 0
    AgentToolUseData:
      type: object
      required: [tool_use_id, name, input]
      properties:
        tool_use_id:
          description: 工具调用 ID。
          type: string
        name:
          description: 工具名。
          type: string
        input:
          $ref: '#/components/schemas/ToolInput'
    AgentToolResultData:
      type: object
      required: [tool_use_id, name, state, permission, content, content_ref]
      properties:
        tool_use_id:
          description: 工具调用 ID。
          type: string
        name:
          description: 工具名。
          type: string
        state:
          $ref: '#/components/schemas/ToolResultState'
        permission:
          $ref: '#/components/schemas/PermissionOutcome'
        content:
          description: 结果内容；超过 16 KB 时为空数组，内容见 `content_ref`。
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
        content_ref:
          description: 存入对象存储的结果引用；为 null 表示内容在 `content` 中。
          oneOf:
            - $ref: '#/components/schemas/BlobRef'
            - type: 'null'
    AgentMcpToolUseData:
      type: object
      required: [tool_use_id, name, server_name, input]
      properties:
        tool_use_id:
          description: 工具调用 ID。
          type: string
        name:
          description: 工具全名 `mcp__{server}__{tool}`。
          type: string
        server_name:
          description: MCP 服务名。
          type: string
        input:
          $ref: '#/components/schemas/ToolInput'
    AgentMcpToolResultData:
      type: object
      required: [tool_use_id, name, server_name, state, permission, content, content_ref]
      properties:
        tool_use_id:
          description: 工具调用 ID。
          type: string
        name:
          description: 工具全名。
          type: string
        server_name:
          description: MCP 服务名。
          type: string
        state:
          $ref: '#/components/schemas/ToolResultState'
        permission:
          $ref: '#/components/schemas/PermissionOutcome'
        content:
          description: 结果内容；超过 16 KB 时为空数组。
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
        content_ref:
          description: 存入对象存储的结果引用；为 null 表示内容在 `content` 中。
          oneOf:
            - $ref: '#/components/schemas/BlobRef'
            - type: 'null'
    AgentCustomToolUseData:
      type: object
      required: [tool_use_id, name, input]
      properties:
        tool_use_id:
          description: 工具调用 ID。
          type: string
        name:
          description: 自定义工具名。
          type: string
        input:
          $ref: '#/components/schemas/ToolInput'
    AgentContextCompactedData:
      type: object
      required: [messages_before, messages_after]
      properties:
        messages_before:
          description: 压缩前上下文中的消息数。
          type: integer
          minimum: 0
        messages_after:
          description: 压缩后上下文中的消息数（含摘要消息）。
          type: integer
          minimum: 0
    StopReason:
      description: |
        停止原因：`end_turn` 正常结束，`interrupted` 被中断，`max_turns` 达到单轮最大推理次数，`budget_exceeded` 预算耗尽，
        `tools_denied` 本次推理的工具调用全部被拒绝，`error` 出错。
      type: string
      enum: [end_turn, interrupted, max_turns, budget_exceeded, tools_denied, error]
    SessionStatusIdleData:
      type: object
      required: [stop_reason]
      properties:
        stop_reason:
          $ref: '#/components/schemas/StopReason'
    PendingActionSummary:
      description: '`session.status_requires_action` 中的一个待处理动作。'
      type: object
      required: [id, type, tool_use_id, tool_name, input, expires_at]
      properties:
        id:
          description: 动作 ID（act_…）。
          type: string
        type:
          $ref: '#/components/schemas/PendingActionType'
        tool_use_id:
          description: 相关的工具调用 ID。
          type: string
        tool_name:
          description: 相关的工具名。
          type: string
        input:
          $ref: '#/components/schemas/ToolInput'
        expires_at:
          description: 截止时间。
          type: [string, 'null']
          format: date-time
    SessionStatusRequiresActionData:
      type: object
      required: [actions]
      properties:
        actions:
          description: 本轮的全部待处理动作。
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PendingActionSummary'
    SessionStatusRescheduledData:
      type: object
      required: [reason]
      properties:
        reason:
          description: 置回原因：`lease_expired` 租约过期，`node_shutdown` 节点下线，`retryable_error` 可重试的错误。
          type: string
          enum: [lease_expired, node_shutdown, retryable_error]
    SessionStatusTerminatedData:
      type: object
      required: [reason]
      properties:
        reason:
          description: 终止原因：`archived` 归档，`deleted` 删除。
          type: string
          enum: [archived, deleted]
    SessionErrorData:
      type: object
      required: [code, message, retry_status]
      properties:
        code:
          description: 错误码，格式 `<领域>.<原因>`，例如 `model.rate_limit_timeout`。
          type: string
        message:
          description: 错误说明，不含凭据与内部信息。
          type: string
        retry_status:
          description: 重试状态：`retryable` 平台会重新执行本轮，`exhausted` 可重试但恢复次数已用尽，`terminal` 不可重试。
          type: string
          enum: [retryable, exhausted, terminal]
    TokenUsage:
      description: 一次模型调用的 token 用量；后三项是前两项的子集。
      type: object
      required: [input_tokens, output_tokens, cached_tokens, cache_creation_tokens, reasoning_tokens]
      properties:
        input_tokens:
          description: 输入 token 数。
          type: integer
          minimum: 0
        output_tokens:
          description: 输出 token 数。
          type: integer
          minimum: 0
        cached_tokens:
          description: 命中提示词缓存的输入 token 数。
          type: integer
          minimum: 0
        cache_creation_tokens:
          description: 写入提示词缓存的输入 token 数。
          type: integer
          minimum: 0
        reasoning_tokens:
          description: 用于推理的输出 token 数。
          type: integer
          minimum: 0
    SessionUsageData:
      type: object
      required: [usage, session_usage, models]
      properties:
        model_id:
          description: 本轮用量（输入加输出）最多的模型 ID（mdl_…）；本轮没有模型调用时不出现。各模型的明细见 `models`。
          type: string
        usage:
          description: 本轮的模型用量合计，含压缩与子智能体的调用；与账本中本轮 `model_tokens` 记录之和相同。
          $ref: '#/components/schemas/TokenUsage'
        session_usage:
          description: 会话到本轮为止的模型用量累计（含本轮）。
          $ref: '#/components/schemas/TokenUsage'
        models:
          description: 本轮按模型的用量，按模型 ID 排序；本轮没有模型调用时为空数组。
          type: array
          items:
            $ref: '#/components/schemas/ModelTokenUsage'
    ModelTokenUsage:
      description: 一个模型在本轮的用量。
      type: object
      required: [model_id, calls, usage]
      properties:
        model_id:
          description: 模型 ID（mdl_…）。
          type: string
        calls:
          description: 本轮结算的调用次数。
          type: integer
          minimum: 1
        usage:
          $ref: '#/components/schemas/TokenUsage'
    SessionMessageConsumedData:
      type: object
      required: [event_ids]
      properties:
        event_ids:
          description: 被消费的 `user.message` 事件 ID。
          type: array
          minItems: 1
          items:
            type: string
    SessionThreadCreatedData:
      type: object

          description: 只列出该状态的动作；不给时列出全部状态。
          schema:
            $ref: '#/components/schemas/PendingActionStatus'
        - name: type
          in: query
          description: 只列出该类型的动作。
          schema:
            $ref: '#/components/schemas/PendingActionType'
        - name: agent_id
          in: query
          description: 只列出绑定该智能体的会话中的动作。
          schema:
            type: string
            pattern: '^agt_[A-Za-z0-9_]{1,64}$'
        - name: session_id
          in: query
          description: 只列出该会话的动作。
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: 待处理动作列表。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:

          description: 会话内序号，从 1 开始，会话内严格递增且连续
          type: integer
          format: int64
          minimum: 1
        session_id:
          $ref: '#/components/schemas/EnvelopeSessionId'
        thread_id:
          $ref: '#/components/schemas/EnvelopeThreadId'
        turn_id:
          $ref: '#/components/schemas/EnvelopeTurnId'
        type:
          type: string
          const: span.model_request_end
        created_at:
          $ref: '#/components/schemas/EnvelopeCreatedAt'
        data:
          $ref: '#/components/schemas/SpanModelRequestEndData'
    EventStartEvent:
      description: 'event_start：一个内容块开始，只在流上出现（?event_deltas=true）'
      type: object
      required: [id, seq, session_id, thread_id, turn_id, type, created_at, data]
      properties:
        id:
          description: 只在流上的事件没有 ID，恒为 null
          type: [string, 'null']
        seq:
          description: 只在流上的事件不占序号，恒为 null
          type: [integer, 'null']
          format: int64
        session_id:
          $ref: '#/components/schemas/EnvelopeSessionId'
        thread_id:
          $ref: '#/components/schemas/EnvelopeThreadId'
        turn_id:
          $ref: '#/components/schemas/EnvelopeTurnId'
        type:
          type: string
          const: event_start
        created_at:
          $ref: '#/components/schemas/EnvelopeCreatedAt'
        data:
          $ref: '#/components/schemas/EventStartData'
    EventDeltaEvent:
      description: 'event_delta：一个内容块的增量，只在流上出现（?event_deltas=true）'
      type: object
      required: [id, seq, session_id, thread_id, turn_id, type, created_at, data]
      properties:
        id:
          description: 只在流上的事件没有 ID，恒为 null
          type: [string, 'null']
        seq:
          description: 只在流上的事件不占序号，恒为 null
          type: [integer, 'null']
          format: int64
        session_id:
          $ref: '#/components/schemas/EnvelopeSessionId'
        thread_id:
          $ref: '#/components/schemas/EnvelopeThreadId'
        turn_id:
          $ref: '#/components/schemas/EnvelopeTurnId'
        type:
          type: string
          const: event_delta
        created_at:
          $ref: '#/components/schemas/EnvelopeCreatedAt'
        data:
          $ref: '#/components/schemas/EventDeltaData'
    PingEvent:
      description: 'ping：心跳，每 15 秒一次，只在流上出现'
      type: object
      required: [id, seq, session_id, thread_id, turn_id, type, created_at, data]
      properties:
        id:
          description: 只在流上的事件没有 ID，恒为 null
          type: [string, 'null']
        seq:
          description: 只在流上的事件不占序号，恒为 null
          type: [integer, 'null']
          format: int64
        session_id:
          $ref: '#/components/schemas/EnvelopeSessionId'
        thread_id:
          $ref: '#/components/schemas/EnvelopeThreadId'
        turn_id:
          $ref: '#/components/schemas/EnvelopeTurnId'
        type:
          type: string
          const: ping
        created_at:
          $ref: '#/components/schemas/EnvelopeCreatedAt'
        data:
          $ref: '#/components/schemas/EmptyData'
    SessionEvent:
      description: 持久化的会话事件：信封字段相同，data 的结构由 type 决定（架构设计「事件」）。type 的取值会随版本增加，调用方遇到未知类型应忽略。
      oneOf:
        - $ref: '#/components/schemas/UserMessageEvent'
        - $ref: '#/components/schemas/UserInterruptEvent'
        - $ref: '#/components/schemas/UserToolConfirmationEvent'
        - $ref: '#/components/schemas/UserCustomToolResultEvent'
        - $ref: '#/components/schemas/UserRecoveryConfirmationEvent'
        - $ref: '#/components/schemas/AgentMessageEvent'
        - $ref: '#/components/schemas/AgentThinkingEvent'
        - $ref: '#/components/schemas/AgentToolUseEvent'
        - $ref: '#/components/schemas/AgentToolResultEvent'
        - $ref: '#/components/schemas/AgentMcpToolUseEvent'
        - $ref: '#/components/schemas/AgentMcpToolResultEvent'
        - $ref: '#/components/schemas/AgentCustomToolUseEvent'
        - $ref: '#/components/schemas/AgentContextCompactedEvent'
        - $ref: '#/components/schemas/SessionStatusRunningEvent'
        - $ref: '#/components/schemas/SessionStatusIdleEvent'
        - $ref: '#/components/schemas/SessionStatusRequiresActionEvent'
        - $ref: '#/components/schemas/SessionStatusRescheduledEvent'
        - $ref: '#/components/schemas/SessionStatusTerminatedEvent'
        - $ref: '#/components/schemas/SessionErrorEvent'
        - $ref: '#/components/schemas/SessionUsageEvent'
        - $ref: '#/components/schemas/SessionMessageConsumedEvent'
        - $ref: '#/components/schemas/SessionThreadCreatedEvent'
        - $ref: '#/components/schemas/SessionThreadStatusRunningEvent'
        - $ref: '#/components/schemas/SessionThreadStatusIdleEvent'
        - $ref: '#/components/schemas/SpanModelRequestStartEvent'
        - $ref: '#/components/schemas/SpanModelRequestEndEvent'
      discriminator:
        propertyName: type
        mapping:
          user.message: '#/components/schemas/UserMessageEvent'
          user.interrupt: '#/components/schemas/UserInterruptEvent'
          user.tool_confirmation: '#/components/schemas/UserToolConfirmationEvent'
          user.custom_tool_result: '#/components/schemas/UserCustomToolResultEvent'
          user.recovery_confirmation: '#/components/schemas/UserRecoveryConfirmationEvent'
          agent.message: '#/components/schemas/AgentMessageEvent'
          agent.thinking: '#/components/schemas/AgentThinkingEvent'
          agent.tool_use: '#/components/schemas/AgentToolUseEvent'
          agent.tool_result: '#/components/schemas/AgentToolResultEvent'
          agent.mcp_tool_use: '#/components/schemas/AgentMcpToolUseEvent'
          agent.mcp_tool_result: '#/components/schemas/AgentMcpToolResultEvent'
          agent.custom_tool_use: '#/components/schemas/AgentCustomToolUseEvent'
          agent.context_compacted: '#/components/schemas/AgentContextCompactedEvent'
          session.status_running: '#/components/schemas/SessionStatusRunningEvent'
          session.status_idle: '#/components/schemas/SessionStatusIdleEvent'
          session.status_requires_action: '#/components/schemas/SessionStatusRequiresActionEvent'
          session.status_rescheduled: '#/components/schemas/SessionStatusRescheduledEvent'
          session.status_terminated: '#/components/schemas/SessionStatusTerminatedEvent'
          session.error: '#/components/schemas/SessionErrorEvent'
          session.usage: '#/components/schemas/SessionUsageEvent'
          session.message_consumed: '#/components/schemas/SessionMessageConsumedEvent'
          session.thread_created: '#/components/schemas/SessionThreadCreatedEvent'
          session.thread_status_running: '#/components/schemas/SessionThreadStatusRunningEvent'
          session.thread_status_idle: '#/components/schemas/SessionThreadStatusIdleEvent'
          span.model_request_start: '#/components/schemas/SpanModelRequestStartEvent'
          span.model_request_end: '#/components/schemas/SpanModelRequestEndEvent'
    StreamOnlyEvent:
      description: 只在 SSE 流上出现、不持久化的事件：没有 id 与 seq。
      oneOf:
        - $ref: '#/components/schemas/EventStartEvent'
        - $ref: '#/components/schemas/EventDeltaEvent'
        - $ref: '#/components/schemas/PingEvent'
      discriminator:
        propertyName: type
        mapping:
          event_start: '#/components/schemas/EventStartEvent'
          event_delta: '#/components/schemas/EventDeltaEvent'
          ping: '#/components/schemas/PingEvent'

    CreateChatCompletionRequest:
      description: 对话补全请求，字段与 OpenAI Chat Completions 一致的子集；未列出的字段返回 400。
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model:
          description: 平台模型目录中的对话模型 ID（mdl_…）。
          type: string
          minLength: 1
        messages:
          description: 对话消息，按时间顺序，至少一条。
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatCompletionMessage'
        tools:
          description: 模型可以调用的函数工具。
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionTool'
        max_tokens:
          description: 最大输出 token 数；不传时使用模型目录的默认值。预算按"估算输入加它"预扣。
          type: integer
          minimum: 1
        max_completion_tokens:
          description: 与 `max_tokens` 相同（OpenAI 的新字段名）；两者都给出时以它为准。
          type: integer
          minimum: 1
        temperature:
          description: 采样温度。
          type: number
          minimum: 0
          maximum: 2
        stream:
          description: 为 `true` 时以 SSE 流式返回。
          type: boolean
          default: false
        stream_options:
          $ref: '#/components/schemas/ChatCompletionStreamOptions'
    ChatCompletionStreamOptions:
      description: 流式选项，只在 `stream` 为 `true` 时有效。
      type: object
      additionalProperties: false
      properties:
        include_usage:
          description: 为 `true` 时，`[DONE]` 之前多一条 `choices` 为空、带 `usage` 的块。
          type: boolean
          default: false
    ChatCompletionMessage:
      description: 一条对话消息。`tool` 消息必须带 `tool_call_id`；`assistant` 消息可以只有 `tool_calls`。
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          description: 角色。
          type: string
          enum: [system, user, assistant, tool]
        content:
          description: 文本内容；只有工具调用的助手消息可以为空。
          type: [string, 'null']
        tool_calls:
          description: 助手消息发起的工具调用。
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionMessageToolCall'
        tool_call_id:
          description: 工具消息回应的工具调用 ID。
          type: string
    ChatCompletionMessageToolCall:
      description: 一个完整的函数工具调用。
      type: object
      additionalProperties: false
      required: [id, type, function]
      properties:
        id:
          description: 工具调用 ID。
          type: string
        type:
          description: 固定为 `function`。
          type: string
          enum: [function]
        function:
          $ref: '#/components/schemas/ChatCompletionFunctionCall'
    ChatCompletionFunctionCall:
      description: 函数调用的名字与入参。
      type: object
      additionalProperties: false
      required: [name, arguments]
      properties:
        name:
          description: 函数名。
          type: string
        arguments:
          description: 入参 JSON 文本，可能不是合法 JSON（由模型生成）。
          type: string
    ChatCompletionTool:
      description: 一个函数工具。
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type:
          description: 固定为 `function`。
          type: string
          enum: [function]
        function:
          $ref: '#/components/schemas/ChatCompletionFunction'
    ChatCompletionFunction:
      description: 函数工具的定义。
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: 函数名。
          type: string
          minLength: 1
        description:
          description: 函数说明，供模型决定何时调用。
          type: string
        parameters:
          description: 入参的 JSON Schema；不传时为无参数的对象。
          type: object
          additionalProperties: true
    ChatCompletion:
      description: 非流式的对话补全结果。
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id:
          description: 本次补全的 ID（chatcmpl-…）。
          type: string
        object:
          description: 固定为 `chat.completion`。
          type: string
          enum: [chat.completion]
        created:
          description: 创建时间，Unix 秒。
          type: integer
          format: int64
        model:
          description: 请求中的模型 ID。
          type: string
        choices:
          description: 补全结果，只有一项。
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChoice'
        usage:
          description: 用量；供应商没有报告用量时为空（平台按估算计量）。
          oneOf:
            - $ref: '#/components/schemas/CompletionUsage'
            - type: 'null'
    ChatCompletionChoice:
      description: 一个补全结果。
      type: object
      required: [index, message, finish_reason]
      properties:
        index:
          description: 序号，固定为 0。
          type: integer
        message:
          $ref: '#/components/schemas/ChatCompletionResponseMessage'
        finish_reason:
          description: 结束原因：`stop`、`length`、`tool_calls` 等，取供应商的值。
          type: [string, 'null']
    ChatCompletionResponseMessage:
      description: 模型生成的助手消息。
      type: object
      required: [role, content, reasoning_content, tool_calls]
      properties:
        role:
          description: 固定为 `assistant`。
          type: string
          enum: [assistant]
        content:
          description: 文本内容；只有工具调用时为空。
          type: [string, 'null']
        reasoning_content:
          description: 思考内容；模型不输出思考时为空。
          type: [string, 'null']
        tool_calls:
          description: 模型发起的工具调用；没有时为空。
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ChatCompletionMessageToolCall'
    ChatCompletionChunk:
      description: 流式对话补全的一个增量块。没有值的可选字段不出现（与 OpenAI 相同）。
      type: object
      required: [id, object, created, model, choices]
      properties:
        id:
          description: 本次补全的 ID，同一次补全的所有块相同。
          type: string
        object:
          description: 固定为 `chat.completion.chunk`。
          type: string
          enum: [chat.completion.chunk]
        created:
          description: 创建时间，Unix 秒，同一次补全的所有块相同。
          type: integer
          format: int64
        model:
          description: 请求中的模型 ID。
          type: string
        choices:
          description: 增量，只有一项；带用量的最后一块为空列表，只有这一块出现 `usage`。
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChunkChoice'
        usage:
          $ref: '#/components/schemas/CompletionUsage'
    ChatCompletionChunkChoice:
      description: 一个增量。
      type: object
      required: [index, delta, finish_reason]
      properties:
        index:
          description: 序号，固定为 0。
          type: integer
        delta:
          $ref: '#/components/schemas/ChatCompletionChunkDelta'
        finish_reason:
          description: 结束原因，只在最后一个增量给出，其余为空。
          type: [string, 'null']
    ChatCompletionChunkDelta:
      description: 增量内容，只出现本块有的字段。
      type: object
      properties:
        role:
          description: 第一个增量为 `assistant`。
          type: string
          enum: [assistant]
        content:
          description: 追加的文本。
          type: string
        reasoning_content:
          description: 追加的思考内容。
          type: string
        tool_calls:
          description: 工具调用的增量，按 `index` 归并。
          type: array
          items:
            $ref: '#/components/schemas/ChatCompletionChunkToolCall'
    ChatCompletionChunkToolCall:
      description: 工具调用的增量：首个增量带 `id`、`type` 与函数名，之后只带入参片段。
      type: object
      required: [index]
      properties:
        index:
          description: 工具调用在本条消息中的序号，从 0 开始。
          type: integer
        id:
          description: 工具调用 ID，只在首个增量出现。
          type: string
        type:
          description: 固定为 `function`，只在首个增量出现。
          type: string
          enum: [function]
        function:
          $ref: '#/components/schemas/ChatCompletionChunkFunction'
    ChatCompletionChunkFunction:
      description: 函数调用的增量。
      type: object
      properties:
        name:
          description: 函数名，只在首个增量出现。
          type: string
        arguments:
          description: 追加的入参 JSON 片段。
          type: string
    CompletionUsage:
      description: 本次补全的用量，与计量记录一致。
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens, prompt_tokens_details, completion_tokens_details]
      properties:
        prompt_tokens:
          description: 输入 token。
          type: integer
        completion_tokens:
          description: 输出 token。
          type: integer
        total_tokens:
          description: 输入与输出之和。
          type: integer
        prompt_tokens_details:
          $ref: '#/components/schemas/PromptTokensDetails'
        completion_tokens_details:
          $ref: '#/components/schemas/CompletionTokensDetails'
    PromptTokensDetails:
      description: 输入 token 的明细。
      type: object
      required: [cached_tokens]
      properties:
        cached_tokens:
          description: 命中提示词缓存的输入 token。
          type: integer
    CompletionTokensDetails:
      description: 输出 token 的明细。
      type: object
      required: [reasoning_tokens]
      properties:
        reasoning_tokens:
          description: 用于思考的输出 token。
          type: integer
    CreateEmbeddingRequest:
      description: 文本向量请求，字段与 OpenAI Embeddings 一致的子集；未列出的字段返回 400。
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        model:
          description: 平台模型目录中的 Embedding 模型 ID（mdl_…）。
          type: string
          minLength: 1
        input:
          $ref: '#/components/schemas/EmbeddingInput'
        encoding_format:
          description: 向量的编码：`float`（默认）为数字数组，`base64` 为小端 float32 数组的 Base64。
          type: string
          enum: [float, base64]
          default: float
        dimensions:
          description: 输出维度，模型支持时生效；不传时为模型的默认维度。
          type: integer
          minimum: 1
    EmbeddingList:
      description: 文本向量结果。
      type: object
      required: [object, data, model, usage]
      properties:
        object:
          description: 固定为 `list`。
          type: string
          enum: [list]
        data:
          description: 向量，与输入一一对应，按 `index` 升序。
          type: array
          items:
            $ref: '#/components/schemas/Embedding'
        model:
          description: 请求中的模型 ID。
          type: string
        usage:
          $ref: '#/components/schemas/EmbeddingUsage'
    Embedding:
      description: 一条输入的向量。
      type: object
      required: [object, index, embedding]
      properties:
        object:
          description: 固定为 `embedding`。
          type: string
          enum: [embedding]
        index:
          description: 对应输入的序号，从 0 开始。
          type: integer
        embedding:
          $ref: '#/components/schemas/EmbeddingVector'
    EmbeddingUsage:
      description: 用量，所有供应商请求之和。
      type: object
      required: [prompt_tokens, total_tokens]
      properties:
        prompt_tokens:
          description: 输入 token。
          type: integer
        total_tokens:
          description: 与 `prompt_tokens` 相同。
          type: integer
    EmbeddingInput:
      description: 一段文本，或文本数组（1 至 256 条），每段不能为空。生成的 DTO 中是 `Object`（ADR-0029 的多类型限制）。
      oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          maxItems: 256
          items:
            type: string
            minLength: 1
    EmbeddingVector:
      description: 向量：`float` 编码为数字数组，`base64` 编码为小端 float32 数组的 Base64 字符串。生成的 DTO 中是 `Object`。
      oneOf:
        - type: array
          items:
            type: number
        - type: string

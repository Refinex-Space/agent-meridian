        - name: project_id
          in: query
          description: 只列出该项目的角色绑定。
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 角色绑定列表。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:

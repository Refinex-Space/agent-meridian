    TokenPrices:
      description: 每百万 token 的单价，十进制字符串，最多 12 位整数、6 位小数；缓存读写与推理分别定价。
      type: object
      required: [input, output, cache_read, cache_write, reasoning]
      additionalProperties: false
      properties:
        input:
          description: 输入 token 的单价。
          type: string
          pattern: '^[0-9]{1,12}(\.[0-9]{1,6})?$'
        output:
          description: 输出 token 的单价。
          type: string
          pattern: '^[0-9]{1,12}(\.[0-9]{1,6})?$'
        cache_read:
          description: 命中提示词缓存的输入 token 的单价。
          type: string
          pattern: '^[0-9]{1,12}(\.[0-9]{1,6})?$'
        cache_write:
          description: 写入提示词缓存的输入 token 的单价。
          type: string
          pattern: '^[0-9]{1,12}(\.[0-9]{1,6})?$'
        reasoning:
          description: 推理 token 的单价。
          type: string
          pattern: '^[0-9]{1,12}(\.[0-9]{1,6})?$'

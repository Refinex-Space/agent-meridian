          type: string
          enum: [ok, auth_failed, unreachable, error]
        http_status:
          description: 对方返回的 HTTP 状态码；没有拿到响应时为 null。
          type: [integer, 'null']
        latency_ms:
          description: 从发起到得到结果的毫秒数。
          type: integer
          format: int64
          minimum: 0
        message:
          description: 失败的说明（不含凭据与响应内容）；成功时为 null。
          type: [string, 'null']
        checked_at:
          description: 检查的时间。
          type: string
          format: date-time

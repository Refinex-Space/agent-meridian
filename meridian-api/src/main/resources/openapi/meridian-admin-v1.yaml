          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 253
    EnvironmentRevision:
      description: 环境的一个修订（不可变）。
      type: object
      required: [environment_id, revision, tier, size, egress_allowlist, created_by, created_at]
      properties:
        environment_id:
          description: 环境 ID。
          type: string
        revision:
          description: 修订号。
          type: integer
          format: int64
        tier:
          $ref: '#/components/schemas/EnvironmentTier'
        size:
          description: 沙箱规格；`none` 档为 null。
          oneOf:
            - $ref: '#/components/schemas/SandboxSize'
            - type: 'null'
        egress_allowlist:
          description: 出网白名单。
          type: array
          items:
            type: string
        created_by:
          description: 产生该修订的主体标识。
          type: string
        created_at:
          description: 产生时间。
          type: string
          format: date-time
    EnvironmentRevisionPage:
      description: 一页环境修订。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的条目。
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentRevision'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    Skill:
      description: 技能：版本化的 `SKILL.md` 与附带文件，属于项目。
      type: object
      required: [id, tenant_id, project_id, name, description, latest_version, created_at, updated_at]
      properties:
        id:
          description: 技能 ID（skl_…）。
          type: string
        tenant_id:
          description: 所属租户 ID。
          type: string
        project_id:
          description: 所属项目 ID。
          type: string
        name:
          description: 技能名（frontmatter 的 `name`），项目内唯一。
          type: string
        description:
          description: 最新版本 frontmatter 的 `description`。
          type: string
        latest_version:
          description: 最新版本号。
          type: integer
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        updated_at:
          description: 最近一次上传新版本的时间。
          type: string
          format: date-time
    SkillPage:
      description: 一页技能。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的条目。
          type: array
          items:
            $ref: '#/components/schemas/Skill'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    SkillPackage:
      description: 技能包：`SKILL.md` 与附带文件。
      type: object
      required: [files]
      additionalProperties: false
      properties:
        files:
          description: 文件，必须含 `SKILL.md`；至多 100 个，路径不能重复。
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SkillFileContent'
    SkillFileContent:
      description: 技能包中的一个文件。
      type: object
      required: [path, content]
      additionalProperties: false
      properties:
        path:
          description: 相对路径，例如 `SKILL.md`、`scripts/md_to_docx.py`；不能以 `/` 开头、不能含 `..` 与反斜杠。
          type: string
          minLength: 1
          maxLength: 255
        content:
          description: 文件内容（UTF-8 文本），至多 1 MB。
          type: string
    SkillVersion:
      description: 技能的一个版本（不可变）。
      type: object
      required: [skill_id, version, name, description, files, created_by, created_at]
      properties:
        skill_id:
          description: 技能 ID。
          type: string
        version:
          description: 版本号，从 1 开始。
          type: integer
        name:
          description: frontmatter 的 `name`。
          type: string
        description:
          description: frontmatter 的 `description`。
          type: string
        files:
          description: 文件清单，按路径排序。
          type: array
          items:
            $ref: '#/components/schemas/SkillFile'
        created_by:
          description: 上传者的主体标识。
          type: string
        created_at:
          description: 上传时间。
          type: string
          format: date-time
    SkillFile:
      description: 技能版本中的一个文件。
      type: object
      required: [path, size, sha256]
      properties:
        path:
          description: 相对路径。
          type: string
        size:
          description: 字节数。
          type: integer
        sha256:
          description: 内容的 SHA-256（十六进制）。
          type: string
    SkillVersionPage:
      description: 一页技能版本。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的条目。
          type: array
          items:
            $ref: '#/components/schemas/SkillVersion'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    McpTransport:
      description: MCP 传输：`streamable_http` 或 `sse`（旧版 HTTP + SSE）。
      type: string
      enum: [streamable_http, sse]
    SideEffect:
      description: 工具调用的副作用等级：`none` 无副作用；`idempotent` 重复执行结果相同；`non_idempotent` 有副作用，恢复时不重放。
      type: string
      enum: [none, idempotent, non_idempotent]
    McpServer:
      description: 登记的 MCP 服务。
      type: object
      required: [id, tenant_id, project_id, name, transport, url, header_secret_ids, side_effect, tool_side_effects, tools,
                 probed_at, last_check, created_at, updated_at]
      properties:
        id:
          description: MCP 服务 ID（mcp_…）。
          type: string
        tenant_id:
          description: 所属租户 ID。
          type: string
        project_id:
          description: 所属项目 ID。
          type: string
        name:
          description: 服务名，项目内唯一，也是工具名前缀 `mcp__{name}__` 中的部分。
          type: string
        transport:
          $ref: '#/components/schemas/McpTransport'
        url:
          description: 服务端点。
          type: string
        header_secret_ids:
          description: 注入的请求头：头名 → 凭据 ID。
          type: object
          additionalProperties:
            type: string
        side_effect:
          description: 服务级副作用等级，作用于没有单独标注的工具；为 null 时按 `non_idempotent` 处理。
          oneOf:
            - $ref: '#/components/schemas/SideEffect'
            - type: 'null'
        tool_side_effects:
          description: 按工具单独标注的副作用等级：工具名 → 等级。
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SideEffect'
        tools:
          description: 最近一次探测到的工具清单，按名字排序。
          type: array
          items:
            $ref: '#/components/schemas/McpTool'
        probed_at:
          description: 最近一次探测成功的时间。
          type: string
          format: date-time
        last_check:
          description: 最近一次探测（登记、修改或重新探测）的结果，即连接状态；T19b 之前登记、之后没有再探测过的服务为 null。
          oneOf:
            - $ref: '#/components/schemas/ConnectivityCheck'
            - type: 'null'
        created_at:
          description: 登记时间。
          type: string
          format: date-time
        updated_at:
          description: 最近一次修改或探测的时间。
          type: string
          format: date-time
    McpTool:
      description: MCP 服务的一个工具。
      type: object
      required: [name, description, side_effect]
      properties:
        name:
          description: 服务端的工具名（不含前缀）。
          type: string
        description:
          description: 服务端给出的说明；没有时为空字符串。
          type: string
        side_effect:
          $ref: '#/components/schemas/SideEffect'
    WebhookEventType:
      description: 可订阅的事件类型（架构设计「Webhook」）。
      type: string
      enum: [session.status_idle, session.status_requires_action, session.error, session.status_terminated]
    WebhookRequest:
      description: Webhook 的内容（创建，或整体替换）。
      type: object
      required: [url, events]
      additionalProperties: false
      properties:
        url:
          description: 接收方地址，http 或 https，不带用户信息。
          type: string
          minLength: 1
          maxLength: 2048
        events:
          description: 订阅的事件类型，至少一个，不重复。
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
        description:
          description: 说明；可空。
          type: [string, 'null']
          maxLength: 500
        enabled:
          description: 是否启用，默认启用。
          type: boolean
    Webhook:
      description: 项目的 Webhook。签名密钥不在其中。
      type: object
      required: [id, tenant_id, project_id, url, events, description, enabled, created_by, created_at, updated_at]
      properties:
        id:
          description: Webhook ID（whk_…）。
          type: string
        tenant_id:
          description: 租户 ID。
          type: string
        project_id:
          description: 项目 ID。
          type: string
        url:
          description: 接收方地址。
          type: string
        events:
          description: 订阅的事件类型。
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        description:
          description: 说明；没有时为 null。
          type: [string, 'null']
        enabled:
          description: 是否启用。
          type: boolean
        created_by:
          description: 创建者的主体标识。
          type: string
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        updated_at:
          description: 最近一次修改时间。
          type: string
          format: date-time
    CreatedWebhook:
      description: 新建的 Webhook，带签名密钥明文（只出现这一次）。
      type: object
      required: [id, tenant_id, project_id, url, events, description, enabled, created_by, created_at, updated_at, signing_secret]
      properties:
        id:
          description: Webhook ID（whk_…）。
          type: string
        tenant_id:
          description: 租户 ID。
          type: string
        project_id:
          description: 项目 ID。
          type: string
        url:
          description: 接收方地址。
          type: string
        events:
          description: 订阅的事件类型。
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        description:
          description: 说明；没有时为 null。
          type: [string, 'null']
        enabled:
          description: 是否启用。
          type: boolean
        created_by:
          description: 创建者的主体标识。
          type: string
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        updated_at:
          description: 最近一次修改时间。
          type: string
          format: date-time
        signing_secret:
          description: |
            签名密钥（whsec_…）。接收方用它校验 `Meridian-Signature: t={ts},v1={hex}`：`v1` 是以密钥对 `{ts}.{请求体原文}` 计算的
            HMAC-SHA256 的十六进制，`ts` 是 Unix 秒。
          type: string
    WebhookPage:
      description: 一页 Webhook。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的条目。
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    McpServerPage:
      description: 一页 MCP 服务。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的条目。
          type: array
          items:
            $ref: '#/components/schemas/McpServer'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    McpServerRequest:
      description: MCP 服务的内容（登记，或整体替换）。
      type: object
      required: [name, transport, url]
      additionalProperties: false
      properties:
        name:
          description: 服务名：小写字母开头，小写字母、数字、下划线，至多 32 个字符。
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
        transport:
          $ref: '#/components/schemas/McpTransport'
        url:
          description: 服务端点（http 或 https）。
          type: string
          maxLength: 2048
        header_secret_ids:
          description: 注入的请求头：头名（字母、数字、短横线）→ 本项目可用的凭据 ID；至多 8 个。
          type: object
          maxProperties: 8
          additionalProperties:
            type: string
        side_effect:
          description: 服务级副作用等级；不给出时按 `non_idempotent` 处理。
          oneOf:
            - $ref: '#/components/schemas/SideEffect'
            - type: 'null'
        tool_side_effects:
          description: 按工具单独标注的副作用等级：工具名 → 等级。
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SideEffect'
    PermissionBehavior:
      description: 规则命中后的结果：`allow` 放行、`deny` 拒绝、`ask` 需要确认。
      type: string
      enum: [allow, deny, ask]
    PermissionRule:
      description: 租户或项目策略中的一条权限规则。
      type: object
      required: [id, tenant_id, project_id, tool_name, rule_content, behavior, source, source_action_id, created_by, created_at]
      properties:
        id:
          description: 规则 ID（prl_…）。
          type: string
        tenant_id:
          description: 所属租户 ID。
          type: string
        project_id:
          description: 所属项目 ID；租户策略为 null。
          type: [string, 'null']
        tool_name:
          description: 工具名，例如 `bash`、`mcp__crm__lookup_order`。
          type: string
        rule_content:
          description: 规则内容（路径 glob、命令前缀、域名、资源 ID）；为 null 表示整工具规则。
          type: [string, 'null']
        behavior:
          $ref: '#/components/schemas/PermissionBehavior'
        source:
          description: '`policy`：管理员添加；`remembered`：审批时“记住此决定”（项目级）写入。'
          type: string
          enum: [policy, remembered]
        source_action_id:
          description: 记住的决定来源的待处理动作 ID（act_…）；管理员添加的为 null。
          type: [string, 'null']
        created_by:
          description: 添加者或做出决定的主体标识。
          type: string
        created_at:
          description: 添加时间。
          type: string
          format: date-time
    PermissionRulePage:
      description: 一页权限规则。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的条目。
          type: array
          items:
            $ref: '#/components/schemas/PermissionRule'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    PermissionRuleRequest:
      description: 添加一条权限规则。
      type: object
      required: [tool_name, behavior]
      additionalProperties: false
      properties:
        tool_name:
          description: 工具名，至多 200 个字符。
          type: string
          minLength: 1
          maxLength: 200
        rule_content:
          description: 规则内容，至多 1000 个字符；不给出或为 null 表示整工具规则。
          type: [string, 'null']
          maxLength: 1000
        behavior:
          $ref: '#/components/schemas/PermissionBehavior'
    Problem:
      description: RFC 9457 错误响应，扩展字段 `code` 与 `request_id`。
      type: object
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type:
          description: 错误类型 URI，`urn:meridian:error:<code>`。
          type: string
        title:
          description: 错误码的简短标题。
          type: string
        status:
          description: HTTP 状态码。
          type: integer
        detail:
          description: 本次错误的说明，不含凭据与内部信息。
          type: [string, 'null']
        instance:
          description: 请求路径。
          type: string
        code:
          description: 错误码，格式 `<领域>.<原因>`。
          type: string
        request_id:
          description: 本次请求的 ID，与响应头 `X-Request-Id` 相同。
          type: string
        errors:
          description: 字段校验失败的明细，只在 `request.validation_failed` 时出现。
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
        references:
          description: 引用方，只在资源仍被引用（`secret.in_use`、`catalog.in_use`、`skill.in_use`、`mcp_server.in_use`）时出现。
          type: array
          items:
            $ref: '#/components/schemas/ResourceReference'
    FieldViolation:
      description: 一个字段的校验失败。
      type: object
      required: [field, message]
      properties:
        field:
          description: 字段名（snake_case），嵌套字段用点号连接。
          type: string
        message:
          description: 失败原因。
          type: string
    BudgetLevel:
      description: 预算级别。
      type: string
      enum: [tenant, project, api_key, session]
    Budget:
      description: 一级预算（单位 token，ADR-0048）。
      type: object
      required:
        [id, tenant_id, level, scope_id, project_id, soft_limit_tokens, hard_limit_tokens, period, current_period,
         used_tokens, created_by, created_at, updated_at]
      properties:
        id:
          description: 预算 ID（bdg_…）。
          type: string
        tenant_id:
          description: 所属租户 ID。
          type: string
        level:
          $ref: '#/components/schemas/BudgetLevel'
        scope_id:
          description: 范围 ID（项目、API Key 或会话）；为 null 表示该级所有范围的默认值，租户级总为 null。
          type: [string, 'null']
        project_id:
          description: 范围所在的项目：项目级为该项目，API Key 级为 Key 所在的项目；其余为 null。
          type: [string, 'null']
        soft_limit_tokens:
          description: 软阈值（每周期的 token），越过时告警；为 null 表示不告警。
          type: [integer, 'null']
          format: int64
        hard_limit_tokens:
          description: 硬阈值（每周期的 token），达到后拒绝模型调用；为 null 表示不限。
          type: [integer, 'null']
          format: int64
        period:
          description: 计数周期：`monthly`（自然月，UTC）或 `total`（会话的整个生命周期）。
          type: string
          enum: [monthly, total]
        current_period:
          description: 当前周期：`yyyy-MM` 或 `total`。
          type: string
        used_tokens:
          description: 当前周期的账本用量；默认值不对应具体范围，为 null。
          type: [integer, 'null']
          format: int64
        created_by:
          description: 创建者的主体标识。
          type: string
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        updated_at:
          description: 最近一次修改时间。
          type: string
          format: date-time
    BudgetPage:
      description: 一页预算。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的预算。
          type: array
          items:
            $ref: '#/components/schemas/Budget'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    CreateBudgetRequest:
      description: 设置一级预算。
      type: object
      required: [level, hard_limit_tokens]
      additionalProperties: false
      properties:
        level:
          $ref: '#/components/schemas/BudgetLevel'
        scope_id:
          description: 范围 ID：项目级为项目 ID，API Key 级为 Key ID，会话级为会话 ID；不给表示该级的默认值。租户级不能给。
          type: string
          minLength: 1
          maxLength: 64
        soft_limit_tokens:
          description: 软阈值；不给或为 null 表示不告警。不能大于硬阈值。
          type: [integer, 'null']
          format: int64
          minimum: 0
        hard_limit_tokens:
          description: 硬阈值；为 null 表示不限。
          type: [integer, 'null']
          format: int64
          minimum: 0
    UpdateBudgetRequest:
      description: 修改预算的阈值，整体替换。
      type: object
      required: [soft_limit_tokens, hard_limit_tokens]
      additionalProperties: false
      properties:
        soft_limit_tokens:
          description: 软阈值；为 null 表示不告警。不能大于硬阈值。
          type: [integer, 'null']
          format: int64
          minimum: 0
        hard_limit_tokens:
          description: 硬阈值；为 null 表示不限。
          type: [integer, 'null']
          format: int64
          minimum: 0
    BudgetAlert:
      description: 一条预算告警。
      type: object
      required: [id, level, scope_id, period, kind, threshold_tokens, used_tokens, occurred_at]
      properties:
        id:
          description: 告警 ID（bal_…）。
          type: string
        level:
          $ref: '#/components/schemas/BudgetLevel'
        scope_id:
          description: 范围 ID（租户级为租户 ID）。
          type: string
        period:
          description: 周期：`yyyy-MM` 或 `total`。
          type: string
        kind:
          description: 告警种类：`soft_limit_reached`（越过软阈值）。
          type: string
          enum: [soft_limit_reached]
        threshold_tokens:
          description: 越过的阈值。
          type: integer
          format: int64
        used_tokens:
          description: 越过时的账本用量。
          type: integer
          format: int64
        occurred_at:
          description: 越过阈值的那条用量的发生时间。
          type: string
          format: date-time
    BudgetAlertPage:
      description: 一页预算告警。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的告警，从新到旧。
          type: array
          items:
            $ref: '#/components/schemas/BudgetAlert'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    AuditActor:
      description: 审计的操作者。
      type: object
      required: [type, subject]
      properties:
        type:
          description: 类型：`console_user`（控制台用户）、`api_key`、`service`（平台服务，例如 runtime 的权限引擎）。
          type: string
        subject:
          description: 主体标识、API Key ID 或服务名。
          type: string
    AuditLog:
      description: 一条审计日志。
      type: object
      required: [id, occurred_at, action, project_id, actor, resource_type, resource_id, session_id, details]
      properties:
        id:
          description: 审计 ID（产生它的 outbox 消息 ID）。
          type: string
        occurred_at:
          description: 发生时间。
          type: string
          format: date-time
        action:
          description: 动作，`<资源>.<动作>`。
          type: string
        project_id:
          description: 项目 ID；租户级操作为 null。
          type: [string, 'null']
        actor:
          description: 操作者；没有时为 null。
          oneOf:
            - $ref: '#/components/schemas/AuditActor'
            - type: 'null'
        resource_type:
          description: 资源类型。
          type: [string, 'null']
        resource_id:
          description: 资源 ID。
          type: [string, 'null']
        session_id:
          description: 相关会话 ID。
          type: [string, 'null']
        details:
          description: 补充信息，字段随动作不同；不含凭据。
          type: object
          additionalProperties: true
    AuditLogPage:
      description: 一页审计日志。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的审计日志，从新到旧。
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    UsageKind:
      description: 计量种类：模型 token、Embedding token、rerank token、沙箱 vCPU 秒、搜索次数、知识库存储 GB 天（ADR-0051）、知识检索次数（T19）。
      type: string
      enum: [model_tokens, embedding_tokens, rerank_tokens, sandbox_vcpu_seconds, search_calls, knowledge_storage_gb_days,
             knowledge_search_calls]
    UsageReport:
      description: 按账本明细聚合的用量。
      type: object
      required: [from, to, group_by, rows]
      properties:
        from:
          description: 起始时间（含）。
          type: string
          format: date-time
        to:
          description: 结束时间（不含）。
          type: string
          format: date-time
        group_by:
          description: 实际使用的聚合维度。
          type: array
          items:
            type: string
        rows:
          description: 聚合结果，按维度与种类排序。
          type: array
          items:
            $ref: '#/components/schemas/UsageReportRow'
    UsageRecord:
      description: 账本中的一条用量记录（ADR-0048）。缓存读写是输入的子集，推理是输出的子集。
      type: object
      required: [id, occurred_at, kind, project_id, api_key_id, agent_id, agent_version_id, session_id, thread_id, turn_id,
                 model_id, provider_account_id, purpose, input_tokens, output_tokens, cache_read_tokens,
                 cache_write_tokens, reasoning_tokens, quantity, price_book_id, price_book_version, currency, cost,
                 attributes]
      properties:
        id:
          description: 记录 ID（产生它的用量消息 ID）。
          type: string
        occurred_at:
          description: 用量发生的时间。
          type: string
          format: date-time
        kind:
          $ref: '#/components/schemas/UsageKind'
        project_id:
          description: 项目 ID。
          type: [string, 'null']
        api_key_id:
          description: API Key ID；控制台用户与平台内部发起的调用为 null。
          type: [string, 'null']
        agent_id:
          description: 智能体 ID。
          type: [string, 'null']
        agent_version_id:
          description: 智能体版本 ID。
          type: [string, 'null']
        session_id:
          description: 会话 ID。
          type: [string, 'null']
        thread_id:
          description: 线程 ID。
          type: [string, 'null']
        turn_id:
          description: 轮次 ID。
          type: [string, 'null']
        model_id:
          description: 模型 ID；沙箱、搜索与存储没有模型。
          type: [string, 'null']
        provider_account_id:
          description: 供应商账号 ID。
          type: [string, 'null']
        purpose:
          description: 调用用途，例如 `inference`、`compaction`、`embedding`、`rerank`。
          type: [string, 'null']
        input_tokens:
          description: 输入 token。
          type: integer
          format: int64
        output_tokens:
          description: 输出 token。
          type: integer
          format: int64
        cache_read_tokens:
          description: 命中提示词缓存的输入 token。
          type: integer
          format: int64
        cache_write_tokens:
          description: 写入提示词缓存的输入 token。
          type: integer
          format: int64
        reasoning_tokens:
          description: 推理用的输出 token。
          type: integer
          format: int64
        quantity:
          description: 计量数量（十进制字符串）：token 种类为输入加输出，沙箱为 vCPU 秒，搜索为次数。
          type: string
        price_book_id:
          description: 计价用的价格表；没有定价时为 null。
          type: [string, 'null']
        price_book_version:
          description: 价格表版本。
          type: [integer, 'null']
        currency:
          description: 成本的币种；没有定价时为 null。
          type: [string, 'null']
        cost:
          description: 成本（十进制字符串，12 位小数，不舍入）；没有定价时为 null。
          type: [string, 'null']
        attributes:
          description: 种类特有的信息（例如知识库存储量的 `knowledge_base_id`、`day`）。
          type: object
          additionalProperties: true
    UsageRecordPage:
      description: 一页用量记录。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的记录。
          type: array
          items:
            $ref: '#/components/schemas/UsageRecord'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    ProjectBudgetStatus:
      description: 项目当前周期的预算消耗。
      type: object
      required: [project_id, period, period_start, period_end, used_tokens, soft_limit_tokens, hard_limit_tokens,
                 limit_source, state]
      properties:
        project_id:
          description: 项目 ID。
          type: string
        period:
          description: 周期（UTC 自然月），例如 `2026-11`。
          type: string
        period_start:
          description: 周期的开始（含）。
          type: string
          format: date-time
        period_end:
          description: 周期的结束（不含）。
          type: string
          format: date-time
        used_tokens:
          description: 本周期已用的 token（模型调用的输入加输出，账本入账后累加）。
          type: integer
          format: int64
        soft_limit_tokens:
          description: 软阈值；不告警时为 null。
          type: [integer, 'null']
          format: int64
        hard_limit_tokens:
          description: 硬阈值；不限时为 null，没有设置任何预算时为 0。
          type: [integer, 'null']
          format: int64
        limit_source:
          description: 阈值从哪里来：`project` 本项目的预算，`default` 项目级默认值，`none` 都没有（硬阈值为 0）。
          type: string
          enum: [project, default, none]
        state:
          description: '`ok` 未到软阈值；`soft_exceeded` 越过软阈值；`hard_exceeded` 达到硬阈值，本项目的模型调用会被拒绝。'
          type: string
          enum: [ok, soft_exceeded, hard_exceeded]
    UsageReportRow:
      description: 一组用量的合计。没有按某个维度聚合时，该维度的字段为 null。
      type: object
      required:
        [day, project_id, model_id, agent_id, api_key_id, kind, currency, records, quantity, input_tokens, output_tokens,
         cache_read_tokens, cache_write_tokens, reasoning_tokens, cost]
      properties:
        day:
          description: UTC 日期。
          type: [string, 'null']
          format: date
        project_id:
          description: 项目 ID。
          type: [string, 'null']
        model_id:
          description: 模型 ID；沙箱与搜索没有模型。
          type: [string, 'null']
        agent_id:
          description: 智能体 ID；直通接口与 Embedding 没有智能体。
          type: [string, 'null']
        api_key_id:
          description: API Key ID；控制台用户与平台内部发起的调用没有 API Key。
          type: [string, 'null']
        kind:
          $ref: '#/components/schemas/UsageKind'
        currency:
          description: 成本的币种；没有定价的用量为 null。
          type: [string, 'null']
        records:
          description: 账本记录数。
          type: integer
          format: int64
        quantity:
          description: 计量数量的合计（十进制字符串）：token 种类为输入加输出，沙箱为 vCPU 秒，搜索为次数。
          type: string
        input_tokens:
          description: 输入 token。
          type: integer
          format: int64
        output_tokens:
          description: 输出 token。
          type: integer
          format: int64
        cache_read_tokens:
          description: 命中提示词缓存的输入 token。
          type: integer
          format: int64
        cache_write_tokens:
          description: 写入提示词缓存的输入 token。
          type: integer
          format: int64
        reasoning_tokens:
          description: 推理用的输出 token。
          type: integer
          format: int64
        cost:
          description: 成本的合计（十进制字符串，12 位小数，不舍入）；没有定价时为 null。
          type: [string, 'null']

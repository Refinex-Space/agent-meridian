        `scope_id` 表示该级所有范围的默认值，具体范围的预算覆盖默认值；租户级只有一条，不能给 `scope_id`。没有设置的级别硬阈值
        为 0：新租户在四级都有值之前不能调用模型（"不限"也要显式设置为 null）。同一级别、同一范围已有预算时 409
        `budget.exists`，改用修改接口。限额在提交后同步到 runtime。
      parameters:

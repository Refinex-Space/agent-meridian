      summary: 测试连通性
      description: |
        用账号的端点与凭据列一次模型清单（OpenAI 兼容 `GET {base_url}/models`、Anthropic `GET /v1/models`、Gemini
        `GET /v1beta/models`），不产生用量；端点先按地址策略再校验一次。结果写进账号的 `last_check` 并写审计
        `provider_account.tested`。连不上或凭据无效不是错误响应，而是 `status` 不为 `ok` 的结果。需要模型目录的管理权限。

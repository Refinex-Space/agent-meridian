      summary: 吊销 API Key
      description: 吊销后各服务在 1 秒内拒绝该 Key（经 Pub/Sub `key.revoked` 淘汰缓存）。已吊销的 Key 再次吊销返回原结果。不可恢复。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/ApiKeyOk'
        '401':

openapi: 3.1.0
info:
  title: AgentMeridian Admin API
  version: 1.0.0
  summary: 控制台使用的管理 API：租户、租户设置、项目、成员、角色绑定、API Key、凭据与模型目录，智能体与版本、环境、技能、MCP 服务与权限策略，预算、用量报表与审计日志。
  description: |
    只供控制台调用（ADR-0042），与控制台同版本发布，不对业务系统开放；业务系统使用公开 API（`meridian-v1.yaml`）。

    **认证。** 每个请求带 `Authorization: Bearer <控制台用户令牌>`。正式实现是 OIDC access token（T14b）；在那之前只有
    `dev`、`test` profile 接受开发期令牌，其他 profile 一律拒绝。API Key 不能调用管理 API。

    **授权。** 角色来自 control-plane 的角色绑定（架构设计「授权」）：租户所有者、租户管理员作用于整个租户；项目开发者、
    项目观察者、审批人只作用于绑定的项目。创建租户、修改租户配额只有平台管理员可以执行。没有权限时返回 403 `access.forbidden`。

    **约定。**
    - 字段名 snake_case；时间为 RFC 3339 UTC。
    - 列表接口用游标分页：`?limit=&after=`，返回 `{data, has_more, next_cursor}`。
    - 所有写操作支持 `Idempotency-Key` 请求头：24 小时内同键同请求返回首次的结果（响应带 `Idempotent-Replayed: true`）。
    - 错误一律为 RFC 9457 `application/problem+json`，扩展字段 `code` 与 `request_id`；每个响应带 `X-Request-Id`。
servers:
  - url: http://localhost:18081
    description: 本地开发（scripts/dev/run-control-plane.sh）
security:
  - ConsoleAuth: []
tags:
  - name: Tenants
    description: 租户：计费与管理的单位，带并发配额与事件保留天数。
  - name: Projects
    description: 项目：隔离与授权的基本单位，API Key、智能体、会话都挂在项目下。
  - name: Members
    description: 成员与角色绑定：谁能在租户与项目中做什么。按用户标识添加，或按邮箱邀请、在用户首次登录时绑定（ADR-0053）。
  - name: Me
    description: 当前登录的控制台用户：身份、所在租户与角色、在某个项目上能做什么（ADR-0053）。
  - name: ApiKeys
    description: 项目下的 API Key：业务系统调用公开 API 的凭据，明文只在创建时返回一次。
  - name: Secrets
    description: 凭据库：信封加密保存供应商与外部服务的凭据，只能写入、轮换、删除，任何接口都读不出明文（ADR-0045）。
  - name: ProviderAccounts
    description: 供应商账号：类型、端点、凭据引用与限流（ADR-0045、ADR-0046）。
  - name: Models
    description: 模型目录：租户内全部项目可用的模型，带上下文窗口、能力、备用模型与价格表。
  - name: PriceBooks
    description: 价格表：按版本计价，新版本发布即生效，已有用量记录不受影响。
  - name: Agents
    description: 智能体与版本：草稿可修改，发布后不可变；规格见 `schema/agent-spec.schema.json`（ADR-0047）。
  - name: Environments
    description: 环境：执行档位、沙箱规格与出网白名单，修改即递增修订号并保留历史。
  - name: Skills
    description: 技能包：`SKILL.md` 与附带文件，版本化，文件存对象存储。
  - name: McpServers
    description: MCP 服务：端点、传输、凭据引用与工具的副作用等级；登记时探测并保存工具清单。
  - name: PermissionRules
    description: 租户与项目策略：五层权限合成中的第 2、3 层，含“记住此决定”的项目级规则。
  - name: Budgets
    description: 四级预算（租户、项目、API Key、会话）的软硬阈值与告警，单位 token（ADR-0048）。
  - name: Usage
    description: 用量报表：按账本明细聚合，成本按记录中的价格表版本计算（ADR-0048）。
  - name: AuditLogs
    description: 审计日志：只追加，按时间、操作者、资源、动作检索（ADR-0048）。
  - name: Webhooks
    description: 项目的 Webhook：会话状态变化时 runtime 向业务系统推送事件，签名密钥只在创建时返回一次；投递记录与重投在公开 API（ADR-0049）。

paths:
  /admin/v1/tenants:
    post:
      operationId: createTenant
      tags: [Tenants]
      summary: 创建租户
      description: 平台管理员创建租户，并把 `owner` 加为成员、授予租户所有者。配额不给出时取平台默认值。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
            example:
              name: 财务共享中心
              owner: {subject: 3f1c2a9e-7b1d-4c55-9a0e-2d8f6b4e1a77, email: lin@example.com, display_name: 林晓}
      responses:
        '201':
          $ref: '#/components/responses/TenantCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listTenants
      tags: [Tenants]
      summary: 列出租户
      description: 平台管理员看到全部租户；其他用户只看到自己是成员的租户。已删除的租户不出现，按创建时间从早到晚。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: 租户列表。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/tenants/{tenant_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getTenant
      tags: [Tenants]
      summary: 查看租户
      responses:
        '200':
          $ref: '#/components/responses/TenantOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateTenant
      tags: [Tenants]
      summary: 修改租户
      description: 修改租户名称。配额用 `PUT /admin/v1/tenants/{tenant_id}/quotas`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          $ref: '#/components/responses/TenantOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteTenant
      tags: [Tenants]
      summary: 删除租户
      description: |
        只有租户所有者可以删除。租户被标记为已删除，其下全部项目随之删除、全部 API Key 立即吊销；会话等运行数据的清理由后续任务处理。
        删除不可恢复。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/tenants/{tenant_id}/quotas:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    put:
      operationId: updateTenantQuotas
      tags: [Tenants]
      summary: 修改租户配额
      description: 平台管理员修改并发配额与事件保留天数。新的并发配额随即下发到 runtime（`config.invalidate`）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantQuotas'
            example:
              max_concurrent_turns: 50
              event_retention_days: 180
      responses:
        '200':
          $ref: '#/components/responses/TenantOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/tenants/{tenant_id}/settings:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getTenantSettings
      tags: [Tenants]
      summary: 查看租户设置
      responses:
        '200':
          $ref: '#/components/responses/TenantSettingsOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateTenantSettings
      tags: [Tenants]
      summary: 修改租户设置
      description: 整体替换租户设置。runtime 经 `config.invalidate` 立即使用新设置：新的轮次带新的租户提示词，联网搜索按新后端。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSettings'
            example:
              system_prompt: 本组织的回答使用简体中文；涉及金额时注明币种。
              web_search: {backend: searxng, base_url: 'http://searxng.internal:8080', secret_id: null}
      responses:
        '200':
          $ref: '#/components/responses/TenantSettingsOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/tenants/{tenant_id}/projects:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createProject
      tags: [Projects]
      summary: 创建项目
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            example:
              name: 报销助手
              description: 员工报销问答与单据预审。
      responses:
        '201':
          $ref: '#/components/responses/ProjectCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listProjects
      tags: [Projects]
      summary: 列出项目
      description: 列出租户中未删除的项目，按创建时间从早到晚。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: 项目列表。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/tenants/{tenant_id}/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [Projects]
      summary: 查看项目
      responses:
        '200':
          $ref: '#/components/responses/ProjectOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateProject
      tags: [Projects]
      summary: 修改项目
      description: 只修改给出的字段。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          $ref: '#/components/responses/ProjectOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: 删除项目
      description: 项目被标记为已删除，其下全部 API Key 立即吊销、项目级角色绑定随之删除。删除不可恢复。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/me:
    get:
      operationId: getMe
      tags: [Me]
      summary: 当前用户
      description: |
        当前控制台用户的身份、是否平台管理员、所在的租户与在其中的角色绑定（不分页，按租户 ID 排序；已删除的租户不出现）。控制台
        启动时先调用它：首次登录时按邮箱绑定邀请也在这时完成（任一管理接口都会触发）。任何已认证的用户都可以调用。
      responses:
        '200':
          description: 当前用户。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/me/access:
    get:
      operationId: getMyAccess
      tags: [Me]
      summary: 当前用户在租户或项目上的权限
      description: |
        当前用户在某个租户（给出 `project_id` 时在该项目）上能执行的操作类别与公开 API 作用域，按同一套角色矩阵算出；控制台据此
        显示或禁用操作，不在前端复刻角色矩阵。没有角色时两个列表都为空（不是 403）。任何已认证的用户都可以调用。
      parameters:
        - name: tenant_id
          in: query
          required: true
          description: 租户 ID。
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: project_id
          in: query
          description: 项目 ID；不给时只算租户级的操作类别，作用域为空。
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: 权限。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/tenants/{tenant_id}/members:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: addMember
      tags: [Members]
      summary: 添加成员
      description: |
        把用户加入租户：给出身份提供方中的用户标识（`subject`）时直接生效；只给邮箱时成员为 `invited`，用户第一次登录控制台时，
        control-plane 按令牌中经过验证的邮箱（`email` 声明且 `email_verified` 为真）找到邀请并写入用户标识，状态变为 `active`，
        写审计 `member.bound`；该用户在这个租户中已经是成员时，邀请的角色合并到已有成员上（ADR-0053）。成员加入后还没有任何角色，
        用角色绑定授权（已邀请的成员同样可以授予）。同一租户中同一用户标识、或同一邮箱的未绑定邀请只能有一个（409
        `member.already_exists`）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
            example:
              subject: 8a2d4c6e-1f3b-4a5c-9e7d-0b2f4d6a8c1e
              email: zhou@example.com
              display_name: 周岚
      responses:
        '201':
          $ref: '#/components/responses/MemberCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listMembers
      tags: [Members]
      summary: 列出成员
      description: 按加入时间从早到晚。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: 成员列表。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/tenants/{tenant_id}/members/{member_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/MemberId'
    get:
      operationId: getMember
      tags: [Members]
      summary: 查看成员
      responses:
        '200':
          $ref: '#/components/responses/MemberOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateMember
      tags: [Members]
      summary: 修改成员
      description: 只修改给出的字段；主体标识不能修改。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          $ref: '#/components/responses/MemberOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: removeMember
      tags: [Members]
      summary: 移除成员
      description: 成员与其全部角色绑定一起删除。不能移除租户最后一位所有者（409 `member.last_owner`）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':

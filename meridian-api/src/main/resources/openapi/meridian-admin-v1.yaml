  /admin/v1/tenants/{tenant_id}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: listAuditLogs
      tags: [AuditLogs]
      summary: 查询审计日志
      description: |
        管理操作、凭据访问、权限判定、待处理动作的回应、有副作用的工具执行、沙箱命令、轮次结束与预算告警，按发生时间从新到旧。
        时间范围左闭右开，不传时为最近 30 天；条件之间是"且"。审计日志只追加，任何接口都不能修改或删除。
      parameters:
        - name: from
          in: query
          description: 起始时间（含）；默认 `to` 之前 30 天。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 结束时间（不含）；默认当前时间。
          schema:
            type: string
            format: date-time
        - name: action
          in: query
          description: 动作，例如 `api_key.created`、`permission.decided`。
          schema:
            type: string
            minLength: 1
        - name: actor
          in: query
          description: 操作者：控制台用户的主体标识、API Key ID 或服务名。
          schema:
            type: string
            minLength: 1
        - name: resource_type
          in: query
          description: 资源类型，例如 `api_key`、`tool_call`、`pending_action`。
          schema:
            type: string
            minLength: 1
        - name: resource_id
          in: query
          description: 资源 ID。
          schema:
            type: string
            minLength: 1
        - name: project_id
          in: query
          description: 项目 ID。
          schema:
            type: string
            minLength: 1
        - name: session_id
          in: query
          description: 会话 ID：运行时的审计（权限判定、工具执行、沙箱命令等）带会话。
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: 审计日志。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/tenants/{tenant_id}/projects/{project_id}/webhooks:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: 创建 Webhook
      description: |
        地址只允许 http、https，按地址策略校验：链路本地与云元数据地址始终拒绝，内网与回环地址只在平台放行的网段内允许（企业内的
        接收方由平台配置放行）。签名密钥由平台生成，**只在本响应中出现一次**（幂等重放同样返回）；之后无法再读出，丢失时删除后重建。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
            example:
              url: https://crm.example.com/hooks/meridian
              events: [session.status_idle, session.status_requires_action]
              description: CRM 工单回写
              enabled: true
      responses:
        '201':
          description: 已创建，带签名密钥明文。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedWebhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: 列出 Webhook
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Webhook 列表，按创建时间从早到晚。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/tenants/{tenant_id}/projects/{project_id}/webhooks/{webhook_id}:rotate-secret:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WebhookId'
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      summary: 轮换签名密钥
      description: |
        生成新的签名密钥并立即替换旧的，新密钥只在本响应（与它的幂等重放）中出现；Webhook ID 不变（D72）。之后的投递（含重试与重投）
        都用新密钥签名，runtime 收到 `config.invalidate` 后立即生效（至多 60 秒的缓存）。接收方要先接受新密钥再轮换，否则这期间的
        投递验签失败、按退避重试。写审计 `webhook.secret_rotated`，审计中没有密钥。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已轮换，带新签名密钥的明文。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedWebhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/tenants/{tenant_id}/projects/{project_id}/webhooks/{webhook_id}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/WebhookId'
    get:
      operationId: getWebhook
      tags: [Webhooks]
      summary: 查看 Webhook
      responses:
        '200':
          $ref: '#/components/responses/WebhookOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateWebhook
      tags: [Webhooks]
      summary: 修改 Webhook
      description: |
        整体替换地址、订阅的事件、说明与是否启用，签名密钥不变。之后的每次投递都按新配置（最长 60 秒后各 runtime 节点生效）；停用后
        尚未成功的投递以失败结束。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: 删除 Webhook
      description: |
        删除后不再产生新的投递，尚未成功的投递以失败结束；已有的投递记录仍可在公开 API 查询，直到过了保留期。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    ConsoleAuth:
      type: http
      scheme: bearer
      description: 控制台用户的令牌：OIDC access token（T14b）；T14a 只有 `dev`、`test` profile 的开发期令牌。

  headers:
    XRequestId:
      description: 本次请求的 ID：沿用合法的传入值，否则由服务端生成；排查问题时提供它。
      required: true
      schema:
        type: string
    IdempotentReplayed:
      description: 值为 `true` 表示这是同一 `Idempotency-Key` 首次请求结果的重放。
      schema:
        type: string
        enum: ['true']

  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      description: 租户 ID（ten_…）。
      schema:
        type: string
    ProjectId:
      name: project_id
      in: path
      required: true
      description: 项目 ID（prj_…）。
      schema:
        type: string
    MemberId:
      name: member_id
      in: path
      required: true
      description: 成员 ID（mbr_…）。
      schema:
        type: string
    ApiKeyId:
      name: api_key_id
      in: path
      required: true
      description: API Key ID（key_…）。
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 幂等键，24 小时内同键同请求返回首次结果。
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Limit:
      name: limit
      in: query
      description: 每页条数。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    After:
      name: after
      in: query
      description: 游标：上一页响应的 `next_cursor`。不传时从第一页开始。
      schema:
        type: string
        minLength: 1
    SecretId:
      name: secret_id
      in: path
      required: true
      description: 凭据 ID（sec_…）。
      schema:
        type: string
    ProviderAccountId:
      name: provider_account_id
      in: path
      required: true
      description: 供应商账号 ID（prv_…）。
      schema:
        type: string
    ModelId:
      name: model_id
      in: path
      required: true
      description: 模型 ID（mdl_…）。
      schema:
        type: string
    PriceBookId:
      name: price_book_id
      in: path
      required: true
      description: 价格表 ID（prb_…）。
      schema:
        type: string

    AgentId:
      name: agent_id
      in: path
      required: true
      description: 智能体 ID（agt_…）。
      schema:
        type: string
    AgentVersionNumber:
      name: version
      in: path
      required: true
      description: 智能体版本号，从 1 开始。
      schema:
        type: integer
        minimum: 1
    BaseVersion:
      name: base
      in: query
      required: true
      description: 对比的基准版本号。
      schema:
        type: integer
        minimum: 1
    TargetVersion:
      name: target
      in: query
      required: true
      description: 对比的目标版本号。
      schema:
        type: integer
        minimum: 1
    EnvironmentId:
      name: environment_id
      in: path
      required: true
      description: 环境 ID（env_…）。
      schema:
        type: string
    Revision:
      name: revision
      in: path
      required: true
      description: 环境修订号，从 1 开始。
      schema:
        type: integer
        format: int64
        minimum: 1
    SkillId:
      name: skill_id
      in: path
      required: true
      description: 技能 ID（skl_…）。
      schema:
        type: string
    SkillVersionNumber:
      name: version
      in: path
      required: true
      description: 技能版本号，从 1 开始。
      schema:
        type: integer
        minimum: 1
    McpServerId:
      name: mcp_server_id
      in: path
      required: true
      description: MCP 服务 ID（mcp_…）。
      schema:
        type: string
    PermissionRuleId:
      name: permission_rule_id
      in: path
      required: true
      description: 权限规则 ID（prl_…）。
      schema:
        type: string
    WebhookId:
      name: webhook_id
      in: path
      required: true
      description: Webhook ID（whk_…）。
      schema:
        type: string

    BudgetId:
      name: budget_id
      in: path
      required: true
      description: 预算 ID（bdg_…）。
      schema:
        type: string
    UsageFrom:
      name: from
      in: query
      description: 起始时间（含）；默认当前 UTC 月份的第一天。
      schema:
        type: string
        format: date-time
    UsageTo:
      name: to
      in: query
      description: 结束时间（不含）；默认当前时间。与 `from` 相距不超过 366 天。
      schema:
        type: string
        format: date-time
    UsageGroupBy:
      name: group_by
      in: query
      description: |
        聚合维度，逗号分隔，可以组合，例如 `day,model`：`day`（UTC 日期）、`model`、`agent`、`api_key`，租户报表另有 `project`。
        不传时只按计量种类与币种汇总；未知的维度返回 400 `usage.invalid_query`。
      schema:
        type: string
        pattern: '^[a-z_]+(,[a-z_]+)*$'
        maxLength: 64

  /admin/v1/tenants/{tenant_id}/secrets:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createSecret
      tags: [Secrets]
      summary: 写入凭据
      description: |
        凭据值经信封加密后保存（ADR-0045），这个响应与之后的任何接口都不返回明文。`project_id` 为 null 时是租户级凭据，供应商账号、
        租户设置与全部项目都可以引用；给出项目时只有该项目的资源可以引用。用 `Idempotency-Key` 重放时以首次的结果为准，凭据值不参与
        幂等的请求指纹。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretRequest'
            example:
              name: DashScope 生产
              project_id: null
              value: sk-0123456789abcdef
      responses:
        '201':
          $ref: '#/components/responses/SecretCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listSecrets
      tags: [Secrets]
      summary: 列出凭据
      description: 租户级与各项目的凭据，按创建时间从早到晚；只有元数据与引用方，不含明文。

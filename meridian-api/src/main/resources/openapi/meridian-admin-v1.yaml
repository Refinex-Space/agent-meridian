  /admin/v1/tenants/{tenant_id}/projects/{project_id}/api-keys:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createApiKey
      tags: [ApiKeys]
      summary: 创建 API Key
      description: |
        响应中的 `key` 是明文，只在这一次返回，平台只保存它的 SHA-256；之后只能看到 `display_prefix`。作用域与限流在创建后
        不能修改，需要变化时创建新 Key 并吊销旧 Key。用 `Idempotency-Key` 重放时同样返回首次的明文。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
            example:
              name: 报销系统生产环境
              scopes: [sessions:read, sessions:write]
              rate_limit_per_minute: 1200
      responses:
        '201':
          description: 已创建，响应带一次性的明文。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listApiKeys
      tags: [ApiKeys]
      summary: 列出 API Key
      description: 包括已吊销的 Key，按创建时间从早到晚；不含明文与哈希。
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: API Key 列表。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'

  /admin/v1/tenants/{tenant_id}/projects/{project_id}/api-keys/{api_key_id}:

        `openai_compatible` 必须给出 `base_url`（DashScope 兼容模式、vLLM、SGLang 等私有化推理服务都走它）；`anthropic`、`gemini`
        的 `base_url` 为 null 时用官方端点。端点只允许 http(s)，链路本地、云元数据与保留地址一律拒绝，内网地址只在平台放行的网段内
        允许（ADR-0045）。`secret_id` 必须是本租户的租户级凭据。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:

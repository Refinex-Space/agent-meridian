          schema:
            $ref: '#/components/schemas/UsageReport'
    BadRequest:
      description: |
        请求不合法：`request.invalid`（格式错误）、`request.validation_failed`（字段校验失败，见 `errors`；智能体规格的错误
        字段是 `spec.` 加 JSON 路径）、`request.invalid_cursor`（游标无效）、`request.invalid_id`（ID 格式错误）、
        `mcp_server.probe_failed`（连接 MCP 服务、握手或列出工具失败）。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: '`auth.unauthenticated`：缺少 `Authorization: Bearer`；`auth.invalid_console_token`：令牌无效或已过期。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: '`access.forbidden`：当前用户在该租户或项目中没有执行该操作的角色。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        资源不存在或已删除：`tenant.not_found`、`project.not_found`、`member.not_found`、`role_binding.not_found`、
        `api_key.not_found`、`secret.not_found`、`catalog.provider_account_not_found`、`catalog.model_not_found`、
        `catalog.price_book_not_found`、`agent.not_found`、`agent.version_not_found`、`environment.not_found`、
        `environment.revision_not_found`、`skill.not_found`、`skill.version_not_found`、`mcp_server.not_found`、
        `permission_rule.not_found`。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        `member.already_exists`：该主体已是租户成员；`role_binding.already_exists`：同一角色已授予；`member.last_owner`：
        不能移除或撤销最后一位所有者；`secret.name_taken`、`catalog.name_taken`：同一范围内已有同名的凭据、供应商账号、模型或
        价格表；`agent.name_taken`、`environment.name_taken`、`skill.name_taken`、`mcp_server.name_taken`：项目内已有同名的
        资源；`agent.version_published`：已发布的版本不可修改、删除或再次发布；`permission_rule.already_exists`：相同的规则
        已存在；`secret.in_use`、`catalog.in_use`、`skill.in_use`、`mcp_server.in_use`：资源仍被引用，`references` 列出引用方；
        `idempotency.key_reused`、`idempotency.in_progress`：幂等键冲突。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: '`internal.error`：服务内部错误，`detail` 不含内部信息，排查以 `request_id` 关联日志；`service.unavailable`（503）：依赖暂时不可用。'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Tenant:
      description: 租户。
      type: object
      required: [id, name, max_concurrent_turns, event_retention_days, created_at, updated_at]
      properties:
        id:
          description: 租户 ID（ten_…）。
          type: string
        name:
          description: 名称。
          type: string
        max_concurrent_turns:
          description: 并发配额：该租户同时执行的轮次上限，下发到 runtime 的租户并发计数。
          type: integer
        event_retention_days:
          description: 会话事件的保留天数（架构设计「数据保留」）。
          type: integer
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        updated_at:
          description: 最近一次修改时间。
          type: string
          format: date-time
    TenantPage:
      description: 一页租户。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的租户。
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    MemberIdentity:
      description: |
        用户在身份提供方的标识与资料：`subject` 与 `email` 至少给一个（否则 400 `member.identity_required`）。只给邮箱时成员处于
        已邀请状态，用户第一次登录控制台时按令牌中经过验证的邮箱绑定（ADR-0053）。
      type: object
      properties:
        subject:
          description: 主体标识（默认是 OIDC 的 `sub`，与 control-plane 配置的用户标识声明一致），在身份提供方内唯一且不变。
          type: string
          minLength: 1
          maxLength: 255
        email:
          description: 邮箱：只给邮箱时用于首次登录绑定，比较时不区分大小写；同时给出用户标识时只用于展示。
          type: string
          minLength: 3
          maxLength: 320
        display_name:
          description: 显示名称。
          type: string
          maxLength: 128
    CreateTenantRequest:
      description: 创建租户的请求。
      type: object
      required: [name, owner]
      additionalProperties: false
      properties:
        name:
          description: 名称，1 到 128 个字符。
          type: string
          minLength: 1
          maxLength: 128
        owner:
          $ref: '#/components/schemas/MemberIdentity'
        max_concurrent_turns:
          description: 并发配额，1 到 10000；不给出时取平台默认值（默认 20）。
          type: integer
          minimum: 1
          maximum: 10000
        event_retention_days:
          description: 事件保留天数，1 到 3650；不给出时取平台默认值（默认 365）。
          type: integer
          minimum: 1
          maximum: 3650
    UpdateTenantRequest:
      description: 修改租户的请求。
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          description: 新名称，1 到 128 个字符。
          type: string
          minLength: 1
          maxLength: 128
    TenantQuotas:
      description: 租户配额。
      type: object
      required: [max_concurrent_turns, event_retention_days]
      additionalProperties: false
      properties:
        max_concurrent_turns:
          description: 并发配额，1 到 10000。
          type: integer
          minimum: 1
          maximum: 10000
        event_retention_days:
          description: 事件保留天数，1 到 3650。
          type: integer
          minimum: 1
          maximum: 3650
    TenantSettings:
      description: 租户设置：系统提示词的租户层与联网搜索后端（ADR-0035）。
      type: object
      required: [system_prompt, web_search]
      additionalProperties: false
      properties:
        system_prompt:
          description: 租户层系统提示词，位于平台基础提示词之后、智能体提示词之前；空字符串表示没有。最多 8000 个字符。
          type: string
          maxLength: 8000
        web_search:
          description: 联网搜索后端；为 null 时 `web_search` 工具返回"未配置"。
          oneOf:
            - $ref: '#/components/schemas/WebSearchSettings'
            - type: 'null'
    WebSearchSettings:
      description: 联网搜索后端。
      type: object
      required: [backend, base_url, secret_id]
      additionalProperties: false
      properties:
        backend:
          description: 后端类型：`searxng`（自建 SearXNG）或 `bocha`（博查）。
          type: string
          enum: [searxng, bocha]
        base_url:
          description: 后端的基础 URL（http 或 https）；链路本地、云元数据、保留地址拒绝，内网地址只在平台放行的网段内允许（ADR-0045）。
          type: string
          maxLength: 2048
        secret_id:
          description: 本租户的租户级凭据 ID（sec_…）；不需要凭据时为 null。
          type: [string, 'null']
    Project:
      description: 项目。
      type: object
      required: [id, tenant_id, name, description, created_at, updated_at]
      properties:
        id:
          description: 项目 ID（prj_…）。
          type: string
        tenant_id:
          description: 所属租户 ID。
          type: string
        name:
          description: 名称。
          type: string
        description:
          description: 说明；空字符串表示没有。
          type: string
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        updated_at:
          description: 最近一次修改时间。
          type: string
          format: date-time
    ProjectPage:
      description: 一页项目。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的项目。
          type: array
          items:
            $ref: '#/components/schemas/Project'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    CreateProjectRequest:
      description: 创建项目的请求。
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          description: 名称，1 到 128 个字符。
          type: string
          minLength: 1
          maxLength: 128
        description:
          description: 说明，最多 1000 个字符。
          type: string
          maxLength: 1000
    UpdateProjectRequest:
      description: 修改项目的请求，只修改给出的字段。
      type: object
      additionalProperties: false
      properties:
        name:
          description: 新名称，1 到 128 个字符。
          type: string
          minLength: 1
          maxLength: 128
        description:
          description: 新说明，最多 1000 个字符。
          type: string
          maxLength: 1000
    Me:
      description: 当前控制台用户。
      type: object
      required: [subject, email, platform_admin, memberships]
      properties:
        subject:
          description: 用户标识（按 control-plane 配置的声明取得）。
          type: string
        email:
          description: 令牌中经过验证的邮箱；没有时为 null。
          type: [string, 'null']
        platform_admin:
          description: 是否平台管理员。
          type: boolean
        memberships:
          description: 所在的租户与在其中的角色绑定。
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    Membership:
      description: 用户在一个租户中的成员身份。
      type: object
      required: [tenant_id, tenant_name, member_id, role_bindings]
      properties:
        tenant_id:
          description: 租户 ID。
          type: string
        tenant_name:
          description: 租户名称。
          type: string
        member_id:
          description: 成员 ID。
          type: string
        role_bindings:
          description: 角色绑定。
          type: array
          items:
            $ref: '#/components/schemas/MembershipRole'
    MembershipRole:
      description: 成员身份中的一个角色。
      type: object
      required: [role_binding_id, role, project_id]
      properties:
        role_binding_id:
          description: 角色绑定 ID。
          type: string
        role:
          $ref: '#/components/schemas/Role'
        project_id:
          description: 项目级角色绑定的项目；租户级角色为 null。
          type: [string, 'null']
    MyAccess:
      description: 当前用户在租户或项目上的权限。
      type: object
      required: [tenant_id, project_id, permissions, scopes]
      properties:
        tenant_id:
          description: 租户 ID。
          type: string
        project_id:
          description: 项目 ID；只看租户时为 null。
          type: [string, 'null']
        permissions:
          description: 能执行的操作类别（角色矩阵的列，见 control-plane 的 `security.rbac.Permission`），按取值排序。
          type: array
          items:
            $ref: '#/components/schemas/PermissionName'
        scopes:
          description: 在该项目上调用公开 API 的作用域（ADR-0044），按取值排序；没有给出项目时为空。
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
    PermissionName:
      description: 操作类别（角色矩阵的列），取值与 `security.rbac.Permission` 一一对应。
      type: string
      enum: [console_access, tenant_create, tenant_list_all, tenant_quota_update, tenant_read, tenant_update,
             tenant_delete, member_read, member_write, owner_role_manage, project_create, model_read, model_write,
             secret_read, secret_write, project_read, project_update, project_delete, api_key_read, api_key_write,
             agent_read, agent_write, budget_read, budget_write, audit_read, usage_read, pending_action_decide,
             session_read, session_write, model_invoke, knowledge_read, knowledge_write]
    Member:
      description: 租户成员。
      type: object
      required: [id, tenant_id, subject, status, email, display_name, created_at, updated_at]
      properties:
        id:
          description: 成员 ID（mbr_…）。
          type: string
        tenant_id:
          description: 所属租户 ID。
          type: string
        subject:
          description: 主体标识（OIDC 的 `sub`）；按邮箱邀请、尚未登录绑定时为 null。
          type: [string, 'null']
        status:
          description: '`active` 已绑定用户标识；`invited` 按邮箱邀请、等待用户首次登录绑定。两种状态都可以授予角色。'
          type: string
          enum: [active, invited]
        email:
          description: 邮箱；空字符串表示没有。
          type: string
        display_name:
          description: 显示名称；空字符串表示没有。
          type: string
        created_at:
          description: 加入时间。
          type: string
          format: date-time
        updated_at:
          description: 最近一次修改时间。
          type: string
          format: date-time
    MemberPage:
      description: 一页成员。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的成员。
          type: array
          items:
            $ref: '#/components/schemas/Member'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    AddMemberRequest:
      description: 添加成员的请求：`subject` 与 `email` 至少给一个（否则 400 `member.identity_required`）。
      type: object
      additionalProperties: false
      properties:
        subject:
          description: 主体标识（默认是 OIDC 的 `sub`）。
          type: string
          minLength: 1
          maxLength: 255
        email:
          description: 邮箱：只给邮箱时成员为 `invited`，用户首次登录时按令牌中经过验证的邮箱绑定（ADR-0053）。
          type: string
          minLength: 3
          maxLength: 320
        display_name:
          description: 显示名称。
          type: string
          maxLength: 128
    UpdateMemberRequest:
      description: 修改成员的请求，只修改给出的字段。
      type: object
      additionalProperties: false
      properties:
        email:
          description: 新邮箱。
          type: string
          maxLength: 320
        display_name:
          description: 新显示名称。
          type: string
          maxLength: 128
    Role:
      description: |
        角色（架构设计「授权」）：`tenant_owner` 租户所有者、`tenant_admin` 租户管理员、`project_developer` 项目开发者、
        `project_viewer` 项目观察者、`approver` 审批人。
      type: string
      enum: [tenant_owner, tenant_admin, project_developer, project_viewer, approver]
    RoleBinding:
      description: 角色绑定：某成员在租户或某项目中的一个角色。
      type: object
      required: [id, tenant_id, member_id, role, project_id, created_at]
      properties:
        id:
          description: 角色绑定 ID（rbd_…）。
          type: string
        tenant_id:
          description: 所属租户 ID。
          type: string
        member_id:
          description: 成员 ID。
          type: string
        role:
          $ref: '#/components/schemas/Role'
        project_id:
          description: 项目 ID；租户级角色为 null。
          type: [string, 'null']
        created_at:
          description: 授予时间。
          type: string
          format: date-time
    RoleBindingPage:
      description: 一页角色绑定。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的角色绑定。
          type: array
          items:
            $ref: '#/components/schemas/RoleBinding'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    CreateRoleBindingRequest:
      description: 授予角色的请求。
      type: object
      required: [member_id, role]
      additionalProperties: false
      properties:
        member_id:
          description: 成员 ID。
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/Role'
        project_id:
          description: 项目 ID；项目级角色必填，租户级角色不能给出。
          type: string
          minLength: 1
    ApiKeyScope:
      description: |
        API Key 的作用域（架构设计「授权」）：`sessions:write`、`sessions:read`、`knowledge:read`、`knowledge:write`、
        `files:write`、`models:invoke`、`actions:respond`（只能回应待处理动作，供审批系统使用，ADR-0053）。
      type: string
      enum: ['sessions:write', 'sessions:read', 'knowledge:read', 'knowledge:write', 'files:write', 'models:invoke',
             'actions:respond']
    ApiKey:
      description: API Key 的元数据，不含明文与哈希。
      type: object
      required:
        [id, tenant_id, project_id, name, display_prefix, scopes, rate_limit_per_minute, status, expires_at, created_at,
         revoked_at]
      properties:
        id:
          description: API Key ID（key_…）。
          type: string
        tenant_id:
          description: 所属租户 ID。
          type: string
        project_id:
          description: 所属项目 ID。
          type: string
        name:
          description: 名称。
          type: string
        display_prefix:
          description: 用于辨认的前缀：`mk_live_` 加随机部分的前 8 位。
          type: string
        scopes:
          description: 作用域。
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        rate_limit_per_minute:
          description: 每分钟请求上限（令牌桶的容量与每分钟补充量）。
          type: integer
        status:
          description: '`active` 有效；`revoked` 已吊销；`expired` 已过期。'
          type: string
          enum: [active, revoked, expired]
        expires_at:
          description: 过期时间；为 null 表示不过期。
          type: [string, 'null']
          format: date-time
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        revoked_at:
          description: 吊销时间；未吊销时为 null。
          type: [string, 'null']
          format: date-time
    CreatedApiKey:
      description: 新创建的 API Key，带一次性的明文。
      type: object
      required:
        [id, tenant_id, project_id, name, display_prefix, scopes, rate_limit_per_minute, status, expires_at, created_at,
         revoked_at, key]
      properties:
        id:
          description: API Key ID（key_…）。
          type: string
        tenant_id:
          description: 所属租户 ID。
          type: string
        project_id:
          description: 所属项目 ID。
          type: string
        name:
          description: 名称。
          type: string
        display_prefix:
          description: 用于辨认的前缀：`mk_live_` 加随机部分的前 8 位。
          type: string
        scopes:
          description: 作用域。
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        rate_limit_per_minute:
          description: 每分钟请求上限。
          type: integer
        status:
          description: 新建的 Key 总是 `active`。
          type: string
          enum: [active, revoked, expired]
        expires_at:
          description: 过期时间；为 null 表示不过期。
          type: [string, 'null']
          format: date-time
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        revoked_at:
          description: 吊销时间；新建时为 null。
          type: [string, 'null']
          format: date-time
        key:
          description: API Key 明文（`mk_live_…`），只在本响应中出现一次，平台不保存。
          type: string
    ApiKeyPage:
      description: 一页 API Key。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的 API Key。
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    CreateApiKeyRequest:
      description: 创建 API Key 的请求。
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          description: 名称，1 到 128 个字符，便于辨认用途。
          type: string
          minLength: 1
          maxLength: 128
        scopes:
          description: 作用域，至少一个，不重复。
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        expires_at:
          description: 过期时间，必须晚于当前时间；不给出表示不过期。
          type: string
          format: date-time
        rate_limit_per_minute:
          description: 每分钟请求上限，1 到 100000；不给出时取平台默认值（默认 600）。
          type: integer
          minimum: 1
          maximum: 100000
    UpdateApiKeyRequest:
      description: 修改 API Key 的请求。
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          description: 新名称，1 到 128 个字符。
          type: string
          minLength: 1
          maxLength: 128
    ResourceReference:
      description: 引用了某个资源的另一个资源。
      type: object
      required: [type, id, name]
      properties:
        type:
          description: 引用方的资源类型：`provider_account`、`model`、`tenant_settings`、`mcp_server`、`agent_version`。
          type: string
        id:
          description: 引用方的 ID；租户设置为租户 ID。
          type: string
        name:
          description: 引用方的名称；没有名称时为 null。
          type: [string, 'null']
    Secret:
      description: 凭据的元数据。任何接口都不返回明文（ADR-0045）。
      type: object
      required: [id, tenant_id, project_id, name, version, created_by, created_at, updated_at, last_used_at, references]
      properties:
        id:
          description: 凭据 ID（sec_…）。
          type: string
        tenant_id:
          description: 所属租户 ID。
          type: string
        project_id:
          description: 所属项目 ID；为 null 表示租户级凭据。
          type: [string, 'null']
        name:
          description: 名称，在同一范围（租户级或同一项目）内唯一。
          type: string
        version:
          description: 版本：创建为 1，每次轮换加一。
          type: integer
        created_by:
          description: 创建者的主体标识。
          type: string
        created_at:
          description: 创建时间。
          type: string
          format: date-time
        updated_at:
          description: 最近一次写入（创建或轮换）的时间。
          type: string
          format: date-time
        last_used_at:
          description: 最近一次被 runtime 解析的时间；没有用过时为 null。
          type: [string, 'null']
          format: date-time
        references:
          description: 引用这个凭据的资源；没有时为空数组。
          type: array
          items:
            $ref: '#/components/schemas/ResourceReference'
    SecretPage:
      description: 一页凭据。
      type: object
      required: [data, has_more, next_cursor]
      properties:
        data:
          description: 本页的凭据。
          type: array
          items:
            $ref: '#/components/schemas/Secret'
        has_more:
          description: 是否还有下一页。
          type: boolean
        next_cursor:
          description: 下一页的游标；没有下一页时为 null。
          type: [string, 'null']
    CreateSecretRequest:
      description: 写入凭据。
      type: object
      required: [name, value]
      additionalProperties: false
      properties:
        name:
          description: 名称，1 到 128 个字符。
          type: string
          minLength: 1
          maxLength: 128
        project_id:
          description: 所属项目 ID；不传或为 null 表示租户级凭据。
          type: [string, 'null']
        value:
          description: 凭据值（API Key、令牌等），只写不读，最多 16384 个字符。
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
    RotateSecretRequest:
      description: 轮换凭据。
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value:
          description: 新的凭据值，只写不读，最多 16384 个字符。
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
    ProviderType:
      description: 供应商类型（ADR-0046）：`openai_compatible`（含 DashScope 兼容模式与私有化推理服务）、`anthropic`、`gemini`。
      type: string
      enum: [openai_compatible, anthropic, gemini]
    RateLimit:
      description: 每分钟的请求与 token 上限，用 Redis 令牌桶等待，最长 30 秒（架构设计「模型调用」）。
      type: object
      required: [rpm, tpm]
      additionalProperties: false
      properties:
        rpm:
          description: 每分钟请求上限；为 null 表示不限（模型上为 null 表示用账号的）。
          type: [integer, 'null']
          minimum: 1
        tpm:
          description: 每分钟 token 上限；为 null 表示不限（模型上为 null 表示用账号的）。
          type: [integer, 'null']
          minimum: 1
    ConnectivityCheck:
      description: 一次连通性检查（供应商账号的连通性测试、MCP 服务的探测）的结果（ADR-0053）。
      type: object
      required: [status, http_status, latency_ms, message, checked_at]
      properties:
        status:
          description: |
            `ok` 连通且凭据有效；`auth_failed` 对方返回 401 或 403；`unreachable` 连接失败或超时；`error` 其他失败（对方返回其他

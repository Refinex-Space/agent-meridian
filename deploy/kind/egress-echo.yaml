# P14（出网控制）在本机 kind 集群中的白名单内外目标，不依赖公网（T12b）：两个服务 allowed-echo 与 denied-echo，由同一个
# Envoy 以 direct_response 应答，响应体是服务名。测试环境的白名单只写 allowed-echo 的域名，代理按 values-kind.yaml 允许访问本命名空间。
# 由 scripts/dev/deploy-sandbox.sh 部署；只用于本机 kind 集群。
apiVersion: v1
kind: Namespace
metadata:
  name: meridian-egress-test
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-echo
  namespace: meridian-egress-test
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: allowed
        address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: allowed
              route_config:
                virtual_hosts:
                - name: allowed
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    direct_response: { status: 200, body: { inline_string: "allowed-echo\n" } }
              http_filters:
              - name: envoy.filters.http.router
                typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
      - name: denied
        address: { socket_address: { address: 0.0.0.0, port_value: 8081 } }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: denied
              route_config:
                virtual_hosts:
                - name: denied
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    direct_response: { status: 200, body: { inline_string: "denied-echo\n" } }
              http_filters:
              - name: envoy.filters.http.router
                typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-echo
  namespace: meridian-egress-test
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: egress-echo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: egress-echo }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: envoy
          image: envoyproxy/envoy:distroless-v1.40.2
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
          ports:
            - { name: allowed, containerPort: 8080 }
            - { name: denied, containerPort: 8081 }
          readinessProbe:
            tcpSocket: { port: allowed }
            periodSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/envoy, readOnly: true }
      volumes:
        - name: config
          configMap: { name: egress-echo }
---
apiVersion: v1
kind: Service
metadata:
  name: allowed-echo
  namespace: meridian-egress-test
spec:
  selector: { app.kubernetes.io/name: egress-echo }
  ports:
    - { name: http, port: 80, targetPort: allowed }
---
apiVersion: v1
kind: Service
metadata:
  name: denied-echo
  namespace: meridian-egress-test
spec:
  selector: { app.kubernetes.io/name: egress-echo }
  ports:
    - { name: http, port: 80, targetPort: denied }

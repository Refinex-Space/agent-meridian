{{- /*
沙箱 Pod 默认拒绝全部出网与入网，只允许 sandbox-router 访问执行服务（8888），见架构设计「沙箱出网」。
T12b 部署出网代理时再加一条只允许访问代理的出网规则。
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-default-deny
  labels:
    {{- include "meridian-sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "meridian-sandbox.sandboxSelector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "meridian-sandbox.routerSelector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8888
  egress: []
{{- if .Values.router.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-router
  labels:
    {{- include "meridian-sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "meridian-sandbox.routerSelector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        {{- range .Values.router.clientNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    # kubelet 探针
    - ports:
        - protocol: TCP
          port: 8081
  egress:
    # 只转发到本命名空间的沙箱 Pod
    - to:
        - podSelector:
            matchLabels:
              {{- include "meridian-sandbox.sandboxSelector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8888
{{- end }}

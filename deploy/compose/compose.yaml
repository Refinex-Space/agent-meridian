# 本地开发的数据组件：PostgreSQL（pgvector + zhparser）、Redis、MinIO 与初始化桶的一次性容器。
# 启停用 scripts/dev/up.sh、scripts/dev/down.sh；连接信息与口令见同目录的 .env.example。
# 端口只绑定 127.0.0.1，并避开 5432、6379、9000 等常被本机其他服务占用的默认端口。
# app profile（T14a）：control-plane、runtime 与脚本化模型服务，镜像由 scripts/dev/build-images.sh 用 Jib 构建；
#   docker compose -f deploy/compose/compose.yaml --profile app up -d，端到端检查用 scripts/dev/app-smoke.sh。
# auth profile（T14b，ADR-0043、ADR-0044）：Keycloak，导入开发 realm deploy/keycloak/meridian-dev-realm.json；
#   docker compose -f deploy/compose/compose.yaml --env-file deploy/compose/.env --profile auth up -d keycloak
# app profile 另有 knowledge 与 doc-parser（T18）：doc-parser 镜像由 build-images.sh 用 docker build 构建（含 Docling 模型，约 10 分钟）。
# 可观测（observability）等可选组件由后续任务以 profile 加入（架构设计「本地开发」）。
name: agent-meridian

services:
  postgres:
    build:
      context: ../docker/postgres
      args:
        # 构建时需要代理才设置，例如 http://http.docker.internal:3128（Docker Desktop 内置代理）
        HTTP_PROXY: ${MERIDIAN_DOCKER_BUILD_PROXY:-}
        HTTPS_PROXY: ${MERIDIAN_DOCKER_BUILD_PROXY:-}
    image: agent-meridian/postgres:17-local
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 中设置 POSTGRES_PASSWORD}
      MERIDIAN_MIGRATOR_PASSWORD: ${MERIDIAN_MIGRATOR_PASSWORD:?在 .env 中设置 MERIDIAN_MIGRATOR_PASSWORD}
      MERIDIAN_APP_PASSWORD: ${MERIDIAN_APP_PASSWORD:?在 .env 中设置 MERIDIAN_APP_PASSWORD}
    ports:
      - "127.0.0.1:${MERIDIAN_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # 走 TCP：初始化期间临时实例只监听 Unix 套接字，此时不算健康
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d meridian"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    # Redis 7.4（架构设计「技术基线」要求 7.4 或以上）
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${MERIDIAN_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO 官方已停止发布容器镜像（Docker Hub 与 quay.io 均不可拉取），改用 Chainguard 从 MinIO 源码构建的镜像，
    # 按摘要固定（RELEASE.2026-10-23T20-06-51Z）。镜像内带 mc，健康检查与初始化都用它。
    image: chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?在 .env 中设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?在 .env 中设置 MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MERIDIAN_MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${MERIDIAN_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 一次性容器：创建平台使用的桶，已存在时跳过
  minio-init:
    image: chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MERIDIAN_S3_BUCKET: ${MERIDIAN_S3_BUCKET:-meridian}
    entrypoint: ["sh", "-c"]
    command:
      - mc alias set meridian http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "meridian/$$MERIDIAN_S3_BUCKET"
    restart: "no"

  # ---- auth profile（T14b）：OIDC 的参考实现 Keycloak（开发模式，数据在容器内，重建即回到 realm 文件的状态）----
  keycloak:
    profiles: [auth, app]
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?在 .env 中设置 KEYCLOAK_ADMIN_PASSWORD}
      # 令牌的 iss 固定为宿主访问的地址：开发脚本、浏览器与容器内的服务看到同一个签发方；容器内的服务经 keycloak:8080 取公钥
      KC_HOSTNAME: http://localhost:${MERIDIAN_KEYCLOAK_PORT:-18082}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak/meridian-dev-realm.json:/opt/keycloak/data/import/meridian-dev-realm.json:ro
    ports:
      - "127.0.0.1:${MERIDIAN_KEYCLOAK_PORT:-18082}:8080"
    healthcheck:
      # 管理端口 9000 的就绪检查；镜像中没有 curl，用 bash 的 /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  # ---- app profile（T14a）：不接真实模型、不连沙箱集群 ----
  control-plane:
    profiles: [app]
    image: agent-meridian/control-plane:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MERIDIAN_DB_URL: jdbc:postgresql://postgres:5432/meridian
      MERIDIAN_REDIS_HOST: redis
      MERIDIAN_REDIS_PORT: "6379"
      MERIDIAN_APP_PASSWORD: ${MERIDIAN_APP_PASSWORD}
      MERIDIAN_MIGRATOR_PASSWORD: ${MERIDIAN_MIGRATOR_PASSWORD}
      MERIDIAN_RUNTIME_CLIENT_SECRET: ${MERIDIAN_RUNTIME_CLIENT_SECRET:?在 .env 中设置 MERIDIAN_RUNTIME_CLIENT_SECRET}
      MERIDIAN_EGRESS_PROXY_CLIENT_SECRET: ${MERIDIAN_EGRESS_PROXY_CLIENT_SECRET:?在 .env 中设置 MERIDIAN_EGRESS_PROXY_CLIENT_SECRET}
      MERIDIAN_KNOWLEDGE_CLIENT_SECRET: ${MERIDIAN_KNOWLEDGE_CLIENT_SECRET:?在 .env 中设置 MERIDIAN_KNOWLEDGE_CLIENT_SECRET}
      MERIDIAN_KNOWLEDGE_URL: http://knowledge:18083
      MERIDIAN_SERVICE_TOKEN_KEY_DIR: /var/lib/meridian/service-token-keys
      MERIDIAN_SECRET_MASTER_KEY_FILE: /var/lib/meridian/secret-master-key/master.key
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MERIDIAN_S3_BUCKET: ${MERIDIAN_S3_BUCKET:-meridian}
      MERIDIAN_PERSISTENCE_OBJECTSTORE_ENDPOINT: http://minio:9000
      MERIDIAN_OIDC_ISSUER: http://localhost:${MERIDIAN_KEYCLOAK_PORT:-18082}/realms/meridian-dev
      MERIDIAN_OIDC_JWKS_URI: http://keycloak:8080/realms/meridian-dev/protocol/openid-connect/certs
    volumes:
      # 服务 JWT 的签名密钥（ADR-0044）：重建容器后沿用，已签发的令牌仍能校验
      - service-token-keys:/var/lib/meridian/service-token-keys
      # 凭据库的开发主密钥（ADR-0045）：丢了它，库中的凭据就解不开了
      - secret-master-key:/var/lib/meridian/secret-master-key
    ports:
      - "127.0.0.1:${MERIDIAN_CONTROL_PLANE_PORT:-18081}:18081"
    healthcheck:
      # 镜像中没有 curl：用 bash 的 /dev/tcp 请求健康检查（sh 是 dash，没有 /dev/tcp）
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/18081 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  runtime:
    profiles: [app]
    image: agent-meridian/runtime:dev
    depends_on:
      control-plane:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      scripted-model:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MERIDIAN_DB_URL: jdbc:postgresql://postgres:5432/meridian
      MERIDIAN_REDIS_HOST: redis
      MERIDIAN_REDIS_PORT: "6379"
      MERIDIAN_APP_PASSWORD: ${MERIDIAN_APP_PASSWORD}
      MERIDIAN_MIGRATOR_PASSWORD: ${MERIDIAN_MIGRATOR_PASSWORD}
      MERIDIAN_RUNTIME_CLIENT_SECRET: ${MERIDIAN_RUNTIME_CLIENT_SECRET}
      MERIDIAN_CONTROL_PLANE_URL: http://control-plane:18081
      MERIDIAN_OIDC_ISSUER: http://localhost:${MERIDIAN_KEYCLOAK_PORT:-18082}/realms/meridian-dev
      MERIDIAN_OIDC_JWKS_URI: http://keycloak:8080/realms/meridian-dev/protocol/openid-connect/certs
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MERIDIAN_S3_BUCKET: ${MERIDIAN_S3_BUCKET:-meridian}
      MERIDIAN_PERSISTENCE_OBJECTSTORE_ENDPOINT: http://minio:9000
      # 开发配置挂载在 /app/dev-config；供应商目录换成 Compose 网络中的脚本化模型服务
      MERIDIAN_RUNTIME_MODEL_ROUTING_PROVIDERS_DIRECTORY: /app/compose-providers
    volumes:
      - ../../dev-config:/app/dev-config:ro
      - ./app/providers:/app/compose-providers:ro
    ports:
      - "127.0.0.1:${MERIDIAN_RUNTIME_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  scripted-model:
    profiles: [app]
    image: agent-meridian/scripted-model:dev
    ports:
      - "127.0.0.1:${MERIDIAN_SCRIPTED_MODEL_PORT:-18090}:18090"

  # ---- T18：知识库写入 ----
  knowledge:
    profiles: [app]
    image: agent-meridian/knowledge:dev
    depends_on:
      control-plane:
        condition: service_healthy
      runtime:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MERIDIAN_DB_URL: jdbc:postgresql://postgres:5432/meridian
      MERIDIAN_REDIS_HOST: redis
      MERIDIAN_REDIS_PORT: "6379"
      MERIDIAN_APP_PASSWORD: ${MERIDIAN_APP_PASSWORD}
      MERIDIAN_MIGRATOR_PASSWORD: ${MERIDIAN_MIGRATOR_PASSWORD}
      MERIDIAN_KNOWLEDGE_CLIENT_SECRET: ${MERIDIAN_KNOWLEDGE_CLIENT_SECRET}
      MERIDIAN_CONTROL_PLANE_URL: http://control-plane:18081
      MERIDIAN_RUNTIME_URL: http://runtime:8080
      MERIDIAN_DOC_PARSER_URL: http://doc-parser:8000
      MERIDIAN_OIDC_ISSUER: http://localhost:${MERIDIAN_KEYCLOAK_PORT:-18082}/realms/meridian-dev
      MERIDIAN_OIDC_JWKS_URI: http://keycloak:8080/realms/meridian-dev/protocol/openid-connect/certs
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MERIDIAN_S3_BUCKET: ${MERIDIAN_S3_BUCKET:-meridian}
      MERIDIAN_PERSISTENCE_OBJECTSTORE_ENDPOINT: http://minio:9000
    ports:
      - "127.0.0.1:${MERIDIAN_KNOWLEDGE_PORT:-18083}:18083"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/18083 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  doc-parser:
    profiles: [app]
    image: agent-meridian/doc-parser:dev
    ports:
      - "127.0.0.1:${MERIDIAN_DOC_PARSER_PORT:-18084}:8000"

volumes:
  service-token-keys:
  secret-master-key:
  postgres-data:
  redis-data:
  minio-data:

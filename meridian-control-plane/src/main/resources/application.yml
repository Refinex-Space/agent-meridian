# control-plane 的公共配置。环境相关的连接信息在 profile 中：dev 连接本地 compose，test 由 Testcontainers 注入。
spring:
  application:
    name: meridian-control-plane
  threads:
    virtual:
      # MVC 加虚拟线程（架构设计「部署单元」）：请求、定时任务都跑在虚拟线程上，按普通阻塞代码编写
      enabled: true
  jackson:
    deserialization:
      # 请求体中未声明的字段返回 400，不静默忽略（与 runtime 相同）
      fail-on-unknown-properties: true
  flyway:
    # 迁移以 meridian_migrator 执行（spring.flyway.user/password），脚本位置与 schema 由 meridian-persistence 的迁移约定设置
    enabled: true

meridian:
  persistence:
    schema: cp
  security:
    oidc:
      # 控制台用户的 OIDC（ADR-0043）：部署时配置 issuer；用户标识默认取 sub，组取 groups
      audience: meridian
  control-plane:
    tenants:
      # 新租户的默认配额：并发配额默认 20（架构设计「认领」，ADR-0027），事件保留 365 天（「数据保留」）
      default-max-concurrent-turns: 20
      default-event-retention-days: 365
    api-keys:
      # 创建 API Key 时不给出上限的默认值（ADR-0042）
      default-rate-limit-per-minute: 600
    # 平台管理员（ADR-0042、ADR-0043）：主体标识列表，或令牌中组声明的取值；部署时按身份提供方配置
    platform-admins: []
    platform-admin-groups: []
    # 服务 JWT 的签发（ADR-0044）：部署时配置 key-directory（生产改用密钥管理系统，T28）与各服务的客户端
    service-tokens:
      clients: []
    # 凭据库（ADR-0045）：key-encryption 没有默认值，部署必须选 vault（生产）或 local（开发与测试），否则启动失败。
    # vault 需要 address、token（只从环境变量或 Secret 读取），mount 默认 transit、key-name 默认 meridian-secrets
    secrets:
      data-key-cache-ttl: 5m
    # 供应商与搜索后端端点的地址策略（ADR-0045 第 5 条）：链路本地、云元数据、保留地址始终拒绝；回环只在开发与测试放行；
    # 私有网段不配置时全部放行，生产按私有化推理服务所在网段收窄，例如 [10.20.0.0/16]
    provider-endpoints:
      allow-loopback: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentMeridian 控制台</title>
    <script>
      // 首次绘制前按主题设置写入主题（lib/theme.ts 的 meridian.theme：light、dark，没有时跟随系统），避免暗色用户先看到亮色；
      // 之后的切换与跟随系统由 lib/theme.ts 接管。
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem('meridian.theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
